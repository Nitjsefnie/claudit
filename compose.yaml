# Zero-config boot — no .env, no credentials, makes no outbound calls at run
# time. Postgres runs as a container of its own with its own volume, and the
# app ingests the committed fixtures/r2_mini mirror through the R2 client's
# file:// mode, the same default the `smoke` workflow documents as "No
# credentials, no network, nothing to rot".
#
# Every value a real deploy changes arrives as ${VAR:-default} interpolation,
# so a bare `docker compose up` on a machine with no .env resolves to the
# defaults below. Compose reads a .env in the project directory for that
# interpolation — the same file the bare-metal route seeds from
# backend/.env.example — which is how a real bucket or an occupied host port
# is selected.

services:
  db:
    # Same pinned reference as the Dockerfile's FROM line in
    # .github/actions/postgres-image/: local Compose pulls it directly;
    # CI's docker-smoke leg runs the cached copy through
    # .github/docker-smoke.compose.yaml. A test holds them equal.
    image: public.ecr.aws/docker/library/postgres:16.15@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    # First boot only, into an empty data directory: creates the `claudit`
    # application database and the external `claudit_auth` database with the
    # two-column `users` table db.schema_check() requires. The application's
    # own tables are applied by the app at startup (db.apply_schema()).
    # The data directory is a NAMED volume, so `docker compose down` keeps
    # the databases and `down -v` drops them — that is the documented reset.
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./compose/postgres-init.sql:/docker-entrypoint-initdb.d/10-claudit.sql:ro
    # Probes over TCP rather than the default unix socket: during first-boot
    # init the entrypoint runs a temporary server on the socket only, so a
    # socket probe would report healthy while the init script is still
    # running and the app could start against a half-made database. The
    # final server listens on TCP, so healthy means init finished. The start
    # period keeps a slow first boot (initdb plus the init script) from
    # counting against the retries, which would fail the app's
    # `service_healthy` dependency before it ever got the chance.
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      CLAUDIT_DATABASE_URL_VIZ: ${CLAUDIT_DATABASE_URL_VIZ-${DATABASE_URL_VIZ-postgresql://postgres:postgres@db:5432/claudit}}
      CLAUDIT_DATABASE_URL_AUTH: ${CLAUDIT_DATABASE_URL_AUTH-${DATABASE_URL_AUTH-postgresql://postgres:postgres@db:5432/claudit_auth}}
      CLAUDIT_GUEST_LOGIN: ${CLAUDIT_GUEST_LOGIN:-1}
      # file:// mode against the fixtures mounted below: the mirror is test
      # data, not served code, so it is not COPYed into the image. For a real
      # bucket, override these four (and leave no access keys in the tree).
      CLAUDIT_R2_ENDPOINT: ${CLAUDIT_R2_ENDPOINT-${R2_ENDPOINT-file:///opt/claudit/fixtures/r2_mini/}}
      CLAUDIT_R2_BUCKET: ${CLAUDIT_R2_BUCKET-${R2_BUCKET-claude}}
      CLAUDIT_R2_ACCESS_KEY_ID: ${CLAUDIT_R2_ACCESS_KEY_ID-${R2_ACCESS_KEY_ID-}}
      CLAUDIT_R2_SECRET_ACCESS_KEY: ${CLAUDIT_R2_SECRET_ACCESS_KEY-${R2_SECRET_ACCESS_KEY-}}
      CLAUDIT_COLLECT_TURN_CONTEXT: ${CLAUDIT_COLLECT_TURN_CONTEXT:-1}
      CLAUDIT_COLLECT_REQUEST_METADATA: ${CLAUDIT_COLLECT_REQUEST_METADATA:-1}
      CLAUDIT_COLLECT_CACHE_WRITE_TOKENS: ${CLAUDIT_COLLECT_CACHE_WRITE_TOKENS:-1}
      CLAUDIT_COLLECT_CONTEXT_INTAKE: ${CLAUDIT_COLLECT_CONTEXT_INTAKE:-1}
      CLAUDIT_COLLECT_ERROR_TEXT: ${CLAUDIT_COLLECT_ERROR_TEXT:-1}
      CLAUDIT_COLLECT_FILE_EXTRAS: ${CLAUDIT_COLLECT_FILE_EXTRAS:-1}
      CLAUDIT_COLLECT_TOOL_ERROR_KINDS: ${CLAUDIT_COLLECT_TOOL_ERROR_KINDS:-1}
      CLAUDIT_COLLECT_DISPATCH_ANALYTICS: ${CLAUDIT_COLLECT_DISPATCH_ANALYTICS:-1}
      CLAUDIT_COLLECT_GENERATION_SPEED: ${CLAUDIT_COLLECT_GENERATION_SPEED:-1}
      CLAUDIT_FEATURE_USAGE_TIMESERIES: ${CLAUDIT_FEATURE_USAGE_TIMESERIES:-1}
      CLAUDIT_FEATURE_THINKING_OUTPUT: ${CLAUDIT_FEATURE_THINKING_OUTPUT:-1}
      CLAUDIT_FEATURE_LINE_CHURN: ${CLAUDIT_FEATURE_LINE_CHURN:-1}
      CLAUDIT_FEATURE_MODEL_COMPARISON: ${CLAUDIT_FEATURE_MODEL_COMPARISON:-1}
      CLAUDIT_FEATURE_TOKEN_BREAKDOWN: ${CLAUDIT_FEATURE_TOKEN_BREAKDOWN:-1}
      CLAUDIT_FEATURE_PROJECT_COMPARISON: ${CLAUDIT_FEATURE_PROJECT_COMPARISON:-1}
      CLAUDIT_FEATURE_CACHE_TTL: ${CLAUDIT_FEATURE_CACHE_TTL:-1}
      CLAUDIT_FEATURE_RESPONSE_SIZES: ${CLAUDIT_FEATURE_RESPONSE_SIZES:-1}
      CLAUDIT_FEATURE_CONTEXT_GROWTH: ${CLAUDIT_FEATURE_CONTEXT_GROWTH:-1}
      CLAUDIT_FEATURE_BURN_RATE: ${CLAUDIT_FEATURE_BURN_RATE:-1}
      CLAUDIT_FEATURE_CONTEXT_COMPARISON: ${CLAUDIT_FEATURE_CONTEXT_COMPARISON:-1}
      CLAUDIT_FEATURE_TOOL_USAGE: ${CLAUDIT_FEATURE_TOOL_USAGE:-1}
      CLAUDIT_FEATURE_REPLY_LATENCY: ${CLAUDIT_FEATURE_REPLY_LATENCY:-1}
      CLAUDIT_FEATURE_PAGE_PERFORMANCE: ${CLAUDIT_FEATURE_PAGE_PERFORMANCE:-1}
      CLAUDIT_FEATURE_TOOL_ERROR_RATE: ${CLAUDIT_FEATURE_TOOL_ERROR_RATE:-1}
      CLAUDIT_FEATURE_AGENT_COMPARISON: ${CLAUDIT_FEATURE_AGENT_COMPARISON:-1}
      CLAUDIT_FEATURE_ACTIVITY_HEATMAP: ${CLAUDIT_FEATURE_ACTIVITY_HEATMAP:-1}
      CLAUDIT_FEATURE_SUMMARY: ${CLAUDIT_FEATURE_SUMMARY:-1}
      CLAUDIT_FEATURE_RATE_LIMITS: ${CLAUDIT_FEATURE_RATE_LIMITS:-1}
      CLAUDIT_FEATURE_SESSIONS: ${CLAUDIT_FEATURE_SESSIONS:-1}
      CLAUDIT_FEATURE_CACHE: ${CLAUDIT_FEATURE_CACHE:-1}
      CLAUDIT_FEATURE_INSPECTOR: ${CLAUDIT_FEATURE_INSPECTOR:-1}
      CLAUDIT_FEATURE_PROJECT_PICKER: ${CLAUDIT_FEATURE_PROJECT_PICKER:-1}
      CLAUDIT_FEATURE_EXPORT_PNG: ${CLAUDIT_FEATURE_EXPORT_PNG:-1}
      CLAUDIT_FEATURE_LIVE_UPDATES: ${CLAUDIT_FEATURE_LIVE_UPDATES:-1}
      CLAUDIT_HIDE_RATE_LIMITS: ${CLAUDIT_HIDE_RATE_LIMITS:-0}
    volumes:
      - ./fixtures:/opt/claudit/fixtures:ro
    ports:
      - "${CLAUDIT_HOST_PORT:-8000}:8000"

volumes:
  # Postgres data, named so it outlives `docker compose down` and is
  # dropped by `docker compose down -v`.
  pgdata:
