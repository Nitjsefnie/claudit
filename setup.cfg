[tool:pytest]
# The db marker is applied mechanically: tests/conftest.py's
# pytest_collection_modifyitems hook (via tests/db_marker.py) marks every
# test whose fixture closure reaches a registered DB fixture, and tests
# that reach a PostgreSQL server without any DB fixture carry it
# explicitly. The portable CI matrix runs the suite with -m "not db";
# the Linux job in tests.yml runs everything.
markers =
    db: test reaches a PostgreSQL server, via a DB fixture (see tests/db_marker.py) or an explicit @pytest.mark.db; deselected by the portable CI matrix

[pycodestyle]
max-line-length = 10000
exclude = .idea, .venv, build, dist
