name: Cached Postgres image
description: Restore or pull the pinned Postgres image and tag it locally.

outputs:
  tag:
    description: Local tag of the pinned image; start it with --pull never.
    value: ${{ steps.image.outputs.tag }}

# The Postgres digest's one CI home is the FROM line of the Dockerfile
# beside this file; Dependabot's docker entry updates it. The Postgres
# action starts it for the five database workflows; docker-smoke runs it as
# compose's db service. compose.yaml builds this directory locally.
# The digest stays reviewed because ratchet-push publishes its measurements.
# A warm cache avoids anonymous registry pull limits.
# A cold miss retries Google's mirror, then ECR at the same digest, so an
# ECR limit does not prevent warming the cache. The cache mechanism itself
# is cached-image's.
# refresh-pricing runs hourly on master (its job refuses other refs and its
# checkout uses that ref), restoring even on quiet hours. It warms a cold
# master cache and keeps the entry in use inside GitHub's 7-day expiry window;
# docker-smoke restores the same entry (same key and archive path).
runs:
  using: composite
  steps:
    - name: Identify the pinned image
      id: image
      shell: bash
      run: |
        set -euo pipefail
        dockerfile="${GITHUB_ACTION_PATH}/Dockerfile"
        froms="$(grep -c '^FROM' "$dockerfile" || true)"
        if [ "$froms" != 1 ]; then
          echo "::error::$dockerfile carries '$froms' FROM lines; exactly one is required"
          exit 1
        fi
        reference="$(sed -n -E 's/^FROM[[:space:]]+([^[:space:]#]+).*/\1/p' "$dockerfile")"
        repository="${reference%%@*}"
        digest="${reference#*@}"
        if [ -z "$digest" ] || [ "$digest" = "$reference" ] \
           || [ "${digest#sha256:}" = "$digest" ]; then
          echo "::error::$dockerfile's FROM reference '$reference' is not repository@sha256:digest"
          exit 1
        fi
        CLAUDIT_POSTGRES_REPOSITORY="$repository"
        CLAUDIT_POSTGRES_FALLBACK_REPOSITORY="public.ecr.aws/docker/library/postgres"
        CLAUDIT_POSTGRES_DIGEST="$digest"
        {
          echo "ref=${CLAUDIT_POSTGRES_REPOSITORY}@${CLAUDIT_POSTGRES_DIGEST}"
          echo "fallback=${CLAUDIT_POSTGRES_FALLBACK_REPOSITORY}@${CLAUDIT_POSTGRES_DIGEST}"
          echo "tag=claudit-postgres:${CLAUDIT_POSTGRES_DIGEST#sha256:}"
          echo "key=postgres-${RUNNER_OS}-${RUNNER_ARCH}-${CLAUDIT_POSTGRES_DIGEST}"
        } >> "$GITHUB_OUTPUT"

    - name: Restore or pull the image
      uses: $/.github/actions/cached-image
      with:
        label: Postgres
        ref: ${{ steps.image.outputs.ref }}
        fallback-ref: ${{ steps.image.outputs.fallback }}
        tag: ${{ steps.image.outputs.tag }}
        key: ${{ steps.image.outputs.key }}
        archive: postgres-image.tar
