name: Cached Postgres
description: Restore the pinned Postgres image, start it locally, and wait for TCP readiness.

inputs:
  port:
    description: Localhost port to publish.
    default: '5432'
  container-name:
    description: Name of the container created by this action.
    default: claudit-ci-postgres

# Fixtures need CREATEDB: the stock postgres superuser provides it.
# postgres-image owns the digest, its cache entry and the local tag; this
# action only starts that tag and waits for it.
runs:
  using: composite
  steps:
    - name: Restore or pull the pinned image
      id: image
      uses: $/.github/actions/postgres-image

    - name: Start Postgres and wait for connections
      shell: bash
      env:
        CLAUDIT_POSTGRES_TAG: ${{ steps.image.outputs.tag }}
        CLAUDIT_POSTGRES_PORT: ${{ inputs.port }}
        CLAUDIT_POSTGRES_CONTAINER: ${{ inputs.container-name }}
      run: |
        set -euo pipefail
        # Never resolve a registry reference here, even after docker load.
        docker run --pull never --detach --name "$CLAUDIT_POSTGRES_CONTAINER" \
          --publish "127.0.0.1:${CLAUDIT_POSTGRES_PORT}:5432" \
          --env POSTGRES_USER=postgres --env POSTGRES_PASSWORD=postgres \
          --env POSTGRES_DB=postgres "$CLAUDIT_POSTGRES_TAG"
        # TCP excludes the entrypoint's temporary socket-only init server.
        for _ in $(seq 1 60); do
          if docker exec "$CLAUDIT_POSTGRES_CONTAINER" pg_isready -q -h 127.0.0.1 -U postgres -d postgres; then
            exit 0
          fi
          sleep 1
        done
        docker logs "$CLAUDIT_POSTGRES_CONTAINER" >&2
        echo "::error::Postgres never accepted TCP connections" >&2
        exit 1
