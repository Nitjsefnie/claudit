name: Thresholds base
description: Resolve the judged threshold base once per job and export it to later steps. Events without a judged range export empty (no removal exemptions).

runs:
  using: composite
  steps:
    - name: Resolve the threshold base
      shell: bash
      # base is a local git SHA from this repo's refs
      run: |  # zizmor: ignore[github-env]
        base=
        case "$CLAUDIT_EVENT" in
          pull_request)
            for attempt in 1 2 3; do
              if git -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=60 fetch --no-tags "https://github.com/${CLAUDIT_REPO}.git" "refs/heads/${CLAUDIT_BASE_REF}"; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error::fetching the base branch failed after 3 attempts" >&2
                exit 1
              fi
              sleep "$((attempt * 5))"
            done
            base="$(git merge-base HEAD FETCH_HEAD)" ;;
          push)
            resolver_status=0
            base="$(python3 scripts/ci/threshold_base.py "$CLAUDIT_BEFORE" .github/ci-thresholds.json)" || resolver_status=$?
            if [ "$resolver_status" -eq 3 ]; then
              base=
            elif [ "$resolver_status" -ne 0 ]; then
              exit "$resolver_status"
            fi ;;
        esac
        printf 'CLAUDIT_THRESHOLDS_BASE_REV=%s\n' "$base" >> "$GITHUB_ENV"
