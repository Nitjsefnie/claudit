name: Suite cost bench
description: >-
  Measure one pytest pass over the pinned fixture in instructions and
  hold every phase to its committed budget. Since issue #515 the tests
  canary is the only caller: one bench pass per run -- measure, gate --
  and the caller uploads the measurement.

# A composite action because .github/workflows/tests.yml sits exactly on
# its per-file size ratchet entry, and that ratchet's answer to growth
# is to move code out, never to raise the entry (SV-CI-RATCHETS). The
# bench's own explanation lives with the bench (scripts/ci/suite_bench.py);
# this is the CI shape of it:
#
#   measure ONCE, into a file the caller's gate or ratchet reads
#     -> print the human report into the step summary
#     -> gate every phase against the committed ceilings (a phase over
#        its ceiling exits nonzero and fails the caller's job)
#
# The measurement path is an input so the caller and this action agree
# on one file; it is read into an env var, never interpolated into the
# run block (no template-injection surface).

inputs:
  measurement:
    description: 'Absolute path for the measurement JSON.'
    required: true

outputs:
  measured:
    description: 'true when the measurement was written'
    value: ${{ steps.measure.outputs.measured }}

runs:
  using: composite
  steps:
    - name: Measure the suite cost
      id: measure
      shell: bash
      env:
        MEASUREMENT: ${{ inputs.measurement }}
      run: |
        set -euo pipefail
        python scripts/ci/suite_bench.py --write "$MEASUREMENT" --summary "$GITHUB_STEP_SUMMARY"
        echo "measured=true" >> "$GITHUB_OUTPUT"

    - name: Gate on the committed budgets
      # The check's exit code IS the step's: a phase over its recorded
      # ceiling fails the caller's job, naming the phase, the measured
      # value and the ceiling.
      shell: bash
      env:
        MEASUREMENT: ${{ inputs.measurement }}
      run: |
        set -euo pipefail
        python scripts/ci/suite_bench.py --check "$MEASUREMENT"

