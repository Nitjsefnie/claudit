name: Reparse CPU gate
description: >-
  Measure the CPU work of one reparse pass over the mini fixture mirror,
  split by phase, and hold every phase to its recorded bytecode count.

# A composite action because .github/workflows/tests.yml sits exactly on
# its per-file size ratchet entry, and that ratchet's answer to growth is
# to move code out, never to raise the entry (SV-CI-RATCHETS). The bench's
# own explanation lives with the bench (scripts/ci/reparse_bench.py); this
# is the CI shape of it:
#
#   measure ONCE, into a file the caller's ratchet step can read
#     -> print the human report into the step summary (per-phase shares
#        ride along as TELEMETRY; only the counts gate, issue #513)
#     -> upload the measurement as the reparse-measurement artifact
#        (issue #710), the reparse seed's runner-measurement source; it
#        sits BEFORE the gate so a breach still lands, and runs whenever
#        the action runs
#     -> gate every phase against the committed count ceilings (nonzero
#        on a phase over its count, or on a count that was never taken,
#        which fails the caller's job)
#
# The measurement path is an input so the caller and this action agree on
# one file; it lands in the workspace, which is a throwaway CI checkout.

inputs:
  measurement:
    description: Workspace-relative path for the measurement JSON.
    required: false
    default: reparse-bench.json

runs:
  using: composite
  steps:
    - name: Measure and report the reparse pass
      shell: bash
      env:
        MEASUREMENT: ${{ inputs.measurement }}
      run: |
        set -euo pipefail
        {
          echo '### Reparse CPU'
          echo
          python3 scripts/ci/reparse_bench.py \
            --write "$MEASUREMENT" --report "$MEASUREMENT"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload the reparse measurement
      # A breach is exactly when the number is needed, so this runs
      # whenever the action runs: before the gate, never conditioned on
      # its outcome.
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: reparse-measurement
        path: ${{ inputs.measurement }}
        if-no-files-found: error
        retention-days: 1

    - name: Gate the reparse hot path
      shell: bash
      env:
        MEASUREMENT: ${{ inputs.measurement }}
      run: |
        set -euo pipefail
        python3 scripts/ci/reparse_bench.py --check "$MEASUREMENT"
