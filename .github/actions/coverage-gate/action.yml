name: Coverage gate
description: Gate a recorded coverage floor while measuring uncalibrated JavaScript.

inputs:
  language:
    description: 'Coverage language to gate: python or javascript.'
    required: true

outputs:
  js_measured:
    description: 'JavaScript line coverage, measured even without a recorded floor.'
    value: ${{ steps.jscov.outputs.js_measured }}

runs:
  using: composite
  steps:
    - name: Python coverage gate
      if: inputs.language == 'python'
      shell: bash
      # Ratchet: master raises the recorded floor past 1.5 hysteresis.
      run: |
        floor="$(python3 scripts/ci/thresholds.py --coverage-floor python)"
        if [ -z "$floor" ]; then
          echo "no coverage.python calibration recorded — seeded on master"
        else
          python -m coverage report "--fail-under=${floor}" --precision=1
        fi

    - name: JavaScript coverage gate
      id: jscov
      if: inputs.language == 'javascript'
      shell: bash
      # AST conversion measures executed src/**/*.js, excluding JSX.
      env:
        NODE_V8_COVERAGE: ${{ runner.temp }}/v8-coverage
      run: |
        rm -rf "$NODE_V8_COVERAGE" && mkdir -p "$NODE_V8_COVERAGE"
        # test_js_toolchain.py pins this list to node-using tests (#433).
        # Split each listed path into a pytest argument.
        # shellcheck disable=SC2046
        python -m pytest $(cat scripts/ci/node_test_files.txt) -q --no-header
        floor="$(python3 scripts/ci/thresholds.py --coverage-floor javascript)"
        if [ -z "$floor" ]; then
          echo "no coverage.javascript calibration recorded — seeded on master"
          node scripts/ci/js_coverage.mjs "$NODE_V8_COVERAGE" \
            --include 'src/**/*.js'
          floor_label="not recorded"
        else
          node scripts/ci/js_coverage.mjs "$NODE_V8_COVERAGE" \
            --include 'src/**/*.js' --lines "$floor"
          floor_label="${floor}%"
        fi
        js_measured="$(node -e 'console.log(
          require("./coverage/coverage-summary.json").total.lines.pct.toFixed(1))')"
        echo "js_measured=${js_measured}" >> "$GITHUB_OUTPUT"
        echo "JavaScript coverage measured ${js_measured}% " \
          "against floor ${floor_label}"
