name: Sanitize apt sources
description: Remove the runner's unused Microsoft apt source ahead of a later apt use.

runs:
  using: composite
  steps:
    - name: Remove the unused Microsoft apt source
      shell: bash
      run: |
        set -euo pipefail
        echo "==> removing the unused Microsoft apt source"
        sudo timeout 10s rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/microsoft-prod.sources
