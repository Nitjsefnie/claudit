name: panel-layout

# Legend overlap depends on fonts, SVG text metrics, flex wrapping and
# viewport width, so parser tests cannot catch it; a layout engine must.
#
# This leg answers that one question. `scripts/ci/panel_layout.mjs` serves
# the REAL page — the same public/index.html, the same src/*.jsx, the same
# in-browser Babel — against the frozen payload set in fixtures/layout/,
# opens it in headless Chromium at configured widths, and reads
# getBoundingClientRect() for every region the panels mark with
# `data-role`: each must lie inside its own panel, and no two may
# intersect.
#
# It is ONE generic check over every panel, not a suite per panel, and it
# needs no database and no R2: the fixture set is the whole dataset. The
# browser driver is a devDependency in package.json like every other CI
# tool here — nothing in the shipped app reads package.json, and the app
# itself still has no build step (CONTRIBUTING.md).
#
# The pinned versions live in package.json, not here, so Dependabot sees
# them; inline pins in a workflow are invisible to it.

on:
  workflow_call:
  workflow_dispatch:

# Least privilege: this job only checks out and runs the proposed tree.
# Without an explicit block it inherits the repository default, which can
# be read/write for the whole token.
permissions:
  contents: read

concurrency:
  group: panel-layout-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  panel-layout:
    # The name IS the check-run name.
    name: panel layout (headless Chromium, 4 widths)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this workflow pushes.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Pinned exactly, as every other version in this repo is: a tool
          # release must never turn CI red on an unchanged commit.
          # Same value the eslint and tests legs run on.
          node-version: "24.17.0"

      - name: Install the JS toolchain from the lockfile
        # npm ci, not npm install: it installs package-lock.json exactly
        # and refuses to resolve against the registry, so the pins in
        # package.json mean what they say.
        run: npm ci --no-audit --no-fund

      # --with-deps installs the shared libraries a headless Chromium
      # needs on the runner image; without them the launch fails with a
      # loader error rather than a layout result.
      - name: Install the headless browser
        run: npx --no-install playwright install --with-deps chromium

      - name: Read back every panel's rendered boxes
        # The panels under test, the viewport widths and the assertion are
        # the script's; this step is only the command. A non-zero exit is a
        # panel whose legend, axis, title or plot overlaps another or
        # escapes its panel — the script prints which, at which width, by
        # how many pixels.
        run: node scripts/ci/panel_layout.mjs

      - name: Sweep every panel's hover response
        # The same REAL page and fixture set: cold-load CLS,
        # a hover sweep over every marked bar/bucket/point asserting the
        # tooltip and the highlight, tooltip overflow, sweep-shift
        # attribution through src/perf.js, and the 2-vs-30+-models panel
        # height check. The KNOWN ledger it prints carries the defects
        # that predate the sweep, each with its issue number; a new
        # violation, a panel that renders none, a sweep with no marked
        # target anywhere, or a ledger entry that never fired exits
        # non-zero.
        run: node scripts/ci/panel_interactions.mjs

      - name: Check the rendered layout-consistency rules
        # The same REAL page and fixture set: one page load
        # per width, every registered rule measured on it, including the
        # vertical-gap rule (no vertically adjacent sections or charts flush) —
        # and then each rule's seeded red case, which must fire or the
        # run fails as a lying guard. New layout rules register in
        # scripts/ci/panel_layout_rules.mjs's RULES array and are covered
        # automatically.
        run: node scripts/ci/panel_layout_rules.mjs

      - name: Prove the sweep fails on one seeded violation per category
        # Each Expected-Behavior bullet is only as good as the
        # seeded violation that fails the sweep on it. The runner plants
        # one violation per category (a stripped panel, an unnamed sweep
        # shift, an unnamed cold-load shift), asserts exit 1 per seed,
        # and greps for the finding kind each seed exists to prove — so
        # a seed that fails for the wrong reason is not a proof.
        run: node scripts/ci/panel_interactions_seeds.mjs
