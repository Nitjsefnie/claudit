name: panel-layout

# Legend overlap depends on fonts, SVG text metrics, flex wrapping and
# viewport width, so parser tests cannot catch it; a layout engine must.
#
# This leg answers that one question. `scripts/ci/panel_layout.mjs` serves
# the REAL page — the same public/index.html, the same src/*.jsx, the same
# in-browser Babel — against the frozen payload set in fixtures/layout/,
# opens it in headless Chromium at configured widths, and reads
# getBoundingClientRect() for every region the panels mark with
# `data-role`: each must lie inside its own panel, and no two may
# intersect.
#
# It is ONE generic check over every panel, not a suite per panel, and it
# needs no database and no R2: the fixture set is the whole dataset. The
# browser driver is a devDependency in package.json like every other CI
# tool here — nothing in the shipped app reads package.json, and the app
# itself still has no build step (CONTRIBUTING.md).
#
# The pinned versions live in package.json, not here, so Dependabot sees
# them; inline pins in a workflow are invisible to it.
# The sweeps run as parallel jobs over one checkout SHA, so the seeded
# proof runs against the same code as the sweep it proves.

on:
  workflow_call:
  workflow_dispatch:

# Least privilege: this job only checks out and runs the proposed tree.
# Without an explicit block it inherits the repository default, which can
# be read/write for the whole token.
permissions:
  contents: read

concurrency:
  group: panel-layout-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  panel-layout:
    # The name IS the check-run name.
    name: panel layout (${{ matrix.sweep.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sweep:
          - id: layout
            script: scripts/ci/panel_layout.mjs
            name: layout
          - id: interactions
            script: scripts/ci/panel_interactions.mjs
            name: interactions
          - id: rules
            script: scripts/ci/panel_layout_rules.mjs
            name: rules
          - id: seeds
            script: scripts/ci/panel_interactions_seeds.mjs
            name: seeds

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this workflow pushes.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Pinned exactly, as every other version in this repo is: a tool
          # release must never turn CI red on an unchanged commit.
          # Same value the eslint and tests legs run on.
          node-version: "24.17.0"

      - name: Install the JS toolchain from the lockfile
        # npm ci, not npm install: it installs package-lock.json exactly
        # and refuses to resolve against the registry, so the pins in
        # package.json mean what they say.
        run: scripts/ci/retry.sh timeout -k 5 120 npm ci --no-audit --no-fund

      # The fonts and shared libraries the pinned Playwright installs for
      # Chromium on this image; the next step fails if it needs another.
      - uses: $/.github/actions/apt-install
        timeout-minutes: 6
        with:
          packages: >-
            xvfb fonts-noto-color-emoji fonts-unifont libfontconfig1 libfreetype6
            xfonts-cyrillic xfonts-scalable fonts-liberation fonts-ipafont-gothic
            fonts-wqy-zenhei fonts-tlwg-loma-otf fonts-freefont-ttf libasound2t64
            libatk-bridge2.0-0t64 libatk1.0-0t64 libatspi2.0-0t64 libcairo2 libcups2t64
            libdbus-1-3 libdrm2 libgbm1 libglib2.0-0t64 libnspr4 libnss3 libpango-1.0-0
            libx11-6 libxcb1 libxcomposite1 libxdamage1 libxext6 libxfixes3
            libxkbcommon0 libxrandr2

      - name: Install the headless browser
        timeout-minutes: 4
        run: |
          scripts/ci/retry.sh timeout -k 5 60 npx --no-install playwright install chromium
          if ! report="$(timeout -k 5 10 npx --no-install playwright install-deps --dry-run chromium)" || [ "$report" != "All system dependencies are installed." ]; then
            echo "::error::Playwright's dependency dry run did not report every package installed: $report" >&2
            exit 1
          fi

      - name: Run the ${{ matrix.sweep.name }} sweep
        run: node ${{ matrix.sweep.script }}
