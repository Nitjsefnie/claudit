name: audit

# Dependency vulnerability gate: pip-audit resolves each requirements file
# to its full transitive tree and checks every resolved version against the
# PyPI advisory database and OSV.
#
# Resolution is the point, not a detail. Nothing in this repo pins
# `starlette` — it arrives underneath `fastapi` — and when this gate was
# written that transitive pin carried nine advisories that no direct reading
# of a requirements file would ever have shown.
#
# WHY THE CRON IS THE IMPORTANT TRIGGER. Every other gate in this repo
# answers "did this commit break something", so a push or pull request is
# the natural trigger. This one answers "is a version we froze months ago
# still safe", and that answer changes when a stranger publishes an
# advisory, with no commit here to hang it on. An event-only audit would
# report clean forever on an abandoned branch. The commit-side half is
# now hosted by ci-gate.yml, which runs this workflow as a leg: it
# catches a bad pin at the moment it is introduced, while the diff is on
# screen. The cron and workflow_dispatch stay here.
#
# This gate FAILS the build rather than filing an advisory, which is the
# same stance as lint and types: a red gate that a human must look at beats
# a notification that accumulates unread. When a fix genuinely is not
# available yet, add the advisory to --ignore-vuln below WITH a comment
# saying why and what would clear it — never silence the whole gate.
#
# pip-audit is installed from requirements-pip-audit.txt rather than an
# inline pin in a `run:` block: Dependabot's pip ecosystem reads manifest
# files, never the pins inside a workflow, so an inline `pip-audit==X`
# could only go stale unnoticed (issue #551: it sat un-updated while the
# manifests it audits got Dependabot bumps).
#
# There is deliberately NO `python -m pip install --upgrade pip` here. The
# unreviewed pip upgrade is an unaudited component — the very thing this
# gate judges — and actionlint.yml carries the same stance for the same
# reason; the runner's stock pip installs the pinned manifest.

on:
  # Trigger ownership moved to ci-gate.yml (issue #127): push and
  # pull_request fire ci-gate, which calls this workflow as a leg.
  # workflow_call is the leg's entry; the daily cron and
  # workflow_dispatch stay here, where a run answers a question no
  # commit asked.
  workflow_call:
  schedule:
    # Daily, not weekly. An advisory is actionable the day it lands, and
    # this job costs about a minute of a runner. 04:12 UTC, off the hour.
    - cron: '12 4 * * *'
  workflow_dispatch:

# Least privilege: every job here only reads the tree. Without an
# explicit block the job inherits the repository default, which can be
# read/write for the whole token.
permissions:
  contents: read

concurrency:
  group: audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this workflow pushes. Leaving the job token in
          # .git/config lets any later step — or anything a dependency
          # pulls in — reuse it.
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # The pip cache restores on every event but is saved only from a push
      # of master: `cache: pip` saves in a post-job step that runs after the
      # pull-request checkout, so untrusted code would write the cross-run
      # cache a trusted run later installs from (issue #126). This job's
      # only manifest is requirements-pip-audit.txt, so the key hashes that
      # file, and a pin bump starts a fresh cache entry.
      - name: Restore the pip cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/pip
            ~/Library/Caches/pip
            ~\AppData\Local\pip\Cache
          key: pip-${{ runner.os }}-3.13-${{ hashFiles('requirements-pip-audit.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-3.13-

      - name: Install pip-audit
        # From a manifest rather than an inline pin: Dependabot's pip
        # ecosystem reads manifest files, never a run: block, so an inline
        # `pip-audit==X` could only go stale unnoticed (issue #551). No
        # `--upgrade pip` either: it installed whatever bytes the index
        # served, unpinned — an unaudited component ahead of the audit
        # gate itself. The runner's stock pip installs the manifest.
        run: python -m pip install -r requirements-pip-audit.txt

      # Saved here, not in a post-job step: the install above populated the
      # cache, and the gate keeps every event but a push of master from
      # writing cross-run state (issue #126).
      - name: Save the pip cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        with:
          path: |
            ~/.cache/pip
            ~/Library/Caches/pip
            ~\AppData\Local\pip\Cache
          key: pip-${{ runner.os }}-3.13-${{ hashFiles('requirements-pip-audit.txt') }}

      - name: Audit dependencies
        # Each SET below is resolved and audited the way its install
        # consumes it. The three co-installed trees (runtime + dev + test)
        # resolve once, consistently — a package constrained by two of
        # them is resolved the same way an install would see it. The two
        # CI-tool manifests are audited ALONE, each by its own invocation:
        # pip-audit resolves all --requirement files in ONE internal pip
        # dry-run, and a hash-pinned manifest beside an un-hashed one
        # flips that resolution into --require-hashes mode, which fails on
        # the hashes the other manifests do not carry (observed on
        # Nitjsefnie-Actions/pr-gate's first run of this gate).
        #
        # No --ignore-vuln entries at present. Each one added here must
        # carry a comment naming the advisory, why it is not fixable, and
        # what would let it be removed.
        #
        # THE RETRY IS NARROW ON PURPOSE. pip-audit resolves against PyPI
        # and the advisory database over the network, and a reset
        # connection produces the same exit status as a real finding. A
        # blanket `retry 3` would therefore re-run a genuine vulnerability
        # three times before reporting it, and — worse — a gate that goes
        # red for reasons unrelated to its subject is one people learn to
        # ignore. So this retries ONLY transport/service failures: connection
        # errors, SSLError, HTTP 5xx, rate-limited 429, and a ServiceError
        # exception. 429 is the sole retried 4xx; other 4xx responses (such
        # as a 404 for a missing package) are checked before ServiceError.
        # Findings and other failures are reported immediately.
        run: |
          audit_set() {
            local attempt
            for attempt in 1 2 3; do
              if pip-audit --progress-spinner off "$@" > audit.out 2>&1; then
                cat audit.out
                return 0
              fi

              if grep -qiE '4[0-9][0-9] Client Error' audit.out \
                  && ! grep -qiE '429 (Client Error|Too Many Requests)' audit.out; then
                echo "pip-audit failed with a non-retryable 4xx client error:" >&2
                cat audit.out >&2
                return 1
              fi

              if grep -qiE 'connection (aborted|reset|error)|read timed out|temporary failure in name resolution' audit.out \
                  || grep -qiE 'Could not connect to (PyPI|OSV).*vulnerability feed' audit.out \
                  || grep -qiE '(^|[[:space:]])[[:alnum:]_.]*SSLError:' audit.out \
                  || grep -qiE '5[0-9][0-9] Server Error|502 Bad Gateway|503 Service Unavailable|504 Gateway Timeout|429 (Client Error|Too Many Requests)' audit.out \
                  || grep -qiE '(^|[[:space:]])(pip_audit\._service\.interface\.)?ServiceError:' audit.out; then
                echo "attempt $attempt: transport/service failure, retrying"
                tail -n 5 audit.out
                sleep $(( attempt * 15 ))
                continue
              fi

              echo "pip-audit reported findings:" >&2
              cat audit.out >&2
              return 1
            done

            echo "pip-audit exhausted 3 attempts after a transport/service failure:" >&2
            cat audit.out >&2
            return 1
          }

          audit_set \
            --requirement backend/requirements.txt \
            --requirement requirements-dev.txt \
            --requirement requirements-test.txt || exit 1

          audit_set --requirement requirements-pip-audit.txt || exit 1
          audit_set --requirement requirements-zizmor.txt || exit 1
