name: docker-smoke

# Does the container image build, and does the compose stack boot and
# serve on a runner that carries no configuration?
#
# The Dockerfile and compose.yaml (issues #941's first two halves) are
# dead weight without a CI that exercises them: nothing else in this
# repository builds the image, starts the digest-pinned Postgres with
# its first-boot init, or reads the fixtures through the R2 client's
# file:// mode FROM INSIDE the container. This leg is that check, and it
# runs with the runner's bare environment — no R2_* variables — so the
# only configuration that can make it green is compose's zero-config
# defaults. A step before `up` asserts the RESOLVED config is
# file-backed and credential-free, so a later compose edit that
# defaults to a real bucket reddens here rather than at a deploy.
#
# The /health probe repeats the patience shape of
# scripts/ci/smoke.py — poll on a deadline, keep the last observation
# for the failure message, accept only a 200 whose body says ok, a
# startup ingest that finished against the mounted mirror, and the
# three terminal checks scripts/ci/smoke.py's check_health makes
# (VERSION equal to the checkout's file, no recorded ingest error, a
# nonzero listed count) — and teardown runs under `if: always()` so a
# failed probe leaves no stack or volume behind on the runner.
#
# IMAGES COME FROM THE ACTIONS CACHE (issue #981). Both registry images
# the stack needs — compose.yaml's digest-pinned Postgres and the
# Dockerfile's tag-pinned Python base — are anonymous public-ECR pulls,
# and ECR's `toomanyrequests: Data limit exceeded` failed this leg before
# anything was built. Both now arrive through .github/actions/cached-image
# (the Postgres one through postgres-image, the same entry the five
# database workflows restore, which refresh-pricing's hourly master runs
# keep warm). Every compose call adds .github/docker-smoke.compose.yaml,
# which runs db from the cached local tag with `pull_policy: never`; the
# build finds the base in the local image store because nothing passes
# `--pull`. The base is tag-pinned, so its key adds the UTC ISO week: an
# entry is restored only in the week it was saved, so the build never
# uses a base more than seven days old. The ci gate runs this leg on
# pull requests and master pushes alike and skips a change that is
# docs-only or bot-data-only; the first master push in a week that runs
# it saves that week's base entry for PR reads, and a week with none
# leaves each PR's first run to pull (ECR, then mirror.gcr.io at the
# same tag) and cache its own. A miss that every source refuses fails
# the leg with each registry's answer.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore or pull the pinned Postgres image
        uses: $/.github/actions/postgres-image

      # The Dockerfile's FROM, pinned here and checked against the file,
      # so the cached archive is the base the build asks for.
      - name: Identify the Dockerfile's base image
        id: base
        env:
          BASE_IMAGE: public.ecr.aws/docker/library/python:3.13-slim
          BASE_FALLBACK_IMAGE: mirror.gcr.io/library/python:3.13-slim
        run: |
          set -euo pipefail
          if [ "$(grep -c '^FROM ' Dockerfile)" != 1 ] || ! grep -Fxq "FROM $BASE_IMAGE" Dockerfile; then
            echo "::error::Dockerfile's FROM is not $BASE_IMAGE; update docker-smoke.yml with it"
            exit 1
          fi
          week="$(date -u +%G-W%V)"
          {
            echo "ref=${BASE_IMAGE}"
            echo "fallback=${BASE_FALLBACK_IMAGE}"
            echo "key=python-base-${RUNNER_OS}-${RUNNER_ARCH}-${BASE_IMAGE}-${week}"
          } >> "$GITHUB_OUTPUT"

      # Tagged as the Dockerfile names it, so the build resolves FROM in
      # the local image store; even a mirror pull is saved under that name.
      - name: Restore or pull the Dockerfile's base image
        uses: $/.github/actions/cached-image
        with:
          label: Python base
          ref: ${{ steps.base.outputs.ref }}
          fallback-ref: ${{ steps.base.outputs.fallback }}
          tag: ${{ steps.base.outputs.ref }}
          key: ${{ steps.base.outputs.key }}
          archive: python-base-image.tar

      # Pin the zero-config claim before anything is built. The loop
      # scrubs the CLAUDIT_R2 variables and their old spellings from compose's interpolation, so
      # what `config` prints is what a bare `docker compose up` resolves
      # to on a machine with no .env: the file:// default endpoint and
      # empty keys. Unsetting rather than overriding is the point —
      # there is no compose flag that drops inherited environment, and
      # a future runner that exported a credential would otherwise be
      # interpolated straight into the stack this step exists to prove
      # needs none.
      - name: Assert the resolved config is file-backed and credential-free
        run: |
          for name in CLAUDIT_R2_ENDPOINT CLAUDIT_R2_BUCKET CLAUDIT_R2_ACCESS_KEY_ID CLAUDIT_R2_SECRET_ACCESS_KEY; do
            unset "$name" "${name#CLAUDIT_}"
          done
          resolved="$(docker compose -f compose.yaml -f .github/docker-smoke.compose.yaml config)"
          printf '%s\n' "$resolved"
          printf '%s\n' "$resolved" | grep -Eq 'CLAUDIT_R2_ENDPOINT: "?file://'
          printf '%s\n' "$resolved" | grep -Fq 'CLAUDIT_R2_ACCESS_KEY_ID: ""'
          printf '%s\n' "$resolved" | grep -Fq 'CLAUDIT_R2_SECRET_ACCESS_KEY: ""'
          if printf '%s\n' "$resolved" | grep -Eq 'r2\.cloudflarestorage\.com'; then
            echo "the resolved config names a real object-store endpoint, not the file:// default"
            exit 1
          fi

      # The same unset loop as the assert: `up --build` interpolates
      # compose defaults under the job's full environment, so a job-level
      # env: or a runner-exported CLAUDIT_R2_* or legacy credential must not reach the stack
      # a credential-free assert just proved.
      - name: Build the image and start the stack
        run: |
          for name in CLAUDIT_R2_ENDPOINT CLAUDIT_R2_BUCKET CLAUDIT_R2_ACCESS_KEY_ID CLAUDIT_R2_SECRET_ACCESS_KEY; do
            unset "$name" "${name#CLAUDIT_}"
          done
          docker compose -f compose.yaml -f .github/docker-smoke.compose.yaml up -d --build

      # The patience shape of scripts/ci/smoke.py: poll on a deadline,
      # keep the last observation for the failure message, and accept
      # only what the endpoint actually returns — 200 with ok and db
      # true, no ingest in flight, and a finished startup ingest. The
      # three limbs that follow are check_health's, and they TERMINATE
      # there, so they terminate here too rather than retrying a
      # condition that cannot change: the image's version must equal
      # the checkout's VERSION file, the finished ingest must carry no
      # recorded error (ingest books errors and still lists objects —
      # a retry-blind green here would miss exactly the container-side
      # failure this leg exists to catch), and it must have listed
      # objects (zero would mean the container never read the mounted
      # mirror, so a green probe would prove nothing).
      - name: Probe /health until the startup ingest finishes
        run: |
          python3 - <<'PY'
          import json
          import sys
          import time
          import urllib.error
          import urllib.request

          BASE = "http://127.0.0.1:8000"
          with open("VERSION", encoding="utf-8") as handle:
              EXPECTED_VERSION = handle.read().strip()
          DEADLINE = time.monotonic() + 180
          POLL_S = 2
          last = "no response yet"
          passed = False
          while time.monotonic() < DEADLINE:
              try:
                  with urllib.request.urlopen(f"{BASE}/health", timeout=5) as resp:
                      status, body = resp.status, resp.read()
              except urllib.error.HTTPError as exc:
                  status, body = exc.code, exc.read()
              except OSError as exc:            # not listening yet
                  last = f"connect: {exc}"
                  time.sleep(POLL_S)
                  continue
              if status != 200:
                  last = f"HTTP {status}: {body[:200]!r}"
                  time.sleep(POLL_S)
                  continue
              payload = json.loads(body)
              if not payload.get("ok") or not payload.get("db"):
                  last = f"not ok: {payload.get('error')!r}"
                  time.sleep(POLL_S)
                  continue
              if payload.get("ingest_running"):
                  prog = payload.get("ingest_progress") or {}
                  last = f"ingest {prog.get('phase')} {prog.get('pct')}%"
                  time.sleep(POLL_S)
                  continue
              run = payload.get("last_ingest") or {}
              if not run.get("finished_at"):
                  last = "no finished ingest recorded yet"
                  time.sleep(POLL_S)
                  continue
              if payload.get("version") != EXPECTED_VERSION:
                  last = (f"/health version is {payload.get('version')!r}, "
                          f"VERSION says {EXPECTED_VERSION!r}")
                  break
              if run.get("error"):
                  last = f"startup ingest recorded an error: {run['error']}"
                  break
              if not run.get("r2_listed"):
                  last = f"startup ingest listed 0 objects: {run!r}"
                  break
              print(f"health ok: version={payload.get('version')} "
                    f"listed={run['r2_listed']} reparsed={run.get('reparsed')}")
              passed = True
              break
          if not passed:
              print(f"/health never passed the probe ({last})",
                    file=sys.stderr)
              sys.exit(1)
          PY

      # A red probe that showed only its last observation would hide the
      # container's own traceback — the same reason smoke.py dumps the
      # server log beside the failed check.
      - name: Dump the stack log on failure
        if: failure()
        run: |
          for name in CLAUDIT_R2_ENDPOINT CLAUDIT_R2_BUCKET CLAUDIT_R2_ACCESS_KEY_ID CLAUDIT_R2_SECRET_ACCESS_KEY; do
            unset "$name" "${name#CLAUDIT_}"
          done
          docker compose -f compose.yaml -f .github/docker-smoke.compose.yaml logs --no-color --tail 200

      - name: Tear the stack down
        if: always()
        run: |
          for name in CLAUDIT_R2_ENDPOINT CLAUDIT_R2_BUCKET CLAUDIT_R2_ACCESS_KEY_ID CLAUDIT_R2_SECRET_ACCESS_KEY; do
            unset "$name" "${name#CLAUDIT_}"
          done
          docker compose -f compose.yaml -f .github/docker-smoke.compose.yaml down -v
