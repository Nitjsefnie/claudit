name: refresh-pricing

# The automated half of SV-RATE-REFRESH: re-fetch OpenRouter's per-provider
# prices for every model src/pricing.json tracks, and when a price moved or a
# host appeared, commit the appended entries straight to master.
#
# DETECTION TIME IS THE EFFECTIVE TIME. A moved price is appended as a new
# entry effective from the moment this run saw it, never back-dated, so the
# cadence is the precision: hourly means a price is right to within the hour.
# Scheduled runs are dropped or delayed often enough that the same workflow
# is also dispatched from outside every hour; a dispatched run takes no
# inputs and behaves exactly like a scheduled one.
#
# WHAT COUNTS AS "MOVED" IS THE TWO DATA FILES. The script writes nothing
# unless it appends: the fetch stamp in the JSON moves only with the data,
# so a quiet hour leaves the tree clean and commits nothing.
#
# THE SUITE RUNS BEFORE THE COMMIT, NOT AFTER. A push made with the job token
# starts no other workflow, so tests.yml never sees the bot's commit; the
# suite here is the only check it gets. A failing suite leaves the last good
# data on master.
#
# Only endpoints in the account's data region count; a region-tagged one
# (`host/us`) is not one it is billed by. These designed signals refuse the
# host or model concerned and leave its rows untouched:
#   - a host with two in-region endpoints at different prices and no
#     resolution for it in the JSON;
#   - a resolution that no longer applies (a pinned tag not listed, twins
#     no longer identical, their price order tied or flipped);
#   - a price or override kind the script does not model (a per-request
#     fee, a long-context tier), or a response shape it does not recognise;
#   - a tracked model with no endpoints (a broken fetch looks exactly like
#     that).
# A refusal blocks only itself: every other move is still tested and
# committed, then the run goes red. A red run here means read the named
# host's endpoints by hand and record the decision as data, not retry.

on:
  schedule:
    # Hourly, off the hour: the top of the hour is when every cron on GitHub
    # fires at once and jobs queue.
    - cron: '23 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  # Never cancel in progress: a cancelled run can stop between the commit and
  # the push. Scheduled and dispatched runs share the group, so two never
  # append at once.
  group: refresh-pricing
  cancel-in-progress: false

jobs:
  refresh:
    # A dispatch on another branch would push that branch's tree to master.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # commits the data it fetches; nothing else is written

    services:
      postgres:
        # The suite's database, as in tests.yml, but pinned by digest: this job
        # holds a write token, so the image it runs must be the one reviewed.
        # The service starts on every run, quiet ones included; a job cannot
        # start a service part-way.
        image: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The push at the end uses an explicit remote URL instead, so the
          # token never sits in .git/config for later steps to reuse.
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # No dependency cache: this job writes to master, and a cache any
          # other workflow can populate is not an input it should trust.
          python-version: "3.13"

      - name: Fetch and append
        id: fetch
        # stdlib only: nothing is installed before the fetch, so beyond the
        # Postgres service a quiet hour costs one checkout and one request per
        # tracked model. A refused host blocks only itself: the script still writes every other move and exits
        # nonzero, so this step records the code instead of failing, the
        # moves are tested and committed, and the last step turns the run red.
        run: |
          rc=0
          python3 scripts/ci/refresh_provider_rates.py \
            --commit-msg "$RUNNER_TEMP/commit-msg.txt" \
            > "$RUNNER_TEMP/report.txt" 2> "$RUNNER_TEMP/refused.txt" || rc=$?
          cat "$RUNNER_TEMP/report.txt" "$RUNNER_TEMP/refused.txt"
          {
            echo '### OpenRouter provider rates'
            echo
            echo '```'
            cat "$RUNNER_TEMP/report.txt" "$RUNNER_TEMP/refused.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: Did anything move?
        id: moved
        run: |
          if git diff --quiet -- src/pricing.json backend/constants.py; then
            echo "moved=false" >> "$GITHUB_OUTPUT"
          else
            echo "moved=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install postgresql-client
        if: steps.moved.outputs.moved == 'true'
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16

      - name: Install dependencies
        if: steps.moved.outputs.moved == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Wait for postgres
        if: steps.moved.outputs.moved == 'true'
        run: |
          for _ in $(seq 1 30); do
            pg_isready -q && exit 0
            sleep 1
          done
          echo "postgres never became ready"; exit 1

      - name: Run the suite against the new rates
        if: steps.moved.outputs.moved == 'true'
        run: python -m pytest tests/ -q --tb=short -ra

      - name: Commit and push
        if: steps.moved.outputs.moved == 'true'
        # The message is the script's own report under a subject naming the
        # counts. If master moved since checkout the push is refused and the
        # next run starts again from the new master.
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pricing.json backend/constants.py
          git commit -F "$RUNNER_TEMP/commit-msg.txt"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}" HEAD:master

      - name: Fail on a refusal
        # After the commit: the moves that could be made are on master, and
        # the red run is the signal that a host needs a human decision.
        if: steps.fetch.outputs.rc != '0'
        env:
          RC: ${{ steps.fetch.outputs.rc }}
        run: |
          echo "refresh_provider_rates exited $RC; the summary names each refused host."
          exit 1
