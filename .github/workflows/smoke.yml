name: smoke

# Does the actual server boot and serve?
#
# The pytest suite mounts `api.router` into a clean FastAPI app — correct
# for testing endpoints in isolation, and it means backend/app.py is never
# executed AS the application. Everything that lives only there is
# unchecked by a green pytest run: db.schema_check() (SV-SCHEMA-FAIL-FAST),
# the startup ingest and its APScheduler wiring, the auth middleware, and
# the index.html rewrite. This job is the one that runs them.
#
# The checks themselves are in scripts/ci/smoke.py, not inline here. A
# hundred lines of bash in a `run:` block is unlintable, untestable, and
# cannot be reproduced locally — and the local run is the point:
#
#     PGHOST=localhost PGUSER=postgres python3 scripts/ci/smoke.py
#
# Data comes from the committed fixtures/r2_mini mirror through the R2
# client's file:// mode. No credentials, no network, nothing to rot.

on:
  # Trigger ownership moved to ci-gate.yml (issue #127): push and
  # pull_request fire ci-gate, which calls this workflow as a leg.
  # workflow_call is the leg's entry; workflow_dispatch keeps a direct
  # run possible.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    runs-on: ubuntu-latest

    services:
      postgres:
        # smoke.py drops and creates its own throwaway databases, so the
        # role needs CREATEDB — same reason tests.yml uses the superuser.
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # The pip cache restores on every event but is saved only from a push
      # of master: `cache: pip` saves in a post-job step that runs after the
      # pull-request checkout, so untrusted code would write the cross-run
      # cache a trusted run later installs from (issue #126).
      - name: Restore the pip cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/pip
            ~/Library/Caches/pip
            ~\AppData\Local\pip\Cache
          key: pip-${{ runner.os }}-3.13-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-3.13-

      - name: Install postgresql-client
        # smoke.py shells out to psql, and the client major
        # must match the service.
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL --retry 3 https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16

      - name: Install dependencies
        # Runtime deps only. This job boots the real server; it does not
        # need the test or lint toolchains.
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      # Saved here, not in a post-job step: the install above populated the
      # cache, and the gate keeps every event but a push of master from
      # writing cross-run state (issue #126).
      - name: Save the pip cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        with:
          path: |
            ~/.cache/pip
            ~/Library/Caches/pip
            ~\AppData\Local\pip\Cache
          key: pip-${{ runner.os }}-3.13-${{ hashFiles('backend/requirements.txt') }}

      - name: Wait for postgres
        run: |
          for _ in $(seq 1 30); do
            pg_isready -q && exit 0
            sleep 1
          done
          echo "postgres never became ready"; exit 1

      - name: Boot the server and check it serves
        # smoke.py dumps the server's own log to stderr on any failure, so
        # a red run here carries the traceback rather than just a timeout.
        run: python3 scripts/ci/smoke.py
