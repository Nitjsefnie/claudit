name: tests

on:
  # Trigger ownership moved to ci-gate.yml (issue #127): this file is
  # called as a leg; workflow_dispatch keeps a direct run possible.
  workflow_call:
  workflow_dispatch:

# Least privilege: without an explicit block every job inherits the
# repository default, which can be read/write for the whole token.
permissions:
  contents: read

concurrency:
  # ci-gate legs join this group under the caller's event: a
  # master-push leg occupies tests-refs/heads/master — ci-gate's
  # per-SHA push groups (issue #358) make this queue what serializes
  # master runs — and PR legs cancel in progress. Dispatch queues by
  # ref. The ratchet push itself is serialized by ratchet-push.yml's
  # own group since issue #479 moved it out of this callee.
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    # The name IS the check-run name (issue #514); the job id stays.
    name: pytest + calibration gates (canary, pinned 3.13.14)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      # Read-only, and nothing less would be: this job checks out and
      # RUNS the proposed tree (issue #560). It used to carry
      # `pull-requests: write` for the patch-coverage comment, which put
      # a write-capable token in reach of every step between `pip
      # install` and the suite — and on a fork the token is read-only
      # anyway, so the comment failed there and no fork pull request ever
      # saw the readout. The comment now crosses a boundary instead:
      # this job uploads the rendered body, and the top-level
      # coverage-comment.yml — which checks out nothing and runs no pull
      # request code — posts it under a token that cannot touch the
      # suite. The readout stays INFORMATIONAL either way (issue #129).
      contents: read

    services:
      postgres:
        # Fixtures create and drop run-named databases
        # (tests/scratch_db.py), so the role needs CREATEDB — the stock
        # `postgres` superuser has it. Pinned by digest: the
        # ratchet-push workflow publishes from this image's
        # measurements, so the image must be the reviewed one.
        image: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Fixtures build DSNs as `postgresql:///<db>`, so libpq resolves
      # the connection from these (and the fixtures' psql calls).
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the patch-coverage merge-base walk and the
          # thresholds loader's re-seed walk (scripts/ci/reseed.py,
          # issue #582) both read ancestry a shallow clone lacks.
          fetch-depth: 0
          # No step in this job pushes; persist-credentials: false keeps
          # the job token out of .git/config for any later step to reuse.
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        # The exact micro the suite-cost seed was measured with: this
        # job's bench both gates and feeds the tighten bot, and a
        # runner-side drift to a cheaper 3.13.x would move the counts
        # out from under the committed ceilings (issue #266's reason).
        with:
          python-version: "3.13.14"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        # The JavaScript coverage ratchet measures V8 block coverage, which
        # can shift across V8 minors; pin the EXACT node the seed was
        # measured with so a runner-side drift cannot move the measurement
        # out from under the committed floor (issue #266).
        with:
          node-version: "24.17.0"

      # The pip cache restores on every event but is saved only from a
      # push of master, never from a pull-request checkout (issue #126).
      - name: Restore the pip cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/pip
            ~/Library/Caches/pip
            ~\AppData\Local\pip\Cache
          key: pip-${{ runner.os }}-3.13-${{ hashFiles('backend/requirements.txt', 'requirements-test.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-3.13-

      - name: Install postgresql-client
        # Fixtures shell out to psql; client must match service major.
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16

      - name: Install dependencies
        # backend/requirements.txt already pins pytest, pytest-asyncio and
        # httpx2; requirements-test.txt adds only the coverage toolchain.
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r requirements-test.txt

      # Saved here, not in a post-job step, so the cache is written only
      # from a master push (issue #126).
      - name: Save the pip cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        with:
          path: |
            ~/.cache/pip
            ~/Library/Caches/pip
            ~\AppData\Local\pip\Cache
          key: pip-${{ runner.os }}-3.13-${{ hashFiles('backend/requirements.txt', 'requirements-test.txt') }}

      - name: Wait for postgres
        run: |
          for _ in $(seq 1 30); do
            pg_isready -q && exit 0
            sleep 1
          done
          echo "postgres never became ready"; exit 1

      - name: Run tests
        id: pytest
        # No --cov-fail-under: the gate is its own step below, so
        # "tests failed" and "coverage dropped" stay distinguishable.
        run: python -m pytest tests/ -q --tb=short -ra --cov=backend --cov-report=term

      - name: Coverage summary
        # Renders whether or not the gate below passes: a coverage
        # regression is only actionable if you can see WHICH file lost
        # lines. Recorded ratchet values sit beside the report.
        if: ${{ !cancelled() && steps.pytest.conclusion != 'skipped' }}
        run: |
          recorded_measured="$(python3 scripts/ci/thresholds.py \
            --coverage-measured python)"
          floor="$(python3 scripts/ci/thresholds.py --coverage-floor python)"
          js_measured="$(python3 scripts/ci/thresholds.py \
            --coverage-measured javascript)"
          js_floor="$(python3 scripts/ci/thresholds.py \
            --coverage-floor javascript)"
          {
            echo '### Coverage'
            echo
            echo "Recorded ratchet (from .github/ci-thresholds.json):" \
              "python measured ${recorded_measured}% / floor ${floor}%," \
              "javascript measured ${js_measured}% / floor ${js_floor}%"
            echo
            python -m coverage report --format=markdown --precision=1
          } >> "$GITHUB_STEP_SUMMARY"
          python -m coverage xml -o coverage.xml

      - name: Upload coverage.xml
        if: ${{ !cancelled() && steps.pytest.conclusion != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

      - name: Patch coverage against the merge base
        # Informational readout (issue #129): of the lines this pull
        # request ADDED, which did the suite execute. PR-only, and
        # INFORMATIONAL BY DESIGN: no threshold, no gate; the module
        # exits 0 for any result it computed, even 0%.
        if: ${{ !cancelled() && steps.pytest.conclusion != 'skipped' && github.event_name == 'pull_request' }}
        env:
          REPO: ${{ github.repository }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch --no-tags \
            "https://github.com/${REPO}.git" \
            "refs/heads/${BASE_REF}"
          base="$(git merge-base HEAD FETCH_HEAD)"
          echo "Patch base: $(git log -1 --format='%h %s' "$base")"
          git diff "$base" HEAD -- '*.py' > "$RUNNER_TEMP/pr.diff"
          python3 scripts/ci/diff_coverage.py \
            --coverage coverage.xml \
            --diff "$RUNNER_TEMP/pr.diff" \
            --summary-file "$GITHUB_STEP_SUMMARY" \
            > "$RUNNER_TEMP/diff-coverage.md"

      - name: Stage the patch-coverage comment
        # The RENDERED BODY is the only thing that crosses into the
        # workflow that posts it; no token that can write pull-request
        # conversation is live in this job (issue #560). `pr-number.txt`
        # travels beside it and is CHECKED, never obeyed, over there:
        # this artifact is produced by a run of the pull request's own
        # tests.yml, so its claim about which pull request it belongs to
        # carries no authority.
        if: ${{ !cancelled() && steps.pytest.conclusion != 'skipped' && github.event_name == 'pull_request' }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/coverage-comment"
          cp "$RUNNER_TEMP/diff-coverage.md" \
            "$RUNNER_TEMP/coverage-comment/body.md"
          printf '%s\n' "$PR_NUMBER" \
            > "$RUNNER_TEMP/coverage-comment/pr-number.txt"
          wc -c < "$RUNNER_TEMP/coverage-comment/body.md"

      - name: Upload the patch-coverage comment
        if: ${{ !cancelled() && steps.pytest.conclusion != 'skipped' && github.event_name == 'pull_request' }}
        # A missing artifact is not this job's failure: coverage-comment.yml
        # reads its absence as "not measured" and refreshes the marker, and
        # the readout is informational (issue #129).
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diff-coverage-comment
          path: ${{ runner.temp }}/coverage-comment
          if-no-files-found: error
          retention-days: 5

      - name: Coverage gate
        if: ${{ !cancelled() && steps.pytest.conclusion != 'skipped' }}
        # A RATCHET, not a target: the floor is committed data, seeded
        # 1.5 under the measured coverage that recorded it; master
        # raises it past the hysteresis, never lowers it.
        run: |
          floor="$(python3 scripts/ci/thresholds.py --coverage-floor python)"
          python -m coverage report "--fail-under=${floor}" --precision=1

      - name: Install the JS toolchain from the lockfile
        if: ${{ !cancelled() && steps.pytest.conclusion != 'skipped' }}
        # npm ci installs package-lock.json exactly, so the c8 pin means
        # what it says and is visible to Dependabot (issue #361). Same
        # lockfile eslint.yml installs from.
        run: npm ci --no-audit --no-fund

      - name: JavaScript coverage gate
        # The front-end half of the same ratchet (issue #266):
        # NODE_V8_COVERAGE captures every node subprocess this step's
        # pytest run spawns, and c8 folds them over src/**/*.js — the
        # files node actually executes (.jsx panels are outside it).
        id: jscov
        if: ${{ !cancelled() && steps.pytest.conclusion != 'skipped' }}
        env:
          NODE_V8_COVERAGE: ${{ runner.temp }}/v8-coverage
        run: |
          rm -rf "$NODE_V8_COVERAGE" && mkdir -p "$NODE_V8_COVERAGE"
          # The measured set is scripts/ci/node_test_files.txt — one
          # `tests/…` path per line — not a hand list: the file is pinned
          # by tests/test_js_toolchain.py to equal
          # grep -lF '["node"' tests/*.py, so a node-executing test file
          # outside the list fails the suite instead of its exercised
          # paths quietly staying outside the measurement (issue #433).
          # The word split IS the invocation — one path per line becomes
          # one pytest argument:
          # shellcheck disable=SC2046
          python -m pytest $(cat scripts/ci/node_test_files.txt) -q --no-header
          floor="$(python3 scripts/ci/thresholds.py --coverage-floor javascript)"
          npx --no-install c8 report --temp-directory "$NODE_V8_COVERAGE" \
            --reporter=text --reporter=json-summary \
            --include 'src/**/*.js' --check-coverage --lines "$floor"
          js_measured="$(node -e 'console.log(
            require("./coverage/coverage-summary.json").total.lines.pct.toFixed(1))')"
          echo "js_measured=${js_measured}" >> "$GITHUB_OUTPUT"
          echo "JavaScript coverage measured ${js_measured}% " \
            "against floor ${floor}%"

      - name: Reparse CPU gate
        id: reparse
        if: ${{ !cancelled() && steps.pytest.conclusion != 'skipped' }}
        uses: ./.github/actions/reparse-bench  # zizmor: ignore[self-repository] GitHub's $/ self-repository form needs an actionlint that parses it (upstream rhysd/actionlint#732); migrate and drop this comment together (issue #597)
      - name: Module size baseline
        # Growth is fixed by moving code into a new module, never by
        # raising the recorded ceiling: a file that outgrew its entry
        # or crossed its ceiling fails here; master tightens below.
        if: ${{ !cancelled() && steps.pytest.conclusion != 'skipped' }}
        run: python3 scripts/ci/size_baseline.py

      - name: Pylint suppression baseline
        # The same only-shrinks ratchet for inline complexity
        # suppressions (issue #389): a file's count never rises past its
        # record; an unrecorded file stays at zero. Master tightens below.
        if: ${{ !cancelled() && steps.pytest.conclusion != 'skipped' }}
        run: python3 scripts/ci/suppression_baseline.py

      - name: Threshold direction guard
        # The bots are the only writers the ratchet data needs (issue
        # #388): a lowered coverage value, a raised reparse budget or
        # entry, or a raised suite-cost budget fails here. Runs on
        # pull_request (merge base) and push; dispatch skips -- the PR
        # is the gate.
        if: ${{ !cancelled() && steps.pytest.conclusion != 'skipped' && (github.event_name == 'pull_request' || github.event_name == 'push') }}
        env:
          REPO: ${{ github.repository }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request)
              git fetch --no-tags "https://github.com/${REPO}.git" "refs/heads/${BASE_REF}"
              base="$(git merge-base HEAD FETCH_HEAD)" ;;
            push)
              case "$BEFORE" in
                *[!0]*) base="$BEFORE" ;;
                *) base="$(git rev-parse HEAD^)" ;;
              esac ;;
          esac
          git show "${base}:.github/ci-thresholds.json" \
            > "$RUNNER_TEMP/base-thresholds.json"
          python3 scripts/ci/thresholds_guard.py \
            --base "$RUNNER_TEMP/base-thresholds.json" \
            --head .github/ci-thresholds.json

      - name: Measure and gate the suite cost
        # One bench pass per run (issue #515): the shared composite
        # action measures the pinned fixture and holds every phase to
        # its committed ceiling -- speed.yml's gate, folded here.
        # Master pushes feed the same measurement to the tighten bot
        # (ratchet-push.yml) via the upload below.
        id: suite_bench
        if: ${{ !cancelled() && steps.pytest.outcome == 'success'
                && steps.jscov.outcome == 'success' }}
        uses: ./.github/actions/suite-bench  # zizmor: ignore[self-repository] GitHub's $/ self-repository form needs an actionlint that parses it (upstream rhysd/actionlint#732); migrate and drop this comment together (issue #597)
        with:
          measurement: ${{ runner.temp }}/suite-measurement.json

      - name: Upload the suite measurement
        # The artifact is the tested state the bot job tightens from,
        # and a red gate's numbers stay inspectable: it uploads
        # whenever the bench RAN, not only when its gate passed.
        if: ${{ !cancelled() && steps.suite_bench.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: suite-measurement
          path: ${{ runner.temp }}/suite-measurement.json
          if-no-files-found: error
          retention-days: 1

      - name: Ratchet the thresholds
        # Only measurements from a master push may move the recorded
        # calibration — a pull request runs untrusted code and must not
        # be able to write it. The ratchets raise either coverage floor
        # and tighten the reparse phase bytecode counts (the per-phase
        # shares are telemetry since #513 and nothing tightens them);
        # growth is never written here, the gates stay gates.
        id: ratchet
        if: ${{ !cancelled() && steps.pytest.outcome == 'success'
                && steps.jscov.outcome == 'success'
                && steps.reparse.outcome == 'success'
                && steps.suite_bench.outcome == 'success'
                && github.event_name == 'push'
                && github.ref == 'refs/heads/master' }}
        # JS_MEASURED travels by env, not by template expansion, so the
        # run block carries no injection surface (zizmor
        # template-injection): it is a toFixed(1) number the JS gate step
        # itself printed.
        env:
          JS_MEASURED: ${{ steps.jscov.outputs.js_measured }}
        run: |
          measured="$(python -m coverage report --format=total --precision=1)"
          python3 scripts/ci/ratchet.py --measured "${measured}"
          python3 scripts/ci/ratchet.py --language javascript \
            --measured "${JS_MEASURED}"
          python3 scripts/ci/reparse_ratchet.py --measured-file reparse-bench.json
          python3 scripts/ci/size_baseline.py --tighten
          python3 scripts/ci/suppression_baseline.py --tighten
          python3 scripts/ci/thresholds.py --check
          if [ -n "$(git status --porcelain .github/ci-thresholds.json)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo '### Recorded by this run'
              echo
              echo '```diff'
              git diff -- .github/ci-thresholds.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Python coverage ${measured}%, JavaScript coverage" \
              "${JS_MEASURED}% and unchanged module sizes" \
              "justify no raise."
          fi

      - name: Stage the ratchet data
        # The tested state: the measured file and the tip it was
        # measured on — the ratchet-push workflow's base check
        # compares against it.
        if: steps.ratchet.outputs.changed == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/ratchet-data"
          cp .github/ci-thresholds.json "$RUNNER_TEMP/ratchet-data/ci-thresholds.json"
          git rev-parse HEAD > "$RUNNER_TEMP/ratchet-data/base.txt"

      - name: Upload the ratchet data
        if: steps.ratchet.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ratchet-push
          path: ${{ runner.temp }}/ratchet-data
          if-no-files-found: error
          retention-days: 1

  pytest-portable:
    # The suite minus every DB-touching test (tests/db_marker.py's
    # mechanical split), where no Postgres service exists: the full
    # suite, the ratchets and the DB tests stay in the `pytest` job.
    name: pytest (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the thresholds loader's re-seed walk reads up
          # to _MAX_VISITS commits for the re-seed marker, which may sit
          # on the BASE side of the merge or under a master tip — no
          # fixed depth carries it (issue #582). This job runs the
          # suite, so it reads the loader.
          fetch-depth: 0
          # No step in this job pushes; persist-credentials: false keeps
          # the job token out of .git/config for any later step to reuse.
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # Same event rule as the Linux job (issue #126); key carries the
      # matrix python-version.
      - name: Restore the pip cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/pip
            ~/Library/Caches/pip
            ~\AppData\Local\pip\Cache
          key: pip-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('backend/requirements.txt', 'requirements-test.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Install dependencies
        # backend/requirements.txt already pins pytest, pytest-asyncio
        # and httpx2; requirements-test.txt adds only the coverage
        # toolchain. One command, because the default pwsh shell on
        # windows-latest propagates only the last line's exit code.
        run: python -m pip install --upgrade pip -r backend/requirements.txt -r requirements-test.txt

      # Saved here, not in a post-job step, so the cache is written only
      # from a master push (issue #126).
      - name: Save the pip cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        with:
          path: |
            ~/.cache/pip
            ~/Library/Caches/pip
            ~\AppData\Local\pip\Cache
          key: pip-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('backend/requirements.txt', 'requirements-test.txt') }}

      - name: Run tests
        # A plain `python -m pytest`: the db-marked tests are the ones
        # the portable cells cannot serve; the Linux job runs the full
        # suite.
        run: python -m pytest tests/ -q --tb=short -ra -m "not db"
