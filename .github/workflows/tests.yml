name: tests

on:
  workflow_call: {inputs: {comment_only: {description: "narrow the portable matrix", type: string, default: "false"}, thresholds_only: {description: "narrow to thresholds checks and calibration gates", type: string, default: "false"}}}
  workflow_dispatch:

# Least privilege: without an explicit block every job inherits the repository default, which can be read/write for the whole token.
permissions: {contents: read}

concurrency:
  # ci-gate's per-SHA push groups make this the queue that serializes
  # master runs; PR legs cancel in progress, and ratchet-push.yml
  # serializes the ratchet push itself.
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    if: inputs.thresholds_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs: {canary: "${{ steps.canary.outputs.matrix }}", portable: "${{ steps.portable.outputs.matrix }}"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - id: canary
        uses: Nitjsefnie-Actions/test-ratchet/plan@96562a47e9b7fe74b55cc70a4636d1b5d7b542e2 # v2.4.2
        with: {tests: "tests/**/test_*.py", times: .github/test-times.json, shards: 4}
      - id: portable
        uses: Nitjsefnie-Actions/test-ratchet/plan@96562a47e9b7fe74b55cc70a4636d1b5d7b542e2 # v2.4.2
        with: {tests: "tests/**/test_*.py", times: .github/test-times.json, shards: 2}
  test:
    name: pytest shard ${{ matrix.shard }} (canary, pinned 3.15.1)
    needs: plan
    strategy: {fail-fast: false, matrix: {shard: "${{ fromJSON(needs.plan.outputs.canary).shard }}"}}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env: {PGHOST: localhost, PGPORT: "5432", PGUSER: postgres, PGPASSWORD: postgres}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Start cached Postgres
        uses: $/.github/actions/postgres
      # Pin runtimes: interpreter and V8 drift move the calibration.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "3.15.1"}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: "24.17.0"}
      - name: Resolve the threshold base
        id: threshold_base
        env: {"CLAUDIT_REPO": "${{ github.repository }}", "CLAUDIT_BASE_REF": "${{ github.event.pull_request.base.ref }}", "CLAUDIT_EVENT": "${{ github.event_name }}", "CLAUDIT_BEFORE": "${{ github.event.before }}"}
        uses: $/.github/actions/thresholds-base
      - name: Restore the pip cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: {"path": "~/.cache/pip\n~/Library/Caches/pip\n~\\AppData\\Local\\pip\\Cache\n", "key": "pip-${{ runner.os }}-3.15-${{ hashFiles('backend/requirements.txt', 'requirements-test.txt', 'requirements-pyyaml.txt') }}", "restore-keys": "pip-${{ runner.os }}-3.15-\n"}
      - name: Install dependencies
        run: |
          scripts/ci/retry.sh python -m pip install --upgrade pip
          scripts/ci/retry.sh pip install --require-hashes --only-binary=:all: --no-binary=PyYAML -r requirements-pyyaml.txt && scripts/ci/retry.sh pip install -r backend/requirements.txt -r requirements-test.txt
      # One matrix writer per shared cache key, on master.
      - name: Save the pip cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && matrix.shard == '1/4'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: {"path": "~/.cache/pip\n~/Library/Caches/pip\n~\\AppData\\Local\\pip\\Cache\n", "key": "pip-${{ runner.os }}-3.15-${{ hashFiles('backend/requirements.txt', 'requirements-test.txt', 'requirements-pyyaml.txt') }}"}
      - name: CPU counters before the tests
        run: |
          grep -m1 'model name' /proc/cpuinfo
          nproc
          grep '^cpu ' /proc/stat
      # The coverage gate's cell: report in ci-gate.yml gates this cell's merged shards.
      - name: Run tests
        env: {CLAUDIT_DEBUG_NODE_STALL: "1"}
        timeout-minutes: 15
        uses: Nitjsefnie-Actions/test-ratchet/run@96562a47e9b7fe74b55cc70a4636d1b5d7b542e2 # v2.4.2
        with: {runner: pytest, tests: "tests/**/test_*.py", times: .github/test-times.json, cell: ubuntu-latest-3.15.1, shard: "${{ matrix.shard }}", source: backend, javascript: "src/**/*.js", args: "-n 0 -q --tb=short -ra -o faulthandler_timeout=240 --durations=20"}
      - name: CPU counters after the tests
        if: always()
        run: grep '^cpu ' /proc/stat

  baselines:
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "3.15.1"}
      - name: Resolve the threshold base
        id: threshold_base
        env: {"CLAUDIT_REPO": "${{ github.repository }}", "CLAUDIT_BASE_REF": "${{ github.event.pull_request.base.ref }}", "CLAUDIT_EVENT": "${{ github.event_name }}", "CLAUDIT_BEFORE": "${{ github.event.before }}"}
        uses: $/.github/actions/thresholds-base
      - name: Restore the pip cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: {"path": "~/.cache/pip\n~/Library/Caches/pip\n~\\AppData\\Local\\pip\\Cache\n", "key": "pip-${{ runner.os }}-3.15-${{ hashFiles('backend/requirements.txt', 'requirements-test.txt', 'requirements-pyyaml.txt') }}", "restore-keys": "pip-${{ runner.os }}-3.15-\n"}
      - name: Install dependencies
        run: |
          scripts/ci/retry.sh python -m pip install --upgrade pip
          scripts/ci/retry.sh pip install --require-hashes --only-binary=:all: --no-binary=PyYAML -r requirements-pyyaml.txt && scripts/ci/retry.sh pip install -r backend/requirements.txt -r requirements-test.txt
      - name: Pylint suppression baseline
        if: ${{ !cancelled() && inputs.thresholds_only != 'true' }}
        run: python3 scripts/ci/suppression_baseline.py --base-rev "$CLAUDIT_THRESHOLDS_BASE_REV" --head-rev HEAD
      - name: Threshold direction guard
        if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'push') }}
        run: |
          base="${CLAUDIT_THRESHOLDS_BASE_REV?Threshold base resolution failed}"
          if [ -z "$base" ]; then
            echo "Threshold direction guard takes NO verdict on this push: no base exists in this clone."
            exit 0
          fi
          git show "${base}:.github/ci-thresholds.json" \
            > "$RUNNER_TEMP/base-thresholds.json"
          python3 scripts/ci/thresholds_guard.py \
            --base "$RUNNER_TEMP/base-thresholds.json" \
            --head .github/ci-thresholds.json \
            --base-rev "$base" --head-rev HEAD

  reparse-gate:
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "3.15.1"}
      - name: Resolve the threshold base
        id: threshold_base
        env: {"CLAUDIT_REPO": "${{ github.repository }}", "CLAUDIT_BASE_REF": "${{ github.event.pull_request.base.ref }}", "CLAUDIT_EVENT": "${{ github.event_name }}", "CLAUDIT_BEFORE": "${{ github.event.before }}"}
        uses: $/.github/actions/thresholds-base
      - name: Restore the pip cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: {"path": "~/.cache/pip\n~/Library/Caches/pip\n~\\AppData\\Local\\pip\\Cache\n", "key": "pip-${{ runner.os }}-3.15-${{ hashFiles('backend/requirements.txt', 'requirements-test.txt', 'requirements-pyyaml.txt') }}", "restore-keys": "pip-${{ runner.os }}-3.15-\n"}
      - name: Install dependencies
        run: |
          scripts/ci/retry.sh python -m pip install --upgrade pip
          scripts/ci/retry.sh pip install --require-hashes --only-binary=:all: --no-binary=PyYAML -r requirements-pyyaml.txt && scripts/ci/retry.sh pip install -r backend/requirements.txt -r requirements-test.txt
      - name: Reparse CPU gate
        id: reparse
        uses: $/.github/actions/reparse-bench

  suite-bench:
    needs: [test, pytest-thresholds]
    if: ${{ !cancelled() && (needs.test.result == 'success' || needs.pytest-thresholds.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "3.15.1"}
      - name: Resolve the threshold base
        id: threshold_base
        env: {"CLAUDIT_REPO": "${{ github.repository }}", "CLAUDIT_BASE_REF": "${{ github.event.pull_request.base.ref }}", "CLAUDIT_EVENT": "${{ github.event_name }}", "CLAUDIT_BEFORE": "${{ github.event.before }}"}
        uses: $/.github/actions/thresholds-base
      - name: Restore the pip cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: {"path": "~/.cache/pip\n~/Library/Caches/pip\n~\\AppData\\Local\\pip\\Cache\n", "key": "pip-${{ runner.os }}-3.15-${{ hashFiles('backend/requirements.txt', 'requirements-test.txt', 'requirements-pyyaml.txt') }}", "restore-keys": "pip-${{ runner.os }}-3.15-\n"}
      - name: Install dependencies
        run: |
          scripts/ci/retry.sh python -m pip install --upgrade pip
          scripts/ci/retry.sh pip install --require-hashes --only-binary=:all: --no-binary=PyYAML -r requirements-pyyaml.txt && scripts/ci/retry.sh pip install -r backend/requirements.txt -r requirements-test.txt
      - name: Save the pip cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: {"path": "~/.cache/pip\n~/Library/Caches/pip\n~\\AppData\\Local\\pip\\Cache\n", "key": "pip-${{ runner.os }}-3.15-${{ hashFiles('backend/requirements.txt', 'requirements-test.txt', 'requirements-pyyaml.txt') }}"}
      - name: Measure and gate the suite cost
        id: suite_bench
        uses: $/.github/actions/suite-bench
        with: {"measurement": "${{ runner.temp }}/suite-measurement.json"}
      - name: Upload the suite measurement
        if: ${{ !cancelled() && steps.suite_bench.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: {"name": "suite-measurement", "path": "${{ runner.temp }}/suite-measurement.json", "if-no-files-found": "error", "retention-days": "1"}

  pytest-thresholds:
    if: inputs.thresholds_only == 'true'
    name: pytest thresholds subset (canary, pinned 3.15.1)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env: {PGHOST: localhost, PGPORT: "5432", PGUSER: postgres, PGPASSWORD: postgres}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Start cached Postgres
        uses: $/.github/actions/postgres
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "3.15.1"}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: "24.17.0"}
      - name: Resolve the threshold base
        id: threshold_base
        env: {"CLAUDIT_REPO": "${{ github.repository }}", "CLAUDIT_BASE_REF": "${{ github.event.pull_request.base.ref }}", "CLAUDIT_EVENT": "${{ github.event_name }}", "CLAUDIT_BEFORE": "${{ github.event.before }}"}
        uses: $/.github/actions/thresholds-base
      - name: Restore the pip cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: {"path": "~/.cache/pip\n~/Library/Caches/pip\n~\\AppData\\Local\\pip\\Cache\n", "key": "pip-${{ runner.os }}-3.15-${{ hashFiles('backend/requirements.txt', 'requirements-test.txt', 'requirements-pyyaml.txt') }}", "restore-keys": "pip-${{ runner.os }}-3.15-\n"}
      - name: Install dependencies
        run: |
          scripts/ci/retry.sh python -m pip install --upgrade pip
          scripts/ci/retry.sh pip install --require-hashes --only-binary=:all: --no-binary=PyYAML -r requirements-pyyaml.txt && scripts/ci/retry.sh pip install -r backend/requirements.txt -r requirements-test.txt
      - name: Run tests
        run: |
          # shellcheck disable=SC2046
          python -m pytest $(sed '/^#/d;/^$/d' scripts/ci/thresholds_test_files.txt) -q --tb=short -ra -o faulthandler_timeout=240 --durations=20

  ratchet:
    needs: [test, reparse-gate, suite-bench]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.test.result == 'success' && needs.reparse-gate.result == 'success' && needs.suite-bench.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "3.15.1"}
      - name: Resolve the threshold base
        id: threshold_base
        env: {"CLAUDIT_REPO": "${{ github.repository }}", "CLAUDIT_BASE_REF": "${{ github.event.pull_request.base.ref }}", "CLAUDIT_EVENT": "${{ github.event_name }}", "CLAUDIT_BEFORE": "${{ github.event.before }}"}
        uses: $/.github/actions/thresholds-base
      - name: Restore the pip cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: {"path": "~/.cache/pip\n~/Library/Caches/pip\n~\\AppData\\Local\\pip\\Cache\n", "key": "pip-${{ runner.os }}-3.15-${{ hashFiles('backend/requirements.txt', 'requirements-test.txt', 'requirements-pyyaml.txt') }}", "restore-keys": "pip-${{ runner.os }}-3.15-\n"}
      - name: Install dependencies
        run: |
          scripts/ci/retry.sh python -m pip install --upgrade pip
          scripts/ci/retry.sh pip install --require-hashes --only-binary=:all: --no-binary=PyYAML -r requirements-pyyaml.txt && scripts/ci/retry.sh pip install -r backend/requirements.txt -r requirements-test.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: "24.17.0"}
      - name: Install the JS toolchain from the lockfile
        run: scripts/ci/retry.sh timeout -k 5 120 npm ci --no-audit --no-fund
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {name: reparse-measurement, path: .}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {name: suite-measurement, path: "${{ runner.temp }}/suite-data"}
      - name: Ratchet the thresholds
        id: ratchet
        run: |
          python3 scripts/ci/reparse_ratchet.py --measured-file reparse-bench.json
          python3 scripts/ci/suppression_baseline.py --tighten
          python3 scripts/ci/thresholds.py --check
          if [ -n "$(git status --porcelain .github/ci-thresholds.json)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo '### Recorded by this run'
              echo
              echo '```diff'
              git diff -- .github/ci-thresholds.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The reparse and suppression measurements justify no move."
          fi
      - name: Stage the ratchet data
        if: steps.ratchet.outputs.changed == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/ratchet-data"
          cp .github/ci-thresholds.json "$RUNNER_TEMP/ratchet-data/ci-thresholds.json"
          git rev-parse HEAD > "$RUNNER_TEMP/ratchet-data/base.txt"
      - name: Upload the ratchet data
        if: steps.ratchet.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: {"name": "ratchet-push", "path": "${{ runner.temp }}/ratchet-data", "if-no-files-found": "error", "retention-days": "1"}
  test-portable:
    # The suite minus every DB-touching test (tests/db_marker.py's mechanical split), halved per cell; a comment-only change skips the matrix, the canary still runs it.
    if: inputs.comment_only != 'true' && inputs.thresholds_only != 'true'
    name: pytest (${{ matrix.os }}, ${{ matrix.python-version }}, shard ${{ matrix.shard }})
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.14", "3.15"]
        shard: ${{ fromJSON(needs.plan.outputs.portable).shard }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Full history lets each cell resolve the judged range for declared-removal exemptions; no step here pushes, so no token stays in .git/config.
        with: {fetch-depth: 0, persist-credentials: false}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Resolve the threshold base
        id: threshold_base
        uses: $/.github/actions/thresholds-base
        env:
          CLAUDIT_REPO: ${{ github.repository }}
          CLAUDIT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          CLAUDIT_EVENT: ${{ github.event_name }}
          CLAUDIT_BEFORE: ${{ github.event.before }}

      - name: Restore the pip cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: {"path": "~/.cache/pip\n~/Library/Caches/pip\n~\\AppData\\Local\\pip\\Cache\n", "key": "pip-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('backend/requirements.txt', 'requirements-test.txt', 'requirements-pyyaml.txt') }}", "restore-keys": "pip-${{ runner.os }}-${{ matrix.python-version }}-\n"}

      - name: Install dependencies
        shell: bash
        run: "scripts/ci/retry.sh pip install --require-hashes --only-binary=:all: --no-binary=PyYAML -r requirements-pyyaml.txt && scripts/ci/retry.sh python -m pip install --upgrade pip -r backend/requirements.txt -r requirements-test.txt"

      # Saved here, not in a post-job step, so the cache is written only from a master push, by one shard per key.
      - name: Save the pip cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && matrix.shard == '1/2'
        with: {"path": "~/.cache/pip\n~/Library/Caches/pip\n~\\AppData\\Local\\pip\\Cache\n", "key": "pip-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('backend/requirements.txt', 'requirements-test.txt', 'requirements-pyyaml.txt') }}"}

      - name: Run tests
        env: {PGHOST: "${{ runner.temp }}", CLAUDIT_DEBUG_NODE_STALL: "1"} # No socket here: fail without Windows TCP connect timeouts.
        timeout-minutes: 15
        uses: Nitjsefnie-Actions/test-ratchet/run@96562a47e9b7fe74b55cc70a4636d1b5d7b542e2 # v2.4.2
        with: {runner: pytest, tests: "tests/**/test_*.py", times: .github/test-times.json, cell: "${{ matrix.os }}-${{ matrix.python-version }}", shard: "${{ matrix.shard }}", source: backend, args: "-n 0 -q --tb=short -ra -m \"not db\" -o faulthandler_timeout=240 --durations=20"}
