name: tests

on:
  workflow_call: {inputs: {comment_only: {description: "narrow the portable matrix", type: string, default: "false"}, thresholds_only: {description: "narrow to thresholds checks and calibration gates", type: string, default: "false"}}}
  workflow_dispatch:

# Least privilege: without an explicit block every job inherits the repository default, which can be read/write for the whole token.
permissions: {contents: read}

concurrency:
  # ci-gate's per-SHA push groups make this the queue that serializes
  # master runs; PR legs cancel in progress, and ratchet-push.yml
  # serializes the ratchet push itself.
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest-shards:
    name: pytest shard ${{ matrix.shard }} (canary, pinned 3.13.14)
    if: inputs.thresholds_only != 'true'
    strategy: {fail-fast: false, matrix: {shard: [1, 2, 3, 4]}}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env: {PGHOST: localhost, PGPORT: "5432", PGUSER: postgres, PGPASSWORD: postgres}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Start cached Postgres
        uses: $/.github/actions/postgres
      # Pin runtimes: interpreter and V8 drift move the calibration.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "3.13.14"}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: "24.17.0"}
      - name: Resolve the threshold base
        id: threshold_base
        env: {"CLAUDIT_REPO": "${{ github.repository }}", "CLAUDIT_BASE_REF": "${{ github.event.pull_request.base.ref }}", "CLAUDIT_EVENT": "${{ github.event_name }}", "CLAUDIT_BEFORE": "${{ github.event.before }}"}
        uses: $/.github/actions/thresholds-base
      - name: Restore the pip cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: {"path": "~/.cache/pip\n~/Library/Caches/pip\n~\\AppData\\Local\\pip\\Cache\n", "key": "pip-${{ runner.os }}-3.13-${{ hashFiles('backend/requirements.txt', 'requirements-test.txt') }}", "restore-keys": "pip-${{ runner.os }}-3.13-\n"}
      - name: Install postgresql-client
        timeout-minutes: 5
        uses: $/.github/actions/apt-install
        with:
          packages: postgresql-client-16
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r requirements-test.txt
      # One matrix writer per shared cache key, on master.
      - name: Save the pip cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && matrix.shard == 1
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: {"path": "~/.cache/pip\n~/Library/Caches/pip\n~\\AppData\\Local\\pip\\Cache\n", "key": "pip-${{ runner.os }}-3.13-${{ hashFiles('backend/requirements.txt', 'requirements-test.txt') }}"}
      - name: Run tests
        env: {"COVERAGE_FILE": "${{ github.workspace }}/shard-coverage/.coverage.${{ matrix.shard }}"}
        run: |
          # shellcheck disable=SC2046
          python -m pytest $(python3 scripts/ci/pytest_shards.py --shard ${{ matrix.shard }} --of 4) -q --tb=short -ra --cov=backend --cov-report=
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with: {name: "coverage-shard-${{ matrix.shard }}", path: "shard-coverage/.coverage.${{ matrix.shard }}", include-hidden-files: true, if-no-files-found: error, retention-days: 1}
  coverage-combine:
    needs: [pytest-shards]
    if: ${{ !cancelled() && inputs.thresholds_only != 'true' }}
    permissions: {contents: read}
    outputs: {python_measured: "${{ steps.measured.outputs.python_measured }}"}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # Keep artifact directories so every shard is checked before combining.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "3.13.14"}
      - name: Resolve the threshold base
        id: threshold_base
        env: {"CLAUDIT_REPO": "${{ github.repository }}", "CLAUDIT_BASE_REF": "${{ github.event.pull_request.base.ref }}", "CLAUDIT_EVENT": "${{ github.event_name }}", "CLAUDIT_BEFORE": "${{ github.event.before }}"}
        uses: $/.github/actions/thresholds-base
      - name: Restore the pip cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: {"path": "~/.cache/pip\n~/Library/Caches/pip\n~\\AppData\\Local\\pip\\Cache\n", "key": "pip-${{ runner.os }}-3.13-${{ hashFiles('backend/requirements.txt', 'requirements-test.txt') }}", "restore-keys": "pip-${{ runner.os }}-3.13-\n"}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r requirements-test.txt
      - name: Download coverage shards
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {pattern: coverage-shard-*, path: shard-data/}
      - name: Combine shard coverage
        run: >-
          python3 scripts/ci/coverage_shards.py --validate-and-combine
          shard-data/coverage-shard-1 shard-data/coverage-shard-2
          shard-data/coverage-shard-3 shard-data/coverage-shard-4
      - id: measured
        run: |
          echo "python_measured=$(python -m coverage report --format=total --precision=1)" >> "$GITHUB_OUTPUT"
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          recorded_measured="$(python3 scripts/ci/thresholds.py \
            --coverage-measured python)"
          floor="$(python3 scripts/ci/thresholds.py --coverage-floor python)"
          js_measured="$(python3 scripts/ci/thresholds.py \
            --coverage-measured javascript)"
          js_floor="$(python3 scripts/ci/thresholds.py \
            --coverage-floor javascript)"
          if [ -n "$floor" ]; then
            python_recorded="measured ${recorded_measured}% / floor ${floor}%"
          else
            python_recorded="not recorded"
          fi
          if [ -n "$js_floor" ]; then
            javascript_recorded="measured ${js_measured}% / floor ${js_floor}%"
          else
            javascript_recorded="not recorded"
          fi
          {
            echo '### Coverage'
            echo
            echo "Recorded ratchet (from .github/ci-thresholds.json):" \
              "python ${python_recorded}," \
              "javascript ${javascript_recorded}"
            echo
            python -m coverage report --format=markdown --precision=1
          } >> "$GITHUB_STEP_SUMMARY"
          python -m coverage xml -o coverage.xml
      - name: Upload coverage.xml
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: {"name": "coverage-xml", "path": "coverage.xml", "if-no-files-found": "error"}
      - name: Patch coverage against the merge base
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: |
          base="$CLAUDIT_THRESHOLDS_BASE_REV"
          echo "Patch base: $(git log -1 --format='%h %s' "$base")"
          git diff "$base" HEAD -- '*.py' > "$RUNNER_TEMP/pr.diff"
          python3 scripts/ci/diff_coverage.py \
            --coverage coverage.xml \
            --diff "$RUNNER_TEMP/pr.diff" \
            --summary-file "$GITHUB_STEP_SUMMARY" \
            > "$RUNNER_TEMP/diff-coverage.md"
      - name: Stage the patch-coverage comment
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env: {"CLAUDIT_PR_NUMBER": "${{ github.event.pull_request.number }}"}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/coverage-comment"
          cp "$RUNNER_TEMP/diff-coverage.md" \
            "$RUNNER_TEMP/coverage-comment/body.md"
          printf '%s\n' "$CLAUDIT_PR_NUMBER" \
            > "$RUNNER_TEMP/coverage-comment/pr-number.txt"
          wc -c < "$RUNNER_TEMP/coverage-comment/body.md"
      - name: Upload the patch-coverage comment
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: {"name": "diff-coverage-comment", "path": "${{ runner.temp }}/coverage-comment", "if-no-files-found": "error", "retention-days": "5"}
      - name: Coverage gate
        if: ${{ !cancelled() }}
        uses: $/.github/actions/coverage-gate
        with: {"language": "python"}

  baselines:
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "3.13.14"}
      - name: Resolve the threshold base
        id: threshold_base
        env: {"CLAUDIT_REPO": "${{ github.repository }}", "CLAUDIT_BASE_REF": "${{ github.event.pull_request.base.ref }}", "CLAUDIT_EVENT": "${{ github.event_name }}", "CLAUDIT_BEFORE": "${{ github.event.before }}"}
        uses: $/.github/actions/thresholds-base
      - name: Restore the pip cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: {"path": "~/.cache/pip\n~/Library/Caches/pip\n~\\AppData\\Local\\pip\\Cache\n", "key": "pip-${{ runner.os }}-3.13-${{ hashFiles('backend/requirements.txt', 'requirements-test.txt') }}", "restore-keys": "pip-${{ runner.os }}-3.13-\n"}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r requirements-test.txt
      - name: Pylint suppression baseline
        if: ${{ !cancelled() && inputs.thresholds_only != 'true' }}
        run: python3 scripts/ci/suppression_baseline.py --base-rev "$CLAUDIT_THRESHOLDS_BASE_REV" --head-rev HEAD
      - name: Threshold direction guard
        if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'push') }}
        run: |
          base="${CLAUDIT_THRESHOLDS_BASE_REV?Threshold base resolution failed}"
          if [ -z "$base" ]; then
            echo "Threshold direction guard takes NO verdict on this push: no base exists in this clone."
            exit 0
          fi
          git show "${base}:.github/ci-thresholds.json" \
            > "$RUNNER_TEMP/base-thresholds.json"
          python3 scripts/ci/thresholds_guard.py \
            --base "$RUNNER_TEMP/base-thresholds.json" \
            --head .github/ci-thresholds.json \
            --base-rev "$base" --head-rev HEAD

  size-baseline:
    if: ${{ !cancelled() && inputs.thresholds_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Judge the PR head tree: check mode's seed fallback compares the
          # head's records against a seeding tighten of the same tree.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Size baseline (check on a pull request, tighten on master)
        uses: Nitjsefnie-Actions/size-ratchet@67bb01e536611398a3b5cedd3f3cf95fd6e5693e # v1.0.1
        with:
          # auto fails closed on workflow_dispatch, which ci gate also
          # serves, so the mode is spelled per event instead.
          mode: ${{ github.event_name == 'pull_request' && 'check' || 'tighten' }}
          overrides: 'tests/: 700'
          base-ref: ${{ github.event.pull_request.base.sha }}
      - name: Stage the size records
        id: size_stage
        run: |
          changed=0
          git diff --quiet -- .github/size-baseline.json || changed=$?
          if [ "$changed" -gt 1 ]; then
            echo "git diff failed with $changed" >&2
            exit "$changed"
          fi
          if [ "$changed" -eq 0 ]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/size-ratchet"
          cp .github/size-baseline.json "$RUNNER_TEMP/size-ratchet/size-baseline.json"
          git rev-parse HEAD > "$RUNNER_TEMP/size-ratchet/base.txt"
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Upload the size records
        if: steps.size_stage.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: size-ratchet-push
          path: ${{ runner.temp }}/size-ratchet
          if-no-files-found: error
          retention-days: 1

  js-coverage:
    if: inputs.thresholds_only != 'true'
    outputs: {js_measured: "${{ steps.jscov.outputs.js_measured }}"}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env: {PGHOST: localhost, PGPORT: "5432", PGUSER: postgres, PGPASSWORD: postgres}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Start cached Postgres
        uses: $/.github/actions/postgres
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "3.13.14"}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: "24.17.0"}
      - name: Resolve the threshold base
        id: threshold_base
        env: {"CLAUDIT_REPO": "${{ github.repository }}", "CLAUDIT_BASE_REF": "${{ github.event.pull_request.base.ref }}", "CLAUDIT_EVENT": "${{ github.event_name }}", "CLAUDIT_BEFORE": "${{ github.event.before }}"}
        uses: $/.github/actions/thresholds-base
      - name: Restore the pip cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: {"path": "~/.cache/pip\n~/Library/Caches/pip\n~\\AppData\\Local\\pip\\Cache\n", "key": "pip-${{ runner.os }}-3.13-${{ hashFiles('backend/requirements.txt', 'requirements-test.txt') }}", "restore-keys": "pip-${{ runner.os }}-3.13-\n"}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r requirements-test.txt
      - name: Install the JS toolchain from the lockfile
        run: npm ci --no-audit --no-fund
      - name: JavaScript coverage gate
        id: jscov
        if: ${{ !cancelled() }}
        uses: $/.github/actions/coverage-gate
        with: {"language": "javascript"}

  reparse-gate:
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "3.13.14"}
      - name: Resolve the threshold base
        id: threshold_base
        env: {"CLAUDIT_REPO": "${{ github.repository }}", "CLAUDIT_BASE_REF": "${{ github.event.pull_request.base.ref }}", "CLAUDIT_EVENT": "${{ github.event_name }}", "CLAUDIT_BEFORE": "${{ github.event.before }}"}
        uses: $/.github/actions/thresholds-base
      - name: Restore the pip cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: {"path": "~/.cache/pip\n~/Library/Caches/pip\n~\\AppData\\Local\\pip\\Cache\n", "key": "pip-${{ runner.os }}-3.13-${{ hashFiles('backend/requirements.txt', 'requirements-test.txt') }}", "restore-keys": "pip-${{ runner.os }}-3.13-\n"}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r requirements-test.txt
      - name: Reparse CPU gate
        id: reparse
        uses: $/.github/actions/reparse-bench

  suite-bench:
    needs: [pytest-shards, pytest-thresholds, js-coverage]
    if: ${{ !cancelled() && (needs.pytest-shards.result == 'success' || needs.pytest-thresholds.result == 'success') && (needs.js-coverage.result == 'success' || inputs.thresholds_only == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "3.13.14"}
      - name: Resolve the threshold base
        id: threshold_base
        env: {"CLAUDIT_REPO": "${{ github.repository }}", "CLAUDIT_BASE_REF": "${{ github.event.pull_request.base.ref }}", "CLAUDIT_EVENT": "${{ github.event_name }}", "CLAUDIT_BEFORE": "${{ github.event.before }}"}
        uses: $/.github/actions/thresholds-base
      - name: Restore the pip cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: {"path": "~/.cache/pip\n~/Library/Caches/pip\n~\\AppData\\Local\\pip\\Cache\n", "key": "pip-${{ runner.os }}-3.13-${{ hashFiles('backend/requirements.txt', 'requirements-test.txt') }}", "restore-keys": "pip-${{ runner.os }}-3.13-\n"}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r requirements-test.txt
      - name: Save the pip cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: {"path": "~/.cache/pip\n~/Library/Caches/pip\n~\\AppData\\Local\\pip\\Cache\n", "key": "pip-${{ runner.os }}-3.13-${{ hashFiles('backend/requirements.txt', 'requirements-test.txt') }}"}
      - name: Measure and gate the suite cost
        id: suite_bench
        uses: $/.github/actions/suite-bench
        with: {"measurement": "${{ runner.temp }}/suite-measurement.json"}
      - name: Upload the suite measurement
        if: ${{ !cancelled() && steps.suite_bench.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: {"name": "suite-measurement", "path": "${{ runner.temp }}/suite-measurement.json", "if-no-files-found": "error", "retention-days": "1"}

  pytest-thresholds:
    if: inputs.thresholds_only == 'true'
    name: pytest thresholds subset (canary, pinned 3.13.14)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env: {PGHOST: localhost, PGPORT: "5432", PGUSER: postgres, PGPASSWORD: postgres}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Start cached Postgres
        uses: $/.github/actions/postgres
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "3.13.14"}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: "24.17.0"}
      - name: Resolve the threshold base
        id: threshold_base
        env: {"CLAUDIT_REPO": "${{ github.repository }}", "CLAUDIT_BASE_REF": "${{ github.event.pull_request.base.ref }}", "CLAUDIT_EVENT": "${{ github.event_name }}", "CLAUDIT_BEFORE": "${{ github.event.before }}"}
        uses: $/.github/actions/thresholds-base
      - name: Restore the pip cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: {"path": "~/.cache/pip\n~/Library/Caches/pip\n~\\AppData\\Local\\pip\\Cache\n", "key": "pip-${{ runner.os }}-3.13-${{ hashFiles('backend/requirements.txt', 'requirements-test.txt') }}", "restore-keys": "pip-${{ runner.os }}-3.13-\n"}
      - name: Install postgresql-client
        timeout-minutes: 5
        uses: $/.github/actions/apt-install
        with:
          packages: postgresql-client-16
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r requirements-test.txt
      - name: Run tests
        run: |
          # shellcheck disable=SC2046
          python -m pytest $(sed '/^#/d;/^$/d' scripts/ci/thresholds_test_files.txt) -q --tb=short -ra

  ratchet:
    needs: [pytest-shards, coverage-combine, js-coverage, reparse-gate, suite-bench]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.pytest-shards.result == 'success' && needs.coverage-combine.result == 'success' && needs.js-coverage.result == 'success' && needs.reparse-gate.result == 'success' && needs.suite-bench.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "3.13.14"}
      - name: Resolve the threshold base
        id: threshold_base
        env: {"CLAUDIT_REPO": "${{ github.repository }}", "CLAUDIT_BASE_REF": "${{ github.event.pull_request.base.ref }}", "CLAUDIT_EVENT": "${{ github.event_name }}", "CLAUDIT_BEFORE": "${{ github.event.before }}"}
        uses: $/.github/actions/thresholds-base
      - name: Restore the pip cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: {"path": "~/.cache/pip\n~/Library/Caches/pip\n~\\AppData\\Local\\pip\\Cache\n", "key": "pip-${{ runner.os }}-3.13-${{ hashFiles('backend/requirements.txt', 'requirements-test.txt') }}", "restore-keys": "pip-${{ runner.os }}-3.13-\n"}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r requirements-test.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: "24.17.0"}
      - name: Install the JS toolchain from the lockfile
        run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {name: reparse-measurement, path: .}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {name: suite-measurement, path: "${{ runner.temp }}/suite-data"}
      - name: Ratchet the thresholds
        id: ratchet
        env: {"CLAUDIT_JS_MEASURED": "${{ needs.js-coverage.outputs.js_measured }}", "CLAUDIT_PY_MEASURED": "${{ needs.coverage-combine.outputs.python_measured }}"}
        run: |
          measured="$CLAUDIT_PY_MEASURED"
          python3 scripts/ci/ratchet.py --measured "${measured}"
          python3 scripts/ci/ratchet.py --language javascript \
            --measured "${CLAUDIT_JS_MEASURED}"
          python3 scripts/ci/reparse_ratchet.py --measured-file reparse-bench.json
          python3 scripts/ci/suppression_baseline.py --tighten
          python3 scripts/ci/thresholds.py --check
          if [ -n "$(git status --porcelain .github/ci-thresholds.json)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo '### Recorded by this run'
              echo
              echo '```diff'
              git diff -- .github/ci-thresholds.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Python coverage ${measured}% and JavaScript coverage" \
              "${CLAUDIT_JS_MEASURED}% justify no raise."
          fi
      - name: Stage the ratchet data
        if: steps.ratchet.outputs.changed == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/ratchet-data"
          cp .github/ci-thresholds.json "$RUNNER_TEMP/ratchet-data/ci-thresholds.json"
          git rev-parse HEAD > "$RUNNER_TEMP/ratchet-data/base.txt"
      - name: Upload the ratchet data
        if: steps.ratchet.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: {"name": "ratchet-push", "path": "${{ runner.temp }}/ratchet-data", "if-no-files-found": "error", "retention-days": "1"}
  pytest-portable:
    # The suite minus every DB-touching test (tests/db_marker.py's mechanical split); a comment-only change skips the matrix, the canary still runs it.
    if: inputs.comment_only != 'true' && inputs.thresholds_only != 'true'
    name: pytest (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Full history lets each cell resolve the judged range for declared-removal exemptions; no step here pushes, so no token stays in .git/config.
        with: {fetch-depth: 0, persist-credentials: false}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Resolve the threshold base
        id: threshold_base
        uses: $/.github/actions/thresholds-base
        env:
          CLAUDIT_REPO: ${{ github.repository }}
          CLAUDIT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          CLAUDIT_EVENT: ${{ github.event_name }}
          CLAUDIT_BEFORE: ${{ github.event.before }}

      - name: Restore the pip cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/pip
            ~/Library/Caches/pip
            ~\AppData\Local\pip\Cache
          key: pip-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('backend/requirements.txt', 'requirements-test.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Install dependencies
        # One command: the default pwsh shell on windows-latest propagates only the last line's exit code.
        run: python -m pip install --upgrade pip -r backend/requirements.txt -r requirements-test.txt

      # Saved here, not in a post-job step, so the cache is written only from a master push.
      - name: Save the pip cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        with:
          path: |
            ~/.cache/pip
            ~/Library/Caches/pip
            ~\AppData\Local\pip\Cache
          key: pip-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('backend/requirements.txt', 'requirements-test.txt') }}

      - name: Run tests
        # A plain `python -m pytest`: the db-marked tests are the ones the portable cells cannot serve.
        run: python -m pytest tests/ -q --tb=short -ra -m "not db"
