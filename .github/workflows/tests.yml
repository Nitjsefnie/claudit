name: tests

on:
  push:
    branches: [master]
    # Deny-list rather than an allow-list: a new top-level code directory
    # would silently stop being tested under an allow-list, whereas an
    # unlisted path here just runs CI needlessly. Prose changes don't
    # need a Postgres container spun up.
    paths-ignore:
      - '**/*.md'
      - 'PRESENTATION.txt'
      - 'examples/**'
      - '.claude/**'
      - 'LICENSE'
      - 'NOTICE'
      - '.gitignore'
      - '.github/ci-thresholds.json'
  # One run per PR commit, on the merge ref GitHub actually lands — never
  # a second copy of the master push run for the same SHA. A fork's PR
  # runs with a read-only token against that merge ref, so untrusted code
  # never touches a secret.
  pull_request:
    branches: [master]
    paths-ignore:
      - '**/*.md'
      - 'PRESENTATION.txt'
      - 'examples/**'
      - '.claude/**'
      - 'LICENSE'
      - 'NOTICE'
      - '.gitignore'
  # Lets a branch without a PR get checked: dispatch the workflow on it
  # (`gh workflow run tests.yml --ref <branch>`) without opening a PR or
  # pushing to master.
  workflow_dispatch:

# Least privilege: every job here only reads the tree. Without an
# explicit block the job inherits the repository default, which can be
# read/write for the whole token.
permissions:
  contents: read

concurrency:
  # A fresh push to a pull request cancels its superseded run; master
  # pushes and scheduled/dispatch runs queue instead of cancelling each
  # other — a master run is never cancelled.
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    runs-on: ubuntu-latest

    permissions:
      # Only this job may write, and only to push the ratchet commit that
      # raises the coverage floor / tightens the size baseline on master
      # (see the "Ratchet the thresholds" step). The workflow-level block
      # above stays contents: read, so every other job remains read-only.
      contents: write

    services:
      postgres:
        # The suite does not use a single fixed database: fixtures create
        # and drop run-named ones (tests/scratch_db.py), so the role needs
        # CREATEDB — the stock `postgres` superuser has it.
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Fixtures build DSNs as `postgresql:///<db>` with no host, so libpq
      # resolves the connection from these. The same vars drive the
      # psql calls the fixtures shell out to.
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # One step in this workflow pushes (the master-only ratchet
          # commit), and its token is interpolated into the push URL from
          # a step-scoped env — never into .git/config. persist-
          # credentials: false is what keeps the checkout from leaving
          # the job token behind for any later step to reuse.
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install postgresql-client
        # Fixtures shell out to psql; the runner image has
        # a server but the client binaries must match the service major.
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16

      - name: Install dependencies
        # backend/requirements.txt already pins pytest, pytest-asyncio and
        # httpx; requirements-test.txt adds only the coverage toolchain, so
        # neither pin exists in two places.
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r requirements-test.txt

      - name: Wait for postgres
        run: |
          for _ in $(seq 1 30); do
            pg_isready -q && exit 0
            sleep 1
          done
          echo "postgres never became ready"; exit 1

      - name: Run tests
        id: pytest
        # No --cov-fail-under here: the gate is its own step below so that
        # "tests failed" and "coverage dropped" are distinguishable at a
        # glance, and so the summary still renders when the gate is red.
        run: python -m pytest tests/ -q --tb=short -ra --cov=backend --cov-report=term

      - name: Coverage summary
        # Renders whether or not the gate below passes — a coverage
        # regression is only actionable if you can see WHICH file lost
        # lines, and re-reading a scrolled CI log to find that is exactly
        # the friction that gets a gate disabled. The recorded ratchet
        # values are printed beside the report so a gap between this run's
        # measurement and the recorded floor is visible at a glance.
        if: ${{ !cancelled() && steps.pytest.conclusion != 'skipped' }}
        run: |
          recorded_measured="$(python3 scripts/ci/thresholds.py \
            --coverage-measured python)"
          floor="$(python3 scripts/ci/thresholds.py --coverage-floor python)"
          {
            echo '### Coverage'
            echo
            echo "Recorded ratchet (from .github/ci-thresholds.json):" \
              "measured ${recorded_measured}% / floor ${floor}%"
            echo
            python -m coverage report --format=markdown --precision=1
          } >> "$GITHUB_STEP_SUMMARY"
          python -m coverage xml -o coverage.xml

      - name: Upload coverage.xml
        if: ${{ !cancelled() && steps.pytest.conclusion != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

      - name: Coverage gate
        if: ${{ !cancelled() && steps.pytest.conclusion != 'skipped' }}
        # A RATCHET, not a target. The floor is committed data in
        # .github/ci-thresholds.json: seeded 1.5 points under the measured
        # coverage of the run that recorded it, so ordinary churn stays
        # green and a real regression goes red. On a push to master this
        # workflow raises the floor itself once coverage climbs more than
        # the hysteresis (1.5) above the recorded measured — the floor is
        # never lowered, not even by hand.
        run: |
          floor="$(python3 scripts/ci/thresholds.py --coverage-floor python)"
          python -m coverage report "--fail-under=${floor}" --precision=1

      - name: Module size baseline
        # Growth is fixed by moving code into a new module, never by
        # raising the recorded ceiling: this step fails on any file that
        # outgrew its baseline entry or crossed its ceiling (production
        # 500 / test 700). Runs on every event so pull requests are
        # gated too; master additionally tightens entries below.
        if: ${{ !cancelled() && steps.pytest.conclusion != 'skipped' }}
        run: python3 scripts/ci/size_baseline.py

      - name: Ratchet the thresholds
        # Only measurements from a master push may move the recorded
        # calibration — a pull request runs untrusted code and must not
        # be able to write it. The ratchet raises the coverage floor when
        # this run justifies it, and --tighten follows shrunk files down;
        # growth is never written here, the step above stays its gate.
        id: ratchet
        if: ${{ !cancelled() && steps.pytest.outcome == 'success'
                && github.event_name == 'push'
                && github.ref == 'refs/heads/master' }}
        run: |
          measured="$(python -m coverage report --format=total --precision=1)"
          python3 scripts/ci/ratchet.py --measured "${measured}"
          python3 scripts/ci/size_baseline.py --tighten
          python3 scripts/ci/thresholds.py --check
          if [ -n "$(git status --porcelain .github/ci-thresholds.json)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo '### Recorded by this run'
              echo
              echo '```diff'
              git diff -- .github/ci-thresholds.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Coverage ${measured}% and unchanged module sizes" \
              "justify no raise."
          fi

      - name: Commit the ratchet
        # Runs only when the step above changed the data file. The
        # workflow-level token stays out of .git/config (checkout uses
        # persist-credentials: false), so the push URL below is the only
        # place the token appears, scoped to this one step via env.
        # Only the data file is committed, and a push to it never
        # re-triggers workflows: every gate's push trigger ignores the
        # path (GITHUB_TOKEN pushes start no workflows either).
        if: ${{ !cancelled() && steps.ratchet.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/ci-thresholds.json
          git commit -m 'Ratchet ci-thresholds: raise coverage floor / tighten size baseline (automated)' \
            -m 'Co-Authored-By: GLM-5.3-Flash <noreply@z.ai>'
          if git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}" \
            HEAD:master; then
            exit 0
          fi
          # A rejected push usually means master moved while this run was
          # going; failing the job for that would turn `tests` red for an
          # ordinary concurrent push. Distinguish it: if the remote still
          # points at this commit's parent, the race explanation is wrong
          # and the push failed for a real reason.
          git fetch --quiet \
            "https://x-access-token:${GH_TOKEN}@github.com/${REPO}" master
          if [ "$(git rev-parse HEAD^)" = "$(git rev-parse FETCH_HEAD)" ]; then
            echo "the ratchet push was rejected while master stood still" >&2
            exit 1
          fi
          echo 'Master moved while this run measured; the next push raises instead.' \
            >> "$GITHUB_STEP_SUMMARY"

  pytest-portable:
    # The same suite minus every test that touches PostgreSQL, run where
    # no Postgres service exists: the marker is derived mechanically from
    # how a test gets its database (tests/db_marker.py — a fixture in
    # DB_FIXTURES, or an explicit @pytest.mark.db for the direct-server
    # tests), so the split cannot drift from the code by hand. The full
    # suite, the coverage ratchet and the DB tests stay in the `pytest`
    # job above; this job adds the platforms and Pythons that job cannot
    # cover.
    name: pytest (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        # backend/requirements.txt already pins pytest, pytest-asyncio and
        # httpx; requirements-test.txt adds only the coverage toolchain, so
        # neither pin exists in two places. One command, not a multi-line
        # block: the default pwsh shell on windows-latest propagates only
        # the last line's exit code, and pip's wheels cover all three
        # OSes (psycopg installs with the `binary` extra).
        run: python -m pip install --upgrade pip -r backend/requirements.txt -r requirements-test.txt

      - name: Run tests
        # Identical on all three OSes — a plain `python -m pytest`. The
        # db-marked tests are the ones the portable cells cannot serve;
        # the Linux job above runs them with the full suite.
        run: python -m pytest tests/ -q --tb=short -ra -m "not db"
