name: codeql

# Static security analysis (advanced setup, not the repo-settings "default
# setup" — the config lives here so it is reviewable in a diff like every
# other gate). Free on this public repository; findings land in the
# Security tab rather than turning the build red, so a new query shipping
# upstream cannot block an unrelated push.
#
# TRIGGERS MATCH THE OTHER GATES. The commit-side triggers are hosted by
# ci-gate.yml now, which calls this workflow as a leg on every push and
# pull request; under that call the default checkout is the caller's
# event commit — the branch tip on a master push, the merge ref on a
# pull request — the same tree the direct triggers checked out, so
# alerts land on exactly the tree that was analysed. (That checkout
# identity is also why this workflow runs as a leg rather than keeping
# its own pull_request trigger: two surfaces checking one tree invite
# them drifting apart.)
#
# The weekly cron is not redundant with push: CodeQL's query packs are
# updated continuously, and a new query only ever runs against code that
# has changed since it shipped. Without the cron, a rule published today
# would never be applied to a file last touched last year.

on:
  # Trigger ownership moved to ci-gate.yml (issue #127): push and
  # pull_request fire ci-gate, which calls this workflow as a leg.
  # workflow_call is the leg's entry; the weekly cron and
  # workflow_dispatch stay here, where a run answers a question no
  # commit asked.
  workflow_call:
  schedule:
    # Wednesday 03:47 UTC. Off the hour and off Monday deliberately: the
    # top of the hour is when every cron on GitHub fires at once and jobs
    # queue for a long time.
    - cron: '47 3 * * 3'
  workflow_dispatch:

concurrency:
  # Push and pull_request runs of this workflow arrive as ci-gate legs
  # and join this group under the caller's event, alongside the weekly
  # cron (grouped on refs/heads/master, never cancelled) and any
  # standalone dispatch on the same ref. ci-gate's own group owns
  # supersession for the aggregate.
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest

    permissions:
      # Writing the analysis results is the whole point; everything else
      # stays read-only.
      security-events: write
      actions: read
      contents: read

    strategy:
      # One language failing should not hide the other language's results.
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No `ref:` here: CodeQL must analyse exactly the commit it will
          # file alerts against, which is the event's own SHA — the branch
          # tip on push, the merge ref on pull_request.
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # `security-extended` over the default `security` pack: this app
          # handles auth, cookies, SQL and a path-traversal-sensitive R2
          # file mode, and the extra precision-medium queries are exactly
          # the ones that cover those.
          queries: security-extended
          config: |
            paths-ignore:
              - fixtures
              - node_modules

      - name: Analyze
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: /language:${{ matrix.language }}
