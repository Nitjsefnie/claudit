name: speed

# Did THIS CHANGE make the test suite do more work?
#
# THE GATE IS A COMMITTED INSTRUCTION-COUNT RATCHET (issue #452). The
# old gate compared runner WALL-CLOCK durations between two checkouts,
# A/B/A/B against a pinned baseline release; a runner's speed varies by
# roughly a factor of two between jobs, so the ratio measured the
# runners as much as the code. It is replaced by an A-ONLY bench
# (scripts/ci/suite_bench.py): one pytest pass over a pinned fixture
# (scripts/ci/suite_bench_files.txt), with sys.monitoring's INSTRUCTION
# events counting every bytecode the interpreter retires, partitioned
# into collection / run / residual. A count is exact -- the same tree
# retires the same count on a loaded machine and an idle one, and the
# bench re-execs with PYTHONHASHSEED=0 so it is identical across runs
# by construction. The committed suite_cost budgets in
# .github/ci-thresholds.json ARE the baseline: no baseline-release
# checkout, no merge-base computation, no dual checkout, no dual venv,
# no interleaved rounds, no comparator, no JUnit. Wall time is
# telemetry at most, and the only time reading the bench takes is
# time.process_time() -- never a gating input.
#
# The budgets are ratchet data: a phase's ceiling sits exactly 1.5
# (million instructions) above its recorded measured value, and only
# the tighten bot on a master push may move them, downward only. The
# gate here (--check) fails a phase over its ceiling; the remedy is to
# make the suite cheaper, or the doctrine's re-seed path when the
# fixture list or the interpreter pin legitimately changed.
#
# THE PYTHON MICRO IS PINNED to the exact version the seed was measured
# with. A count is exact for one interpreter; a runner-side drift to a
# newer 3.13.x would move the counts out from under the committed
# ceilings -- the same reason the JavaScript coverage gate pins the
# exact node (issue #266).
#
# A FORK'S CODE RUNS HERE. The bench executes the checked-out tree, so
# this is still the one gate that deliberately EXECUTES pull-request
# code; the dual environment is its admission gate: an in-repo branch
# gets `speed-benchmark`, which carries no protection rules and starts
# without ceremony, while a fork's pull request gets
# `fork-speed-benchmark`, which requires a reviewer's approval before
# the job starts.

on:
  # Trigger ownership moved to ci-gate.yml (issue #127): push and
  # pull_request fire ci-gate, which calls this workflow as a leg.
  # workflow_call is the leg's entry; workflow_dispatch keeps a direct
  # run possible.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One run per pull request, or per pushed commit SHA on a push
  # (issue #409): on a per-ref push group GitHub keeps at most one
  # PENDING run, so a third concurrent master push cancelled a
  # merely-queued leg and that commit's aggregate folded red. PR runs
  # keep the per-number group and cancel; the caller's event context
  # is what the expression reads, so a ci-gate push leg keys on its
  # own commit.
  group: speed-${{ github.event.pull_request.number
    || (github.event_name == 'push' && github.sha) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  speed:
    runs-on: ubuntu-latest
    # One measured pass took ~115 s on the seeding box; the bound
    # exists so a hung run fails loud, with a wide margin over the
    # measurement (an unmeasured bound is a future false alarm).
    timeout-minutes: 15

    # The dual-environment fork gate. Both names must exist as
    # environments: `speed-benchmark` with no protection rules,
    # `fork-speed-benchmark` requiring a review before the job starts.
    environment: >-
      ${{ github.event.pull_request.head.repo.fork
      && 'fork-speed-benchmark' || 'speed-benchmark' }}

    services:
      postgres:
        # The bench fixture runs the scratch-DB machinery, so the
        # service is load-bearing. Pinned by digest, the same image the
        # tests leg measures against.
        image: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        # The exact micro the committed seed was measured with: a count
        # is exact for one interpreter, and a runner-side drift would
        # move the counts out from under the committed ceilings.
        with:
          python-version: "3.13.14"

      # The pip cache restores on every event but is saved only from a
      # push of master: `cache: pip` saves in a post-job step that runs
      # after the pull-request checkout, so untrusted code would write
      # the cross-run cache a trusted run later installs from (issue
      # #126). The key hashes the SINGLE tree's requirement files --
      # the A/B design's base+head pair is gone with the dual checkout.
      - name: Restore the pip cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/pip
            ~/Library/Caches/pip
            ~\AppData\Local\pip\Cache
          key: pip-${{ runner.os }}-3.13-${{ hashFiles('backend/requirements.txt', 'requirements-test.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-3.13-

      - name: Install postgresql-client
        # The scratch-DB layer shells out to psql; the client must
        # match the service's major version.
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16

      - name: Install dependencies
        # backend/requirements.txt already pins pytest, pytest-asyncio
        # and httpx2; requirements-test.txt adds only the coverage
        # toolchain, so neither pin exists in two places.
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r requirements-test.txt

      # Saved here, not in a post-job step: the install above populated
      # the cache, and the gate keeps every event but a push of master
      # from writing cross-run state (issue #126).
      - name: Save the pip cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: >-
          github.event_name == 'push'
          && github.ref == 'refs/heads/master'
        with:
          path: |
            ~/.cache/pip
            ~/Library/Caches/pip
            ~\AppData\Local\pip\Cache
          key: pip-${{ runner.os }}-3.13-${{ hashFiles('backend/requirements.txt', 'requirements-test.txt') }}

      - name: Wait for postgres
        run: |
          for _ in $(seq 1 30); do
            pg_isready -q && exit 0
            sleep 1
          done
          echo "postgres never became ready"; exit 1

      - name: Measure and gate the suite cost
        # One pass, no warm-up, no statistics: instruction counts are
        # exact. The shared composite action measures into RUNNER_TEMP,
        # prints the phase table into the step summary, and gates every
        # phase against the committed ceilings -- a phase over budget
        # fails this job.
        uses: ./.github/actions/suite-bench
        with:
          mode: gate
          measurement: ${{ runner.temp }}/suite-measurement.json

      - name: Upload the suite measurement
        if: ${{ !cancelled() }}
        # Telemetry only: the gate above reads the same file this
        # uploads, so a red gate's numbers are always inspectable.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: suite-measurement
          path: ${{ runner.temp }}/suite-measurement.json
          if-no-files-found: error
