name: actionlint

# The gate on the gates. Everything else in .github/workflows is unreviewed
# code that runs with a repository token, and a mistake in it fails in ways
# the other gates structurally cannot catch: a workflow with a typo in an
# `if:` expression does not go red, it silently stops running.
#
# Two tools, because they answer different questions:
#
#   actionlint — is this workflow WELL-FORMED? Schema, expression syntax,
#   context availability (`github.event.review` on a push event),
#   `runs-on` labels, and shellcheck over every `run:` block, which is where
#   most real bugs live. It found `for i in $(seq 1 30)` with an unused `i`
#   in tests.yml on its first run here.
#
#   zizmor — is this workflow SAFE? Script injection through `${{ }}` in a
#   `run:` block, over-broad `permissions:`, credential persistence after
#   checkout, unpinned action references. Its first run flagged 39 findings,
#   14 of them high: every action was tag-pinned rather than hash-pinned,
#   every checkout left the job token in .git/config, and no workflow
#   declared permissions at all.
#
# Both tools are pinned. actionlint is verified by checksum rather than
# trusted from the release page, because a linter that runs before every
# other gate is a supply-chain position worth defending.
#
# Suppressions belong at the offending line as a `# zizmor: ignore[rule]`
# comment WITH a justification (see eslint.yml), never as a raised
# --min-severity here: a threshold silences the next finding too, and the
# next one is the one nobody has thought about yet.

on:
  push:
    branches: [master]
    paths:
      # An allow-list, and the one place in this repo where that is right:
      # this workflow lints workflow files, so a change anywhere else
      # genuinely cannot affect its result.
      - '.github/workflows/**'
      - '.github/dependabot.yml'
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/**'
      - '.github/dependabot.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actionlint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  actionlint:
    runs-on: ubuntu-latest

    env:
      ACTIONLINT_VERSION: 1.7.12
      # sha256 of actionlint_1.7.12_linux_amd64.tar.gz, from the release's
      # own checksums file. Bump both together.
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # The pip cache restores on every event but is saved only from a push
      # of master: `cache: pip` saves in a post-job step that runs after the
      # pull-request checkout, so untrusted code would write the cross-run
      # cache a trusted run later installs from (issue #126). This job has
      # no requirements file — zizmor is pinned inline below — so the key
      # hashes this workflow, and a pin bump starts a fresh cache entry.
      - name: Restore the pip cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/pip
            ~/Library/Caches/pip
            ~\AppData\Local\pip\Cache
          key: pip-${{ runner.os }}-3.13-${{ hashFiles('.github/workflows/actionlint.yml') }}
          restore-keys: |
            pip-${{ runner.os }}-3.13-

      - name: Install actionlint
        # Downloaded and checksum-verified rather than piped from the
        # install script: `curl | bash` would make this job trust whatever
        # that URL serves at run time.
        run: |
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" actionlint
          ./actionlint --version

      - name: Install zizmor
        id: install_zizmor
        run: |
          python -m pip install --upgrade pip
          pip install zizmor==1.29.0

      # Saved here, not in a post-job step: the install above populated the
      # cache, and the gate keeps every event but a push of master from
      # writing cross-run state (issue #126).
      - name: Save the pip cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        with:
          path: |
            ~/.cache/pip
            ~/Library/Caches/pip
            ~\AppData\Local\pip\Cache
          key: pip-${{ runner.os }}-3.13-${{ hashFiles('.github/workflows/actionlint.yml') }}

      - name: actionlint
        id: actionlint
        run: ./actionlint -color .github/workflows/*.yml

      - name: zizmor
        # Runs even when actionlint is red, so one push reports both gates —
        # the same pattern lint.yml uses for pylint/pycodestyle. Not when
        # the install itself failed, which would report a tool bug as a
        # clean audit.
        if: ${{ !cancelled() && steps.install_zizmor.outcome == 'success' }}
        env:
          # Enables the online audits (resolving action refs, checking for
          # known-vulnerable action versions). Read-only, and this workflow
          # declares contents: read.
          GH_TOKEN: ${{ github.token }}
        run: zizmor --no-progress .github/workflows/
