name: actionlint

# The gate on the gates: workflow code runs with a repository token, and
# an `if:` typo can silently stop a gate instead of failing it.
#
# Two tools answer different questions:
#
#   actionlint — well-formed? Schema, expressions, context availability,
#   `runs-on` labels and shellcheck over every `run:` block.
#
#   zizmor — safe? `${{ }}` script injection, broad permissions,
#   checkout credential persistence and unpinned actions.
#
# Both are pinned: actionlint by download checksum, zizmor through
# requirements-zizmor.txt with --require-hashes. Dependabot watches that
# manifest; inline run-block pins are invisible to it. The actionlint fork
# supports `queue:` and `$/`. Its checksum protects
# against tampered downloads, not a compromised publisher: the same account
# publishes both. Stock upstream has an independent publisher but lacks
# these syntax extensions.
#
# Suppress at the offending line with a justified `# zizmor: ignore[rule]`
# (see eslint.yml); raising --min-severity also hides future findings.

on:
  # ci-gate.yml owns push and pull_request triggers. Every non-docs run
  # lints workflows; a workflow change is never docs-only.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The house shape, shared by audit, codeql, eslint, lint, panel-layout,
  # smoke, tests and types: key pull-request runs by PR number so a newer
  # run cancels its superseded run within that PR's group. A master push
  # uses its ref and cannot cancel a pull request's run.
  group: actionlint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # The fork supports the `concurrency` `queue:` key and `$/` self-repository
      # `uses:` syntax. Stock actionlint rejects both; an inline ignore cannot
      # silence those schema errors. A patched build preserves unrelated checks,
      # unlike filtering findings with `-ignore`. Returning to stock requires
      # removing `queue:` and reverting `$/` refs to `./`.
      # queue.2 rather than the fleet's queue.1: queue.1 predates the `$/`
      # parser support these workflows need. Downgrading would break the gate.
      CLAUDIT_ACTIONLINT_REPO: Nitjsefnie-OSC/actionlint
      CLAUDIT_ACTIONLINT_VERSION: 1.7.12-queue.2
      # sha256 of actionlint_1.7.12-queue.2_linux_amd64.tar.gz, from the
      # release's own checksums file. Bump all three together.
      CLAUDIT_ACTIONLINT_SHA256: 2895b2f0f5b4cff420a4a577d609f83d0d3bef256aeef480961e53be01a5a954

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # The pip cache restores on every event but is saved only from a push
      # of master: `cache: pip` saves in a post-job step that runs after the
      # pull-request checkout, so untrusted code would write the cross-run
      # cache a trusted run later installs from. This job's
      # only manifest is requirements-zizmor.txt, so the key hashes that
      # file, and a pin bump starts a fresh cache entry.
      - name: Restore the pip cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/pip
            ~/Library/Caches/pip
            ~\AppData\Local\pip\Cache
          key: pip-${{ runner.os }}-3.13-${{ hashFiles('requirements-zizmor.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-3.13-

      - name: Install actionlint
        # Downloaded and checksum-verified rather than piped from the
        # install script: `curl | bash` would make this job trust whatever
        # that URL serves at run time.
        run: |
          tarball="actionlint_${CLAUDIT_ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$tarball" \
            "https://github.com/${CLAUDIT_ACTIONLINT_REPO}/releases/download/v${CLAUDIT_ACTIONLINT_VERSION}/${tarball}"
          echo "${CLAUDIT_ACTIONLINT_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" actionlint
          ./actionlint --version

      - name: Install zizmor
        id: install_zizmor
        # --require-hashes verifies every artifact against the manifest's
        # sha256: a version pin alone still installs whatever artifact the
        # index serves for that version. There is deliberately NO
        # `--upgrade pip` here: it would install whatever bytes the index
        # serves, unpinned — an unaudited component ahead of a gate that
        # audits supply-chain integrity. The runner's preinstalled pip is
        # far newer than --require-hashes needs.
        run: python -m pip install --require-hashes -r requirements-zizmor.txt

      # Saved here, not in a post-job step: the install above populated the
      # cache, and the gate keeps every event but a push of master from
      # writing cross-run state.
      - name: Save the pip cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        with:
          path: |
            ~/.cache/pip
            ~/Library/Caches/pip
            ~\AppData\Local\pip\Cache
          key: pip-${{ runner.os }}-3.13-${{ hashFiles('requirements-zizmor.txt') }}

      - name: actionlint
        id: actionlint
        run: ./actionlint -color .github/workflows/*.yml

      - name: zizmor
        # Runs even when actionlint is red, so one push reports both gates —
        # the same pattern lint.yml uses for pylint/pycodestyle. Not when
        # the install itself failed, which would report a tool bug as a
        # clean audit.
        if: ${{ !cancelled() && steps.install_zizmor.outcome == 'success' }}
        env:
          # Enables the online audits (resolving action refs, checking for
          # known-vulnerable action versions). Read-only, and this workflow
          # declares contents: read.
          GH_TOKEN: ${{ github.token }}
        run: zizmor --no-progress .
