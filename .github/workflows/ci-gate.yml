name: ci gate

# One aggregate gate over every check this repository runs on a push or
# pull request.
#
# WHY ONE WORKFLOW. Eleven independent check names could not be
# required: a ruleset requires one context per name, and the gate
# workflows narrowed by paths-ignore, so a documentation-only change
# started no run at all — those check names went MISSING rather than
# reporting, and a ruleset requiring them could never go green on such
# a change. This workflow starts on every push and pull request
# (one trigger-level ignore: the ratchet bot's data file, below),
# classifies the changed paths, and either runs every gate leg or
# narrows: a docs-only run skips every leg, a bot-data-only run
# (src/pricing.json alone — the refresh job already ran the full suite
# against the new rates before pushing) runs only the cheap legs lint
# and smoke, and the aggregate still reports either way. The classifier
# and its over-run fallbacks live in scripts/ci/classify_changes.py.
#
# SUPERSESSION AND CANCELLATION. The concurrency group is one per pull
# request, or per commit SHA on a push (issue #358): a newer push starts
# its own run instead of cancelling the older one, so the ordinary
# two-push supersession cancel cannot leave a stale aggregate behind —
# before this, a bot push (the hourly pricing refresh, a dependabot
# merge) landing while a master run was in flight cancelled it whole,
# yet the aggregate's `if: always()` still ran it, folded the cancelled
# legs, and recorded a red aggregate on the superseded commit, which
# release.yml's waiter then refuses — a VERSION commit raced by a bot
# push could not release. The legs keep their own groups, and the long
# one — test-data (speed's bench is minutes since #452) — is per-SHA on
# a push too (issues #366, #409): each commit carries its own run, so
# no push cancels or pending-supersedes another's. The remaining legs keep
# per-ref groups (the caller's ref), where concurrent master runs
# queue — which is what serializes the tests leg's ratchet push — and
# GitHub keeps at most one PENDING run per group, so a third concurrent
# master push can still cancel a merely-queued short leg, and that
# middle run's aggregate folds red. The window is each leg's own
# duration (minutes for every leg that remains per-ref), it fails
# closed, and the next push re-verifies it (below). With the group itself no longer cancelling on a push, a
# run-level cancel is always DELIBERATE: it leaves that run's aggregate
# cancelled — folded as a failure by aggregate_gate.py, so a
# required-check ruleset reads it never-green — and the next push's
# classifier re-verifies whatever any cancelled run left unverified, by
# walking back to the newest master commit whose gate legs actually
# executed (scripts/ci/classify_changes.py). A cancelled run's CODE is
# therefore not forgotten either way.
#
# TRIGGER OWNERSHIP. The ten gate workflows below are called as
# reusable workflows; they keep `workflow_call`, their crons (audit
# daily, codeql weekly) and `workflow_dispatch`, and they carry no
# `push` or `pull_request` trigger any more — this file owns that
# surface. Each callee keeps its own `permissions:` blocks and its
# concurrency group (the latter governs its standalone dispatch runs).
# release.yml, refresh-pricing.yml, secrets.yml, version-guard.yml,
# pr-gate.yml and claim.yml are untouched and outside the aggregate.
#
# A FORK'S CODE RUNS IN THE LEGS, exactly as before the move: the legs
# run on the merge ref with the caller's permissions, and the callee
# that executes pull-request code (speed) keeps its dual-environment
# fork admission from speed.yml itself.

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    paths-ignore:
      # The ratchet bot's master commit touches only this data file and
      # must not start the suite — the guarantee the gate workflows'
      # own push triggers used to carry (PR #170), hosted here now.
      - '.github/ci-thresholds.json'
  workflow_dispatch:

# Read-only at workflow level. Tests needs pull-requests: write for its
# informational PR comment; its ratchet push is the callee's ratchet-push
# job, which takes the deploy key from the master-push environment, not
# from a forwarded secret. CodeQL needs security-events: write for SARIF
# upload. Deploy-key pushes start workflows, unlike GITHUB_TOKEN pushes:
# the hourly pricing commit intentionally gets an aggregate verdict on
# master's tip, while the ratchet commit stays silent because this trigger
# ignores its file.
permissions:
  contents: read

concurrency:
  # One run per pull request or per pushed commit SHA. See the
  # SUPERSESSION AND CANCELLATION block above.
  group: ci-gate-${{ github.event.pull_request.number
    || (github.event_name == 'push' && github.sha) || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # contents: read pays for the checkout; pull-requests: read is
      # what the pulls/<n>/files read needs on a pull-request event;
      # actions: read is what the workflow-runs and run-jobs reads need
      # on a push, where the classifier walks back to the newest master
      # commit whose gate legs executed (issue #208).
      contents: read
      pull-requests: read
      actions: read
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      data_only: ${{ steps.classify.outputs.data_only }}
      reason: ${{ steps.classify.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this workflow pushes except the tests leg's
          # ratchet (inside its callee), and no token left in
          # .git/config is reusable by later steps.
          persist-credentials: false

      - name: Classify the changed paths
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BEFORE_SHA: ${{ github.event.before }}
        # Emits docs_only / data_only =true|false plus a reason; every
        # read failure over-runs to a full gate set
        # (scripts/ci/classify_changes.py).
        run: python3 scripts/ci/classify_changes.py

  # One leg per gate workflow. `skipped` is reserved for the
  # classification narrowing (docs-only skips every leg; data-only
  # skips every leg but lint and smoke): any leg skipped without it
  # fails the aggregate, as does a cancelled or failed leg, a leg
  # missing from the needs document, or a classifier crash (whose empty
  # output reads as not-docs and leaves every leg skipped —
  # fail-closed, visibly red).

  tests:
    needs: classify
    if: needs.classify.outputs.docs_only != 'true' && needs.classify.outputs.data_only != 'true'
    uses: ./.github/workflows/tests.yml
    permissions:
      # The callee's pytest job reads contents and posts the informational
      # patch-coverage comment on a pull request (issue #129). The callee's
      # ratchet-push job takes the deploy key from the master-push
      # environment directly, so no secret is forwarded here. The caller
      # grants only the scopes needed to read contents and post that comment.
      contents: read
      pull-requests: write

  test-data:
    # The perturbed-data leg (issue #199): the full suite against a tree
    # whose rate rows and version constants a refresh-style perturbation
    # has moved — SV-TEST-DATA's second enforcement half. The verdict is
    # the perturbed suite's pass/fail; no coverage, no ratchet.
    needs: classify
    if: needs.classify.outputs.docs_only != 'true' && needs.classify.outputs.data_only != 'true'
    uses: ./.github/workflows/test-data.yml

  lint:
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    uses: ./.github/workflows/lint.yml

  types:
    needs: classify
    if: needs.classify.outputs.docs_only != 'true' && needs.classify.outputs.data_only != 'true'
    uses: ./.github/workflows/types.yml

  eslint:
    needs: classify
    if: needs.classify.outputs.docs_only != 'true' && needs.classify.outputs.data_only != 'true'
    uses: ./.github/workflows/eslint.yml

  smoke:
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    uses: ./.github/workflows/smoke.yml

  audit:
    needs: classify
    if: needs.classify.outputs.docs_only != 'true' && needs.classify.outputs.data_only != 'true'
    uses: ./.github/workflows/audit.yml

  actionlint:
    needs: classify
    if: needs.classify.outputs.docs_only != 'true' && needs.classify.outputs.data_only != 'true'
    uses: ./.github/workflows/actionlint.yml

  speed:
    needs: classify
    if: needs.classify.outputs.docs_only != 'true' && needs.classify.outputs.data_only != 'true'
    uses: ./.github/workflows/speed.yml

  codeql:
    needs: classify
    if: needs.classify.outputs.docs_only != 'true' && needs.classify.outputs.data_only != 'true'
    uses: ./.github/workflows/codeql.yml
    permissions:
      # Writing the analysis is the whole point of the callee; the rest
      # stays read-only, as codeql.yml itself declares per job.
      security-events: write
      actions: read
      contents: read

  aggregate:
    needs: [classify, tests, test-data, lint, types, eslint, smoke, audit,
            actionlint, speed, codeql]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fold the leg results into one verdict
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        # scripts/ci/aggregate_gate.py owns the verdict: success passes,
        # a skip passes only when the classification narrowed it, and
        # any other result fails — with the legs that decided named in
        # the verdict and in the step summary the script writes.
        run: python3 scripts/ci/aggregate_gate.py
