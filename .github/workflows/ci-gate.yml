name: ci gate

# WHY ONE WORKFLOW. Eleven independent check names could not be
# required: a ruleset requires one context per name, and the gate
# workflows narrowed by paths-ignore, so a documentation-only change
# started no run at all — those check names went MISSING rather than
# reporting, and a ruleset requiring them could never go green on such
# a change. This workflow starts on every push and pull request
# (trigger-level ignores for all three ratchet data files, below),
# classifies the changed paths, and either runs every gate leg or
# narrows: a docs-only run skips every leg; a setup-only run executes
# only setup-docs, with the guard covered by tests on full runs. A bot-data-only run
# (src/pricing.json alone — the refresh job already ran the full suite
# against the new rates before pushing) runs only the cheap legs lint
# and smoke, and a comment-only run (every changed source file's
# comment-stripped token stream identical at base and head) skips the
# legs a comment cannot affect — test-data, panel-layout and codeql —
# plus the portable pytest matrix inside tests.yml, passed down as the
# `comment_only` input. The aggregate still reports either way. The
# classifier and its over-run fallbacks live in
# scripts/ci/classify_changes.py.
#
# SUPERSESSION AND CANCELLATION. The concurrency group is one per pull
# request, or per commit SHA on a push: cancelling an older push can
# leave a red aggregate that release.yml must refuse.
# The legs keep their own groups, and the long
# one — test-data — is per-SHA on a push: each
# commit carries its own run, so no push cancels or pending-supersedes
# another's. The remaining legs keep
# per-ref groups (the caller's ref), where concurrent master runs
# queue — and
# GitHub keeps at most one PENDING run per group, so a third concurrent
# master push can still cancel a merely-queued short leg, and that
# middle run's aggregate folds red. The window is each leg's own
# duration (minutes for every leg that remains per-ref), it fails
# closed, and the next push re-verifies it (below). With the group itself no longer cancelling on a push, a
# run-level cancel is always DELIBERATE: it leaves that run's aggregate
# cancelled — folded as a failure by aggregate_gate.py, so a
# required-check ruleset reads it never-green — and the next push's
# classifier re-verifies whatever any cancelled run left unverified, by
# walking back to the newest master commit whose gate legs actually
# executed (scripts/ci/classify_changes.py). A cancelled run's CODE is
# therefore not forgotten either way.
#
# TRIGGER OWNERSHIP. The eleven gate workflows below are called as
# reusable workflows; they keep `workflow_call`, their crons (audit
# daily, codeql weekly) and `workflow_dispatch`, and they carry no
# `push` or `pull_request` trigger — this file owns that
# surface. Each callee keeps its own `permissions:` blocks and its
# concurrency group (the latter governs its standalone dispatch runs).
# release.yml, refresh-pricing.yml, secrets.yml, version-guard.yml,
# pr-gate.yml and claim.yml are untouched and outside the aggregate.
#
# A FORK'S CODE RUNS IN THE LEGS: the legs
# run on the merge ref with the caller's permissions. The suite-cost
# bench lives in the tests canary and, like the suite
# itself, executes pull-request code on the pull_request trust model —
# no secrets, read-only token.

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    paths-ignore:
      # The ratchet bot's data-only master commit must not restart the suite.
      - '.github/ci-thresholds.json'
      - '.github/comment-share.json'
      - '.github/size-baseline.json'
  workflow_dispatch:

# Read-only except where a leg says otherwise. Tests execute the proposed
# tree and must hold no write token. The top-level ratchet-push.yml owns
# pushing: an environment secret is unavailable to a workflow_call callee,
# and GITHUB_TOKEN cannot bypass the required aggregate check.
permissions:
  contents: read

concurrency:
  group: ci-gate-${{ github.event.pull_request.number
    || (github.event_name == 'push' && github.sha) || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # contents: read pays for the checkout; pull-requests: read is
      # what the pulls/<n>/files read needs on a pull-request event;
      # actions: read is what the workflow-runs and run-jobs reads need
      # on a push, where the classifier walks back to the newest master
      # commit whose gate legs executed.
      contents: read
      pull-requests: read
      actions: read
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      data_only: ${{ steps.classify.outputs.data_only }}
      comment_only: ${{ steps.classify.outputs.comment_only }}
      thresholds_only: ${{ steps.classify.outputs.thresholds_only }}
      setup_only: ${{ steps.classify.outputs.setup_only }}
      reason: ${{ steps.classify.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this workflow pushes except the tests leg's
          # ratchet (inside its callee), and no token left in
          # .git/config is reusable by later steps.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The tokenizer's node matches the repo's stated pin (tests.yml
          # and eslint.yml carry the same version), so espree parses under
          # the node the JS gates were measured with.
          node-version: "24.17.0"

      - name: Install the JS tokenizer
        # The comment-only class strips JS/JSX comments with espree. It
        # installs into an isolated prefix at the LOCKFILE's espree
        # version — no repo node_modules, no lockfile churn (--no-save).
        # zizmor: ignore[adhoc-packages] espree is pinned to the lockfile's version read below, into an isolated prefix, never the repo's node_modules
        run: |
          v="$(node -p "require('./package-lock.json').packages['node_modules/espree'].version")"
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/espree" "espree@$v"

      - name: Classify the changed paths
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          CLAUDIT_PR_NUMBER: ${{ github.event.pull_request.number }}
          CLAUDIT_BEFORE_SHA: ${{ github.event.before }}
          CLAUDIT_ESPREE_DIR: ${{ runner.temp }}/espree/node_modules
        # Emits each class as true|false plus a reason; every read failure over-runs to a full gate set
        # (scripts/ci/classify_changes.py).
        run: python3 scripts/ci/classify_changes.py

  # One leg per gate workflow. `skipped` is reserved for the
  # classification narrowing (docs-only skips every leg; data-only
  # skips every leg but lint and smoke): any leg skipped without it
  # fails the aggregate, as does a cancelled or failed leg, a leg
  # missing from the needs document, or a classifier crash (whose empty
  # output reads as not-docs and leaves every leg skipped —
  # fail-closed, visibly red).
  # setup-docs runs only for setup_only; every other class skips it.

  tests:
    needs: classify
    if: needs.classify.outputs.docs_only != 'true' && needs.classify.outputs.data_only != 'true' && needs.classify.outputs.setup_only != 'true'
    uses: $/.github/workflows/tests.yml
    with:
      # The comment-only class narrows the portable matrix inside the
      # callee; the canary itself still runs.
      comment_only: ${{ needs.classify.outputs.comment_only }}
      thresholds_only: ${{ needs.classify.outputs.thresholds_only }}
    permissions:
      # The caller's grant CAPS what the callee can use, so this is
      # read-only: contents: read for the suite, which checks out and
      # RUNS the proposed tree. The informational
      # patch-coverage comment no longer needs a token from inside the
      # leg — the leg uploads the rendered body and the top-level
      # coverage-comment.yml posts it. The callee pushes
      # nothing — the ratchet data is published by the top-level
      # ratchet-push.yml workflow; no secret is forwarded.
      contents: read

  test-data:
    # The perturbed-data leg: the full suite against a tree
    # whose rate rows and version constants a refresh-style perturbation
    # has moved — SV-TEST-DATA's second enforcement half. The verdict is
    # the perturbed suite's pass/fail; no coverage, no ratchet.
    needs: classify
    if: needs.classify.outputs.docs_only != 'true' && needs.classify.outputs.data_only != 'true' && needs.classify.outputs.comment_only != 'true' && needs.classify.outputs.thresholds_only != 'true' && needs.classify.outputs.setup_only != 'true'
    uses: $/.github/workflows/test-data.yml

  lint:
    needs: classify
    if: needs.classify.outputs.docs_only != 'true' && needs.classify.outputs.thresholds_only != 'true' && needs.classify.outputs.setup_only != 'true'
    uses: $/.github/workflows/lint.yml

  types:
    needs: classify
    if: needs.classify.outputs.docs_only != 'true' && needs.classify.outputs.data_only != 'true' && needs.classify.outputs.thresholds_only != 'true' && needs.classify.outputs.setup_only != 'true'
    uses: $/.github/workflows/types.yml

  eslint:
    needs: classify
    if: needs.classify.outputs.docs_only != 'true' && needs.classify.outputs.data_only != 'true' && needs.classify.outputs.thresholds_only != 'true' && needs.classify.outputs.setup_only != 'true'
    uses: $/.github/workflows/eslint.yml

  panel-layout:
    needs: classify
    if: needs.classify.outputs.docs_only != 'true' && needs.classify.outputs.data_only != 'true' && needs.classify.outputs.comment_only != 'true' && needs.classify.outputs.thresholds_only != 'true' && needs.classify.outputs.setup_only != 'true'
    uses: $/.github/workflows/panel-layout.yml

  smoke:
    needs: classify
    if: needs.classify.outputs.docs_only != 'true' && needs.classify.outputs.thresholds_only != 'true' && needs.classify.outputs.setup_only != 'true'
    uses: $/.github/workflows/smoke.yml

  docker-smoke:
    needs: classify
    if: needs.classify.outputs.docs_only != 'true' && needs.classify.outputs.data_only != 'true' && needs.classify.outputs.thresholds_only != 'true' && needs.classify.outputs.setup_only != 'true'
    uses: $/.github/workflows/docker-smoke.yml

  audit:
    needs: classify
    if: needs.classify.outputs.docs_only != 'true' && needs.classify.outputs.data_only != 'true' && needs.classify.outputs.thresholds_only != 'true' && needs.classify.outputs.setup_only != 'true'
    uses: $/.github/workflows/audit.yml

  actionlint:
    needs: classify
    if: needs.classify.outputs.docs_only != 'true' && needs.classify.outputs.data_only != 'true' && needs.classify.outputs.thresholds_only != 'true' && needs.classify.outputs.setup_only != 'true'
    uses: $/.github/workflows/actionlint.yml

  codeql:
    # NOT narrowed by comment_only: `// codeql[...]` / `// lgtm[...]` are
    # comment-keyed alert suppressions, so a comment-only diff CAN change
    # CodeQL's verdict.
    needs: classify
    if: needs.classify.outputs.docs_only != 'true' && needs.classify.outputs.data_only != 'true' && needs.classify.outputs.thresholds_only != 'true' && needs.classify.outputs.setup_only != 'true'
    uses: $/.github/workflows/codeql.yml
    permissions:
      # Writing the analysis is the whole point of the callee; the rest
      # stays read-only, as codeql.yml itself declares per job.
      security-events: write
      actions: read
      contents: read

  setup-docs:
    needs: classify
    if: needs.classify.outputs.setup_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13.14"

      - name: Restore the pip cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-3.13-${{ hashFiles('backend/requirements.txt', 'requirements-test.txt') }}

      - name: Install dependencies
        run: python3 -m pip install -r backend/requirements.txt -r requirements-test.txt

      - name: Save the pip cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-3.13-${{ hashFiles('backend/requirements.txt', 'requirements-test.txt') }}

      - name: Guard the pinned setup documentation
        run: python3 -m pytest tests/test_docs_setup.py -q

  aggregate:
    needs: [classify, tests, test-data, lint, types, eslint, panel-layout,
            smoke, docker-smoke, audit, actionlint, codeql, setup-docs]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check no tracked file carries a merge-conflict marker
        # A conflict marker can look like Markdown prose to other gates. This
        # check runs even on docs-only changes, which skip every gate leg.
        run: |
          # git grep exits 1 for "no match" and above 1 for an error it could
          # not run, and a guard that reads its own error as a clean tree is
          # the false green this step exists to prevent.
          found=0
          git grep -nI -E '^(<{7}( |$)|>{7}( |$)|={7}$)' -- . || found=$?
          if [ "$found" -gt 1 ]; then
            echo "git grep exited $found, so no marker was looked for."
            exit "$found"
          fi
          if [ "$found" -eq 0 ]; then
            echo "A merge-conflict marker is committed. Resolve the conflict, rebase onto the target branch and push again."
            exit 1
          fi

      - name: Refuse a commit whose scope names a workflow outside the ci type
        # CONTRIBUTING's commit-subject rule allows a workflow's `name:` as
        # a scope only with type `ci`, and prose no gate reads is a
        # convention: two merged fix(tests) commits here predate the rule
        # and are the ambiguity that made the shared-name exemption a
        # documented one. In this job rather than a new one: a new job
        # would be a new required status context, which means editing the
        # ruleset. After the conflict-marker step and before the fold:
        # both read the head, and a head failing either never folds a
        # verdict.
        run: python3 scripts/ci/commit_scopes.py

      - name: Fold the leg results into one verdict
        env:
          CLAUDIT_NEEDS_JSON: ${{ toJSON(needs) }}
        # scripts/ci/aggregate_gate.py owns the verdict: success passes,
        # a skip passes only when the classification narrowed it, and
        # any other result fails — with the legs that decided named in
        # the verdict and in the step summary the script writes.
        run: python3 scripts/ci/aggregate_gate.py
