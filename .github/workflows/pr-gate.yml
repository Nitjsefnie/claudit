name: pr gate
# pull_request_target: a fork's pull_request token is read-only, so its
# comment and close would silently do nothing. The pinned action reads the
# template at the PR's base SHA and runs no pull-request code; the body
# reaches it through the API, never through an expression.
#
# The pin moved to Nitjsefnie-Actions/pr-gate v2.1.0. v2.1.0 adds the
# `require-commit-attribution` input, enabled below; the other action inputs,
# their defaults, and the composite step are unchanged. With it on, the gate
# auto-closes a pull request carrying a commit whose author or committer is
# unlinked or unrelated to the PR author, web-flow, a write-or-above account,
# or a co-author of the PR author. Because this step passes `github.token`, a
# 403 while reading collaborator permissions means no push access. The script
# the composite runs is not unchanged. The old pin is UNTAGGED: pr-gate has
# only ever released v1.0.0, v1.0.1, v2.0.0 and v2.1.0, and 39b1b91
# (2026-09-24) predates v1.0.0, so "the v1 line" would be a release that does
# not exist.    
#
# Two behaviours a consumer can observe:
#
#   - A run that CLOSES the pull request now exits 2. Exit 0 covers every
#     termination that leaves the PR open, merged, reopened, or closed by
#     someone else; exit 1 is an analysis or API failure. This one is in
#     v2.0.0's release notes and its README alike. Nothing here reads the exit
#     code, and nothing needs to: release.yml waits on check runs of the pushed
#     master SHA, a `pull_request_target` run is attached to the PR's head SHA
#     instead, and a rebase merge never lands that SHA on master. Only
#     `aggregate` is a required status check, so a red pr gate blocks no merge.
#   - The gate's closure power widened. What closes a pull request is one
#     expression, `closable` in scripts/ci/pr_gate.py. The old pin was
#     `bool(layout) or not related_may_reference(...)`; v2.0.0 inserts a third
#     disjunct between them, so a CLAIM failure now closes where it used to
#     comment, whenever one to twenty references were checked: a closing
#     reference to an issue not assigned to the PR's author, or no checked
#     issue assigned to the author at all. A mere mention of someone else's
#     issue beside a claimed one still passes. That is the whole of the
#     widening. The two rules that predate it are unchanged: a layout/content
#     failure closes, and so does a failing body naming no issue reference at
#     all — unless its Related section still carries reference-shaped text such
#     as a URL, which leaves it open with a corrective comment, as more than
#     twenty references also do. Nor is the widening in the v2.0.0 release
#     notes, which cover only the exit code, a stale-object 422 reopen retry,
#     and the claim pin.
on:
  pull_request_target:  # zizmor: ignore[dangerous-triggers]
    types: [opened, edited, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: read

concurrency:
  # Runs for one pull request queue and GitHub keeps only the newest pending
  # one. Never cancel: a cancelled run may already have closed, and the
  # queued run is what reads that and repairs it.
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  gate:
    # A reopen is authored by github-actions[bot] with this workflow's own
    # github.token, and GitHub's no-recursion exception holds such an event's
    # pull_request runs for approval: a draft closed and reopened loses its CI.
    if: >-
      github.event.pull_request.user.type != 'Bot'
      && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A folded scalar, so no trailing version comment: a `#` after the
      # content line is scalar text, not a comment, and lands in the `uses:`
      # value. The version is named in the header instead.
      - uses: >-
          Nitjsefnie-Actions/pr-gate@829cef9e10e31b48ce1590181d5cf82d6b5cbfa9
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          pull-request-number: ${{ github.event.pull_request.number }}
          pull-request-author: ${{ github.event.pull_request.user.login }}
          require-commit-attribution: 'true'
