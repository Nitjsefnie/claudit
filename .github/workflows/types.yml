name: types

# Type gate (issue #8): pyright at `basic` — strict on an existing
# codebase produces noise that gets ignored, which is worse than no
# check. Config is checked in (pyrightconfig.json) so CI and every editor
# use the same settings. This is also the one tool that owns
# unresolved-import reporting; pylint's import-error stays disabled.

on:
  push:
    branches: [master]
    paths-ignore:
      - '**/*.md'
      - 'PRESENTATION.txt'
      - 'docs/**'
      - 'examples/**'
      - '.claude/**'
      - 'LICENSE'
      - 'NOTICE'
      - '.gitignore'
  pull_request:
    branches: [master]
    paths-ignore:
      - '**/*.md'
      - 'PRESENTATION.txt'
      - 'docs/**'
      - 'examples/**'
      - '.claude/**'
      - 'LICENSE'
      - 'NOTICE'
      - '.gitignore'
  workflow_dispatch:

# Least privilege: every job here only reads the tree. Without an
# explicit block the job inherits the repository default, which can be
# read/write for the whole token.
permissions:
  contents: read

concurrency:
  group: types-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pyright:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this workflow pushes. Leaving the job token in
          # .git/config lets any later step — or anything a dependency
          # pulls in — reuse it.
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        # Runtime deps too, so pyright resolves third-party imports
        # instead of reporting them all as missing.
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r requirements-dev.txt

      - name: pyright
        run: pyright
