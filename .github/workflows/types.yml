name: types

# Type gate: pyright at `basic` — strict on an existing
# codebase produces noise that gets ignored, which is worse than no
# check. Config is checked in (pyrightconfig.json) so CI and every editor
# use the same settings. This is also the one tool that owns
# unresolved-import reporting; pylint's import-error stays disabled.

on:
  workflow_call:
  workflow_dispatch:

# Least privilege: every job here only reads the tree. Without an
# explicit block the job inherits the repository default, which can be
# read/write for the whole token.
permissions:
  contents: read

concurrency:
  group: types-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pyright:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this workflow pushes. Leaving the job token in
          # .git/config lets any later step — or anything a dependency
          # pulls in — reuse it.
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      # The pip cache restores on every event but is saved only from a push
      # of master: `cache: pip` saves in a post-job step that runs after the
      # pull-request checkout, so untrusted code would write the cross-run
      # cache a trusted run later installs from.
      - name: Restore the pip cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/pip
            ~/Library/Caches/pip
            ~\AppData\Local\pip\Cache
          key: pip-${{ runner.os }}-3.15-${{ hashFiles('backend/requirements.txt', 'requirements-dev.txt', 'requirements-test.txt', 'requirements-pyyaml.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-3.15-

      - name: Install dependencies
        # Runtime deps too, so pyright resolves third-party imports
        # instead of reporting them all as missing.
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes --only-binary=:all: --no-binary=PyYAML -r requirements-pyyaml.txt && pip install -r backend/requirements.txt -r requirements-dev.txt -r requirements-test.txt

      # Saved here, not in a post-job step: the install above populated the
      # cache, and the gate keeps every event but a push of master from
      # writing cross-run state.
      - name: Save the pip cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        with:
          path: |
            ~/.cache/pip
            ~/Library/Caches/pip
            ~\AppData\Local\pip\Cache
          key: pip-${{ runner.os }}-3.15-${{ hashFiles('backend/requirements.txt', 'requirements-dev.txt', 'requirements-test.txt', 'requirements-pyyaml.txt') }}

      - name: pyright
        run: pyright
