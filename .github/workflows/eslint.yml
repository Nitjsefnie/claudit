name: eslint

# JavaScript lint gate: browser sources and the CI coverage converter.
#
# Classic browser scripts share globals across tags; eslint.config.mjs
# reflects the script environment and cross-file globals. Keep stylistic
# rules off, consistent with Python. Tool pins belong in package.json,
# where Dependabot can see them, and npm ci must install the lockfile.
# The manifest is private and has only CI devDependencies: no frontend
# build step or runtime npm dependency (CONTRIBUTING.md).

on:
  workflow_call:
  workflow_dispatch:

# Least privilege: every job here only reads the tree. Without an
# explicit block the job inherits the repository default, which can be
# read/write for the whole token.
permissions:
  contents: read

concurrency:
  group: eslint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  eslint:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this workflow pushes. Leaving the job token in
          # .git/config lets any later step — or anything a dependency
          # pulls in — reuse it.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Pinned exactly, as every other version in this repo is: a tool
          # release must never turn CI red on an unchanged commit.
          # Same value tests.yml's node-executing leg runs on.
          node-version: "24.17.0"

      - name: Install the JS toolchain from the lockfile
        # npm ci, not npm install: it installs package-lock.json exactly and
        # refuses to resolve against the registry, so the pins in
        # package.json mean what they say.
        run: npm ci --no-audit --no-fund

      - name: eslint
        run: npx --no-install eslint 'src/**/*.js' 'src/**/*.jsx' scripts/ci/js_coverage.mjs
