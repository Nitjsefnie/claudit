name: eslint

# Frontend lint gate (issue #8): eslint over src/*.js and src/*.jsx.
#
# The app deliberately has NO bundler and NO build step — React is loaded
# via in-browser Babel, and the src files are classic browser scripts that
# share globals across <script> tags (window.HBar, window.humanCurrency,
# ...). The checked-in eslint.config.mjs reflects that reality:
# sourceType "script", the browser environment, and a globals list derived
# from public/index.html (React/ReactDOM CDN scripts, BACKEND_URL), every
# name the src files attach to window (window.X = ... and the
# Object.assign(window, {...}) block in event-helpers.jsx), AND top-level
# names one src file uses from another — the sources load as classic
# scripts, so those are cross-file globals without any window assignment.
# That file replaced .eslintrc.json, which eslint 10 no longer reads at all
# (issue #361). The rule set carried over unchanged; the browser
# environment did not — globals@17's set is not the one eslint 8 bundled.
# See eslint.config.mjs's own header for both, and do not restate a
# derivation here that the config owns.
#
# The value here is no-undef / no-unused-vars — an undefined variable in
# a component should be found by CI, not by a user. Stylistic rules stay
# off, consistent with the Python gate.
#
# The tool versions live in package.json, NOT here: pinned there, they are
# visible to Dependabot's npm ecosystem, which is what issue #361 was
# about. An inline `npm install eslint@8.57.1` in a run: line is a pin no
# update mechanism can see, and that is how the gate sat on an
# npm-deprecated release line (8.x) for a year. The manifest is
# private, carries devDependencies only and no scripts beyond `lint`, and
# nothing in the served app reads it — the frontend still has no npm
# dependency of its own (CONTRIBUTING.md).

on:
  # Trigger ownership moved to ci-gate.yml (issue #127): push and
  # pull_request fire ci-gate, which calls this workflow as a leg.
  # workflow_call is the leg's entry; workflow_dispatch keeps a direct
  # run possible.
  workflow_call:
  workflow_dispatch:

# Least privilege: every job here only reads the tree. Without an
# explicit block the job inherits the repository default, which can be
# read/write for the whole token.
permissions:
  contents: read

concurrency:
  group: eslint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  eslint:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this workflow pushes. Leaving the job token in
          # .git/config lets any later step — or anything a dependency
          # pulls in — reuse it.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Pinned exactly, as every other version in this repo is: a tool
          # release must never turn CI red on an unchanged commit (issue
          # #361). Same value tests.yml's node-executing leg runs on.
          node-version: "24.17.0"

      - name: Install the JS toolchain from the lockfile
        # npm ci, not npm install: it installs package-lock.json exactly and
        # refuses to resolve against the registry, so the pins in
        # package.json mean what they say. No zizmor adhoc-packages
        # suppression is needed any more — the finding was "installs a
        # package outside of a lockfile", and there is a lockfile.
        run: npm ci --no-audit --no-fund

      - name: eslint
        run: npx --no-install eslint 'src/**/*.js' 'src/**/*.jsx'
