name: eslint

# Frontend lint gate (issue #8): eslint over src/*.js and src/*.jsx.
#
# The app deliberately has NO bundler and NO build step — React is loaded
# via in-browser Babel, and the src files are classic browser scripts that
# share globals across <script> tags (window.HBar, window.humanCurrency,
# ...). The checked-in .eslintrc.json reflects that reality:
# sourceType "script", env browser, and a globals list derived from
# public/index.html (React/ReactDOM CDN scripts, BACKEND_URL), every
# name the src files attach to window (window.X = ... and the
# Object.assign(window, {...}) block in event-helpers.jsx), AND every
# top-level `function` declaration in src/**/*.js(x) — the sources load
# as classic scripts, so a top-level function is a cross-file global
# without any window assignment. Derivation is mechanical (grep
# '^function NAME' over src); extend it the same way when adding files.
#
# The value here is no-undef / no-unused-vars — an undefined variable in
# a component should be found by CI, not by a user. Stylistic rules stay
# off, consistent with the Python gate.
#
# There is deliberately NO package.json: versions are pinned right here,
# installed with --no-save into the (gitignored) node_modules, so the
# repo does not read as having adopted a build step.

on:
  # Trigger ownership moved to ci-gate.yml (issue #127): push and
  # pull_request fire ci-gate, which calls this workflow as a leg.
  # workflow_call is the leg's entry; workflow_dispatch keeps a direct
  # run possible.
  workflow_call:
  workflow_dispatch:

# Least privilege: every job here only reads the tree. Without an
# explicit block the job inherits the repository default, which can be
# read/write for the whole token.
permissions:
  contents: read

concurrency:
  group: eslint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  eslint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this workflow pushes. Leaving the job token in
          # .git/config lets any later step — or anything a dependency
          # pulls in — reuse it.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install eslint (pinned, no package.json, no build step)
        # zizmor: ignore[adhoc-packages]
        # The finding is "installs a package outside of a lockfile", and the
        # absence of a lockfile is the deliberate design documented at the
        # top of this file: a package.json here would read as the repo having
        # adopted a build step, which it has not. Both packages ARE pinned to
        # an exact version, so the risk the audit targets — an unpinned
        # install drifting under CI — does not apply. Revisit if the frontend
        # ever gains a real toolchain.
        run: npm install --no-save --no-package-lock --no-audit --no-fund eslint@8.57.1 eslint-plugin-react@7.37.5

      - name: eslint
        run: npx --no-install eslint 'src/**/*.js' 'src/**/*.jsx'
