name: lint

# Lint gate (issue #8): pylint + pycodestyle. Style is deliberately NOT
# enforced (line-too-long off, max-line-length 10000) — this gate exists
# for real defects, not formatting opinions. import-error and
# no-name-in-module stay disabled in pylint on purpose: pyright (the
# `types` workflow) is the one tool that owns unresolved-import reporting.
# Separate workflow from tests so a lint failure is distinguishable from a
# test failure at a glance.

on:
  push:
    branches: [master]
    # Deny-list rather than an allow-list, matching tests.yml: a new
    # top-level code directory would silently stop being checked under an
    # allow-list.
    paths-ignore:
      - '**/*.md'
      - 'PRESENTATION.txt'
      - 'examples/**'
      - '.claude/**'
      - 'LICENSE'
      - 'NOTICE'
      - '.gitignore'
      - '.github/ci-thresholds.json'
  # Same PR policy as tests.yml: one run per commit, on the merge ref.
  pull_request:
    branches: [master]
    paths-ignore:
      - '**/*.md'
      - 'PRESENTATION.txt'
      - 'examples/**'
      - '.claude/**'
      - 'LICENSE'
      - 'NOTICE'
      - '.gitignore'
  workflow_dispatch:

# Least privilege: every job here only reads the tree. Without an
# explicit block the job inherits the repository default, which can be
# read/write for the whole token.
permissions:
  contents: read

concurrency:
  group: lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this workflow pushes. Leaving the job token in
          # .git/config lets any later step — or anything a dependency
          # pulls in — reuse it.
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # The pip cache restores on every event but is saved only from a push
      # of master: `cache: pip` saves in a post-job step that runs after the
      # pull-request checkout, so untrusted code would write the cross-run
      # cache a trusted run later installs from (issue #126).
      - name: Restore the pip cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/pip
            ~/Library/Caches/pip
            ~\AppData\Local\pip\Cache
          key: pip-${{ runner.os }}-3.13-${{ hashFiles('requirements-dev.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-3.13-

      - name: Install linters
        id: install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Saved here, not in a post-job step: the install above populated the
      # cache, and the gate keeps every event but a push of master from
      # writing cross-run state (issue #126).
      - name: Save the pip cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        with:
          path: |
            ~/.cache/pip
            ~/Library/Caches/pip
            ~\AppData\Local\pip\Cache
          key: pip-${{ runner.os }}-3.13-${{ hashFiles('requirements-dev.txt') }}

      - name: pylint
        run: git ls-files '*.py' | xargs pylint

      - name: pycodestyle
        # Runs even when pylint is red, so one push reports both gates —
        # but not when the install itself failed.
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: git ls-files '*.py' | xargs pycodestyle
