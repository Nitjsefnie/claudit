name: test data explore

# The daily explorer for the perturbed-data leg: the gate
# leg runs three FIXED seeds so its verdict is deterministic, and the
# fixed three sample one corner of the seed domain; this run draws
# three wall-clock seeds a day and runs the same full suite per seed.
# It is NOT a gate leg — ci-gate.yml is untouched — so a red explorer
# means "look at this seed", never "block the push". The stamps are
# decoupled from the seed, so any drawn seed is safe
# against the closed-window pins.

on:
  schedule:
    # Daily, off the hour: the top of the hour is when every cron on
    # GitHub fires at once and jobs queue.
    - cron: '47 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A dispatched run queues behind the day's scheduled one rather than
  # interleaving with it in the log; neither writes anything back.
  group: test-data-explore
  cancel-in-progress: false

jobs:
  seeds:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      seed-base: ${{ steps.draw.outputs.seed_base }}
    steps:
      - id: draw
        # One wall-clock draw per run: the base every seed derives from.
        # Each seed-index adds its own offset, so the four shards of one
        # seed-index share an identical perturbation while the three seeds
        # stay distinct — and a new run draws a fresh base off the clock.
        run: echo "seed_base=$(date +%s)" >> "$GITHUB_OUTPUT"

  perturbed-suite-explore:
    needs: seeds
    name: perturbed suite (explorer) seed ${{ matrix.seed-index }} shard ${{ matrix.shard }}
    strategy: {fail-fast: false, matrix: {seed-index: [1, 2, 3], shard: [1, 2, 3, 4]}}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    env:
      # Fixtures build DSNs as `postgresql:///<db>` with no host, so libpq
      # resolves the connection from these. The same vars drive the
      # psql calls the fixtures shell out to.
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Committed-tree tests read the judged range for declared-removal
          # exemptions; the resolver needs history to find the merge-base.
          fetch-depth: 0
          persist-credentials: false

      - name: Start cached Postgres
        uses: $/.github/actions/postgres

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      # Schedule/dispatch has no judged removal range: the resolver exports
      # an empty base, so committed-tree checks grant no exemptions. These
      # runs exercise data changes, and master seeds removals in its gate run.
      - name: Resolve the threshold base
        uses: $/.github/actions/thresholds-base
        env:
          CLAUDIT_REPO: ${{ github.repository }}
          CLAUDIT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          CLAUDIT_EVENT: ${{ github.event_name }}
          CLAUDIT_BEFORE: ${{ github.event.before }}

      # Restore only: schedule/dispatch cannot write the shared pip cache.
      - name: Restore the pip cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/pip
            ~/Library/Caches/pip
            ~\AppData\Local\pip\Cache
          key: pip-${{ runner.os }}-3.15-${{ hashFiles('backend/requirements.txt', 'requirements-test.txt', 'requirements-pyyaml.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-3.15-

      - name: Install postgresql-client
        timeout-minutes: 5
        uses: $/.github/actions/apt-install
        with:
          packages: postgresql-client-16

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes --only-binary=:all: --no-binary=PyYAML -r requirements-pyyaml.txt && pip install -r backend/requirements.txt -r requirements-test.txt

      # Keep the common post-install save shape; its push gate excludes this workflow.
      - name: Save the pip cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && matrix.shard == 1
        with:
          path: |
            ~/.cache/pip
            ~/Library/Caches/pip
            ~\AppData\Local\pip\Cache
          key: pip-${{ runner.os }}-3.15-${{ hashFiles('backend/requirements.txt', 'requirements-test.txt', 'requirements-pyyaml.txt') }}

      - name: Perturb and test, per wall-clock seed
        env:
          CLAUDIT_PERTURBED_DATA: "1"
          CLAUDIT_SEED_BASE: ${{ needs.seeds.outputs.seed-base }}
        # One wall-clock draw from the seeds job per run; each seed-index
        # adds its offset, shared by all four shards.
        run: |
          SEED="$((CLAUDIT_SEED_BASE + ${{ matrix.seed-index }}))"
          echo "::notice::perturbed-suite seed=$SEED shard=${{ matrix.shard }}"
          git checkout -- src/pricing.json backend/constants.py \
            backend/parser_version.py
          if python scripts/ci/perturb_test_data.py --seed "$SEED" && {
            # shellcheck disable=SC2046
            python -m pytest $(python3 scripts/ci/pytest_shards.py --shard ${{ matrix.shard }} --of 4) -q --tb=short -ra
          }; then
            echo "seed=$SEED shard=${{ matrix.shard }} ok" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "seed=$SEED shard=${{ matrix.shard }} failed" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
