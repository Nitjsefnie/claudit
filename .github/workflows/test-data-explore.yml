name: test data explore

# The daily explorer for the perturbed-data leg (issue #226): the gate
# leg runs three FIXED seeds so its verdict is deterministic, and the
# fixed three sample one corner of the seed domain; this run draws
# three wall-clock seeds a day and runs the same full suite per seed.
# It is NOT a gate leg — ci-gate.yml is untouched — so a red explorer
# means "look at this seed", never "block the push". The stamps are
# decoupled from the seed (issue #227), so any drawn seed is safe
# against the closed-window pins.

on:
  schedule:
    # Daily, off the hour: the top of the hour is when every cron on
    # GitHub fires at once and jobs queue.
    - cron: '47 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A dispatched run queues behind the day's scheduled one rather than
  # interleaving with it in the log; neither writes anything back.
  group: test-data-explore
  cancel-in-progress: false

jobs:
  perturbed-suite-explore:
    name: perturbed suite (explorer)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read

    services:
      postgres:
        # Same service the gate leg uses: fixtures create and drop
        # run-named databases (tests/scratch_db.py), so the role needs
        # CREATEDB — the stock `postgres` superuser has it.
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Fixtures build DSNs as `postgresql:///<db>` with no host, so libpq
      # resolves the connection from these. The same vars drive the
      # psql calls the fixtures shell out to.
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Depth 2, so the suite-cost re-seed marker is readable from
          # the pull request's head one level under the merge commit
          # (scripts/ci/reseed.py); see tests.yml's portable job for the
          # full reasoning.
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # The pip cache restores on every event but is saved only from a push
      # of master (issue #126): no setup-python step owns the cache, and the
      # save sits directly after the dependency install, below. This
      # workflow is never a push, so it restores-only; the gated save keeps
      # the shape every dependency-installing workflow shares.
      - name: Restore the pip cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/pip
            ~/Library/Caches/pip
            ~\AppData\Local\pip\Cache
          key: pip-${{ runner.os }}-3.13-${{ hashFiles('backend/requirements.txt', 'requirements-test.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-3.13-

      - name: Install postgresql-client
        # Fixtures shell out to psql; the runner image has
        # a server but the client binaries must match the service major.
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r requirements-test.txt

      # Saved here, not in a post-job step: the install above populated the
      # cache, and this workflow keeps every event but a push of master
      # from writing cross-run state (issue #126) — which, on a
      # schedule/dispatch-only workflow, is every run of it.
      - name: Save the pip cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        with:
          path: |
            ~/.cache/pip
            ~/Library/Caches/pip
            ~\AppData\Local\pip\Cache
          key: pip-${{ runner.os }}-3.13-${{ hashFiles('backend/requirements.txt', 'requirements-test.txt') }}

      - name: Wait for postgres
        run: |
          for _ in $(seq 1 30); do
            pg_isready -q && exit 0
            sleep 1
          done
          echo "postgres never became ready"; exit 1

      - name: Perturb and test, per wall-clock seed
        # Three seeds per run, drawn straight off the clock. Every seed
        # runs even after one fails; each failing seed is appended to
        # the run summary by name, and the step goes red at the end so
        # the run is seen. The clean-tree restore precedes every
        # perturb, so no seed ever perturbs a perturbed tree.
        run: |
          fail=0
          for _ in 1 2 3; do
            SEED="$(date +%s)"
            echo "::notice::perturbed-suite seed=$SEED"
            git checkout -- src/pricing.json backend/constants.py
            if python scripts/ci/perturb_test_data.py --seed "$SEED" \
               && python -m pytest tests/ -q --tb=short -ra; then
              echo "seed=$SEED ok" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "seed=$SEED failed" >> "$GITHUB_STEP_SUMMARY"
              fail=1
            fi
          done
          exit "$fail"
