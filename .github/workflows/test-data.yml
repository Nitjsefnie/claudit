name: test data

# The perturbed-data gate leg: the second half of
# SV-TEST-DATA's enforcement. ci-gate calls this workflow as a leg; it
# perturbs the tree's test data (scripts/ci/perturb_test_data.py: every
# rate row gains five appended entries — scaled whole by ×2.0, ×0.37,
# and a per-row irregular factor in [0.61, 1.47), then by five
# independent per-field factors, then a single-field move; a zero rate
# becomes one — and the three version constants bumped) and runs the
# FULL suite against the perturbed tree — no coverage, no ratchet; the
# verdict is pass/fail of the suite on data the repository changes by
# design. A test that pins repository-managed data fails here as a test
# failure, on this tree, before it can fail a refresh bot's run.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Push and pull_request runs arrive as ci-gate legs under the caller's
  # event; a push leg keys on its own commit SHA, so a newer
  # master push never cancels or pending-supersedes an older commit's
  # leg — on a per-ref push group GitHub keeps at most one PENDING run,
  # which a third concurrent push replaces. Direct dispatch runs queue
  # on their ref.
  group: test-data-${{ github.event.pull_request.number
    || (github.event_name == 'push' && github.sha) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  perturbed-suite:
    name: perturbed suite (seed ${{ matrix.seed }}, shard ${{ matrix.shard }} of 4)
    strategy:
      # Every seed's own verdict, not the first failure's: the seeds are
      # independent trees, and fail-fast's
      # cancellation would discard a seed that was still to report.
      fail-fast: false
      matrix:
        seed: ["42", "1234567890", "1720000000"]
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 25

    permissions:
      contents: read

    env:
      # Fixtures build DSNs as `postgresql:///<db>` with no host, so libpq
      # resolves the connection from these. The same vars drive the
      # psql calls the fixtures shell out to.
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Committed-tree tests read the judged range for declared-removal
          # exemptions; the resolver needs history to find the merge-base.
          fetch-depth: 0
          persist-credentials: false

      - name: Start cached Postgres
        uses: $/.github/actions/postgres

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Resolve the threshold base
        uses: $/.github/actions/thresholds-base
        env:
          CLAUDIT_REPO: ${{ github.repository }}
          CLAUDIT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          CLAUDIT_EVENT: ${{ github.event_name }}
          CLAUDIT_BEFORE: ${{ github.event.before }}

      # The pip cache restores on every event but is saved only from a push
      # of master: no setup-python step owns the cache, and the
      # save sits directly after the dependency install, below.
      - name: Restore the pip cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/pip
            ~/Library/Caches/pip
            ~\AppData\Local\pip\Cache
          key: pip-${{ runner.os }}-3.15-${{ hashFiles('backend/requirements.txt', 'requirements-test.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-3.15-

      - name: Install postgresql-client
        timeout-minutes: 5
        uses: $/.github/actions/apt-install
        with:
          packages: postgresql-client-16

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r requirements-test.txt && pip install --require-hashes --only-binary=:all: --no-binary=PyYAML -r requirements-pyyaml.txt

      # Saved here, not in a post-job step: the install above populated the
      # cache, and the gate keeps every event but a push of master from
      # writing cross-run state. One seed/shard writes the shared key.
      - name: Save the pip cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && matrix.seed == '42' && matrix.shard == 1
        with:
          path: |
            ~/.cache/pip
            ~/Library/Caches/pip
            ~\AppData\Local\pip\Cache
          key: pip-${{ runner.os }}-3.15-${{ hashFiles('backend/requirements.txt', 'requirements-test.txt') }}

      - name: Perturb and test
        # Each seed tests an independent refresh-like tree. Parallel jobs
        # retain each verdict. The bench restores pricing and versions before
        # perturbing; stamps stay seed-independent. Attribution goes in the summary.
        run: |
          python scripts/ci/perturbed_leg_bench.py \
            --seed "${{ matrix.seed }}" \
            --shard "${{ matrix.shard }}" --of 4 \
            --measurement "perturbed-${{ matrix.seed }}-${{ matrix.shard }}.json" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload the shard measurement
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perturbed-${{ matrix.seed }}-${{ matrix.shard }}
          path: perturbed-${{ matrix.seed }}-${{ matrix.shard }}.json
          if-no-files-found: error

  perturbed-combine:
    needs: [perturbed-suite]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Download the shard measurements
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: perturbed-*
          path: shard-data
      - name: Combine the shard measurements
        run: |
          python scripts/ci/perturbed_leg_combine.py --measurements shard-data \
            --seed 42 --seed 1234567890 --seed 1720000000 --of 4 \
            --summary "$GITHUB_STEP_SUMMARY"
