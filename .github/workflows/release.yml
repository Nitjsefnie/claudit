name: release

# WHY IT WAITS FOR THE OTHER GATES. A tag is the one artefact here that
# outlives a mistake — you can force-push a branch, but a release people
# have pulled is permanent, and cutting one from a red commit publishes
# the breakage under a version number. So this job blocks on the gates
# that vouch for the same SHA before it creates anything — which is not
# every check run that happens to sit on it (see the wait step).
#
# The workflow_run trigger starts this release only after ci gate
# completes, so no runner polls through that gate. A dispatch run
# re-cuts a specific commit.
#
# It deliberately does NOT bump VERSION itself. Deciding that a change is
# a patch or a minor is a judgement about what changed, and a workflow
# that guesses it would be wrong in exactly the cases that matter. Edit
# VERSION in the commit that earns the bump; this reacts to that.
#
# DEV VERSIONS ARE SKIPPED. Between releases, VERSION
# carries the next version with a `-dev` suffix (`0.4.0-dev`); a release
# is the suffix being dropped, and VERSION is bumped to the next `-dev`
# immediately after a release lands. Validation below accepts the
# suffix, and every step after it is skipped while one is set — a dev
# version must not create a tag, because a `v*-dev` tag would squat the
# version string forever. The version-guard workflow keeps the tree
# version from naming an already-published release.

on:
  workflow_run:  # zizmor: ignore[dangerous-triggers]
    # The trigger's hazard — event data or code from another branch's run reaching a
    # privileged job — does not apply: the job's if admits only a push event whose head
    # branch is master (a fork PR's run has event pull_request and never passes it), the
    # file runs from the default branch, and the selector uses github.workflow_sha.
    # That is the workflow file's own commit; release refs are only API data.
    workflows: [ci gate]
    types: [completed]
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit to release (default: the branch tip)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # NOT cancel-in-progress, unlike every other workflow here. A superseded
  # test run tells you nothing and is worth cancelling; a superseded
  # release run may be halfway through creating a tag.
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      # Creating the tag and the release.
      contents: write
      # Reading the other workflows' results for this SHA.
      checks: read
      # Reading the EVENT and head SHA of the runs behind those results.
      # The wait judges a check run by the run that produced it, and the
      # runs listing is the only place the event lives.
      actions: read

    steps:
      - name: Read and validate VERSION
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          CLAUDIT_REPO: ${{ github.repository }}
          CLAUDIT_SHA: ${{ inputs.sha || github.event.workflow_run.head_sha || github.sha }}
        run: |
          version="$(gh api -H 'Accept: application/vnd.github.raw' "repos/$CLAUDIT_REPO/contents/VERSION?ref=$CLAUDIT_SHA")"
          version="$(echo "$version" | tr -d '[:space:]')"
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "VERSION is not semver: '$version'" >&2
            echo "(expected X.Y.Z with an optional -suffix; no leading" >&2
            echo "'v' — the tag prefix is added here)" >&2
            exit 1
          fi
          # The core has no hyphen, so the first `-` starts the suffix.
          if echo "$version" | grep -q -- '-'; then
            echo "prerelease=${version#*-}" >> "$GITHUB_OUTPUT"
            echo "Development version $version — nothing to release; every later step is skipped"
          else
            echo "prerelease=" >> "$GITHUB_OUTPUT"
            echo "Releasing v$version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Refuse to re-release an existing tag
        if: steps.version.outputs.prerelease == ''
        env:
          GH_TOKEN: ${{ github.token }}
          CLAUDIT_TAG: ${{ steps.version.outputs.tag }}
          CLAUDIT_REPO: ${{ github.repository }}
        # A bump to a version that already exists means either a mistaken
        # edit or a rerun after a partial failure. Both want a human, and
        # both are silent if this step is a no-op instead of an error.
        #
        # The tag half is here because `gh release create --target` applies
        # the target only when gh creates the tag itself: if the tag already
        # exists, the release attaches to whatever commit the tag names — a
        # commit whose checks this run never waited on. And v* tags are
        # protected by a ruleset once created: they cannot be moved or
        # deleted, so a wrongly created tag permanently blocks that version
        # string, and refusing before create is the only remedy.
        #
        # BOTH PROBES FAIL CLOSED, as version-guard.yml's do:
        # a 404 is the only answer that proves absence; anything else
        # (auth, rate limit, 5xx, network) must not read as "the version
        # is free". The release probe goes through `gh api` rather than
        # `gh release view` for the uniform `HTTP 404` error text — it is
        # the same endpoint underneath.
        run: |
          if tag_probe="$(gh api "repos/$CLAUDIT_REPO/git/ref/tags/$CLAUDIT_TAG" 2>&1)"; then
            echo "Tag $CLAUDIT_TAG already exists — VERSION was set to a" >&2
            echo "version that has already been tagged. Bump it" >&2
            echo "further; the tag itself cannot be deleted." >&2
            exit 1
          elif echo "$tag_probe" | grep -q 'HTTP 404'; then
            : # tag absent — the only trustworthy "not published" answer
          else
            echo "could not verify the tag probe for $CLAUDIT_TAG — failing closed" >&2
            exit 1
          fi

          if release_probe="$(gh api "repos/$CLAUDIT_REPO/releases/tags/$CLAUDIT_TAG" 2>&1)"; then
            echo "Release $CLAUDIT_TAG already exists — VERSION was set to a" >&2
            echo "version that has already shipped. Bump it further, or" >&2
            echo "delete that release if it was cut in error." >&2
            exit 1
          elif echo "$release_probe" | grep -q 'HTTP 404'; then
            : # release absent — same rule as the tag probe
          else
            echo "could not verify the release probe for $CLAUDIT_TAG — failing closed" >&2
            exit 1
          fi

          echo "$CLAUDIT_TAG is free"

      - name: Wait for the other gates on this commit
        if: steps.version.outputs.prerelease == ''
        env:
          GH_TOKEN: ${{ github.token }}
          CLAUDIT_SHA: ${{ inputs.sha || github.event.workflow_run.head_sha || github.sha }}
          CLAUDIT_REPO: ${{ github.repository }}
          CLAUDIT_SELF_JOB: ${{ github.job }}
          CLAUDIT_SELF_RUN_ID: ${{ github.run_id }}
          CLAUDIT_SELF_WORKFLOW_REF: ${{ github.workflow_ref }}
          CLAUDIT_SELECTOR_SHA: ${{ github.workflow_sha }}
        # Wait for the commit's gates; the selector's rule and fail-closed
        # behavior live in scripts/ci/release_gate.py's module docstring.
        # Deadline/poll knobs: CLAUDIT_RELEASE_WAIT_SECONDS and
        # CLAUDIT_RELEASE_WAIT_POLL_SECONDS.
        run: |
          gh api -H 'Accept: application/vnd.github.raw' "repos/$CLAUDIT_REPO/contents/scripts/ci/release_gate.py?ref=$CLAUDIT_SELECTOR_SHA" > "$RUNNER_TEMP/release_gate.py"
          # CLAUDIT_RELEASE_WAIT_SECONDS / CLAUDIT_RELEASE_WAIT_POLL_SECONDS override the 2700 s / 20 s defaults.
          #
          # github.workflow_ref is `owner/repo/.github/workflows/release.yml@refs/heads/<branch>`
          # (the same value as GITHUB_WORKFLOW_REF). Two strips give the path
          # this run's own workflow file has in this checkout. It is read
          # from the RUN, never from the runs listing below: a dispatch
          # carrying `sha=` records its own run against the BRANCH TIP, so a
          # re-cut of a non-tip commit is absent from a listing filtered by
          # head SHA — and without its path the selector would judge the
          # earlier release run's row on that commit and refuse forever.
          self_path="${CLAUDIT_SELF_WORKFLOW_REF#"$CLAUDIT_REPO"/}"
          self_path="${self_path%%@*}"
          # A repo with differing case leaves the prefix behind,
          # and anything that is not a path under .github/workflows/ is not
          # this workflow's file. Hand the selector an EMPTY path there, so
          # it falls back to the runs listing rather than excluding nothing
          # that matches a wrong prefix.
          case "$self_path" in
            .github/workflows/*) ;;
            *) self_path="" ;;
          esac
          deadline=$(( SECONDS + ${CLAUDIT_RELEASE_WAIT_SECONDS:-${RELEASE_WAIT_SECONDS:-2700}} ))
          while [ "$SECONDS" -lt "$deadline" ]; do
            gh api --paginate -H "Cache-Control: no-cache" \
              "repos/$CLAUDIT_REPO/commits/$CLAUDIT_SHA/check-runs?per_page=100" > "$RUNNER_TEMP/checks.json"
            gh api --paginate -H "Cache-Control: no-cache" \
              "repos/$CLAUDIT_REPO/actions/runs?head_sha=$CLAUDIT_SHA&per_page=100" > "$RUNNER_TEMP/runs.json"
            runs="$(python3 "$RUNNER_TEMP/release_gate.py" \
              --sha "$CLAUDIT_SHA" --self-job "$CLAUDIT_SELF_JOB" --self-run-id "$CLAUDIT_SELF_RUN_ID" \
              --self-path "$self_path" \
              --checks "$RUNNER_TEMP/checks.json" --runs "$RUNNER_TEMP/runs.json")"

            if [ -z "$runs" ]; then
              echo "no other check runs reported yet, waiting..."
              sleep "${CLAUDIT_RELEASE_WAIT_POLL_SECONDS:-${RELEASE_WAIT_POLL_SECONDS:-20}}"
              continue
            fi

            pending="$(echo "$runs" | grep -cv '^completed' || true)"
            if [ "$pending" -gt 0 ]; then
              echo "$pending check(s) still running:"
              echo "$runs" | grep -v '^completed' | awk '{print "    " $0}'
              sleep "${CLAUDIT_RELEASE_WAIT_POLL_SECONDS:-${RELEASE_WAIT_POLL_SECONDS:-20}}"
              continue
            fi

            echo "All checks completed:"
            echo "$runs" | awk '{print "    " $0}'
            bad="$(echo "$runs" \
              | awk -F'\t' '$2 != "success" && $2 != "skipped" && $2 != "neutral"')"
            if [ -n "$bad" ]; then
              echo "Refusing to release: these checks did not pass:" >&2
              echo "$bad" | awk '{print "    " $0}' >&2
              exit 1
            fi

            # The verdict is the proof the gates ran. All legs
            # skipped reports the same all-green rows as all legs passed,
            # so proceed only when `aggregate` — completed, success, from
            # the github-actions app — is among them; anything less keeps
            # polling.
            if ! echo "$runs" | awk -F'\t' '
                  $1 == "completed" && $2 == "success" &&
                  $3 == "aggregate" && $4 == "github-actions" { found = 1; exit }
                  END { exit !found }'; then
              echo "no ci gate / aggregate verdict yet, waiting..."
              sleep "${CLAUDIT_RELEASE_WAIT_POLL_SECONDS:-${RELEASE_WAIT_POLL_SECONDS:-20}}"
              continue
            fi

            echo "Every check passed — proceeding."
            exit 0
          done
          echo "Timed out waiting for checks on $CLAUDIT_SHA" >&2
          exit 1

      - name: Create the release
        if: steps.version.outputs.prerelease == ''
        env:
          GH_TOKEN: ${{ github.token }}
          CLAUDIT_REPO: ${{ github.repository }}
          CLAUDIT_TAG: ${{ steps.version.outputs.tag }}
          CLAUDIT_SHA: ${{ inputs.sha || github.event.workflow_run.head_sha || github.sha }}
        # --generate-notes builds the changelog from the commits since the
        # previous release, so the release body stays honest without anyone
        # maintaining a CHANGELOG by hand.
        run: |
          gh release create "$CLAUDIT_TAG" \
            --repo "$CLAUDIT_REPO" \
            --target "$CLAUDIT_SHA" \
            --title "$CLAUDIT_TAG" \
            --generate-notes
          echo "Released $CLAUDIT_TAG at $CLAUDIT_SHA"
          {
            echo "### Released [\`$CLAUDIT_TAG\`](https://github.com/${{ github.repository }}/releases/tag/$CLAUDIT_TAG)"
            echo
            echo "Commit \`$CLAUDIT_SHA\`, after every check on it passed."
          } >> "$GITHUB_STEP_SUMMARY"
