name: secrets

# Secret-scan gate: gitleaks sweeps the full tree and the full git history
# (git log -p) on every run, catching the credential GitHub's push
# protection does not — push protection covers provider-recognised
# patterns only, so an ad-hoc token, a session cookie, or a private URL
# with embedded credentials reaches master unremarked.
#
# THE CRON IS THE GATE FOR COMMITS NO WORKFLOW SAW. A push carrying
# [skip ci] can avoid the push trigger. The daily schedule scans the
# whole history.
#
# Nitjsefnie-Actions/secret-scan runs the scan: gitleaks 8.30.1 and that
# release's default rules, each checked against its digest. It reads
# .gitleaks.toml and .gitleaksignore from the commit the change is judged
# against (a pull request's base, a push's previous tip, otherwise the
# default branch's tip) and runs the default rules without the allowlists
# that exempt a file by its path alone. It takes no inputs and is pinned
# to a reviewed full commit SHA.
#
# Not a duplicate of scripts/secrecy-check.sh: that is the LOCAL check — a
# developer machine, a gitignored literal list — for this repo's own
# known-sensitive strings. This workflow is the CI-resident PATTERN
# scanner over the full history, and it runs even when no developer runs
# anything.

on:
  push:
    # master only. A branch pushed while a pull request is open would run
    # this a second time against the same SHA.
    branches: [master]
  pull_request:
  schedule:
    # Off the hour, and not 04:12 daily (audit.yml), 03:47 Wednesday
    # (codeql.yml), or :23 hourly (refresh-pricing.yml).
    - cron: '26 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the action scans the whole tree and history.
          fetch-depth: 0
          # Nothing here pushes; the job token must not survive the checkout.
          persist-credentials: false

      - uses: Nitjsefnie-Actions/secret-scan@f6b0956e1bfea8aec4a4524032c3e7bbbc35b28b # v1.1.0
