# Every dependency in this repo is pinned to an exact version, deliberately:
# a tool or library release must never turn CI red on an unchanged commit.
# The cost of that choice is that pins go stale silently, and a stale pin is
# how a fixed CVE stays exploitable. Dependabot pays that cost back — it is
# the counterpart to audit.yml, which detects the problem but cannot fix it.
# The npm entry below owns package.json + package-lock.json: the CI
# toolchain only. The frontend
# still has no npm dependency and no build step (see CONTRIBUTING.md and
# eslint.yml) — that manifest is private, carries devDependencies only, and
# nothing in the served app reads it. Pins inside a workflow `run:` line
# are invisible to update mechanisms.
# A `dependencies` block here would be the bundler creep CONTRIBUTING.md
# forbids; tests/test_js_toolchain.py fails if one appears.

version: 2
updates:
  # Root: requirements-dev.txt (lint/type toolchain) and
  # requirements-test.txt (coverage toolchain) — AND backend/requirements.txt
  # (the runtime and test dependencies the deployed service installs), which
  # the pip file fetcher reaches from here through its one-level walk of the
  # first-level subdirectories under the configured directory. A separate
  # /backend entry would double-own that file and open every backend bump
  # twice — there must be exactly one owner per
  # requirements file.
  - package-ecosystem: pip # zizmor: ignore[dependabot-cooldown] -- Exact pins and weekly CI-tested updates; fixes need no extra delay.
    directory: "/"
    schedule:
      interval: weekly
      day: wednesday
      time: "04:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    labels:
      - dependencies

  # The CI toolchain only: eslint (the JS lint gate), eslint-plugin-react and
  # globals and the AST coverage tools. One
  # grouped PR per run, for the same reason the actions entry is grouped — a
  # toolchain that half-moves is a lockfile that does not install, and the
  # grouping keeps eslint, its plugin and its config's `globals` dependency
  # reviewed as one change. Dependabot rewrites package.json and
  # package-lock.json in the same PR, so the pin and the tree it resolves to
  # can never disagree.
  - package-ecosystem: npm # zizmor: ignore[dependabot-cooldown] -- Exact pins and weekly CI-tested updates; fixes need no extra delay.
    directory: "/"
    schedule:
      interval: weekly
      day: wednesday
      time: "04:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    labels:
      - dependencies
    groups:
      js-toolchain:
        applies-to: version-updates
        patterns:
          - "*"
      # A group covers version updates only unless it names `applies-to`,
      # and security updates are enabled here — so a toolchain CVE bump
      # would arrive one package per PR, leaving eslint, its plugin and
      # globals on a lockfile that does not install. The twin group below
      # is what keeps the security bump atomic.
      js-toolchain-security:
        applies-to: security-updates
        patterns:
          - "*"

  # The workflows pin every action to a commit SHA with the version in a
  # trailing comment. A SHA pin does not move at all — which is the point,
  # since these jobs run with a repository token — and it is also why this
  # entry is not optional: without Dependabot a SHA pin is simply frozen
  # forever. It rewrites both the SHA and the comment.
  - package-ecosystem: github-actions # zizmor: ignore[dependabot-cooldown] -- Exact pins and weekly CI-tested updates; fixes need no extra delay.
    directory: "/"
    schedule:
      interval: weekly
      day: wednesday
      time: "04:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
    # github/codeql-action/init and .../analyze are separate dependencies to
    # Dependabot, so ungrouped it files ONE HALF-BUMP PR PER PIN — and a tree
    # whose init and analyze pins disagree fails every CodeQL run at SARIF
    # processing with "Error when processing the SARIF file". The group is what
    # keeps both pins in one atomic PR; the in-tree tripwire is
    # tests/test_ci_workflows.py.
    groups:
      actions:
        applies-to: version-updates
        patterns:
          - "*"
      # A group covers its own `applies-to` kind only, and the kind DEFAULTS
      # to version updates, so a version-updates group — explicit or by
      # default — is skipped by security updates entirely. They are enabled
      # here, so without the twin below a codeql-action CVE bump lands as one PR per
      # `uses:` line, which splits init and analyze across versions and turns
      # the security fix itself red at SARIF processing — the exact failure
      # the group above exists to prevent.
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"

  # The Postgres base image is pinned by digest on one FROM line in
  # .github/actions/postgres-image/Dockerfile, which this entry owns. The
  # ignore holds the pin inside major 16: a major bump changes on-disk
  # storage semantics and belongs to a deliberate migration, not a weekly
  # PR. Dependabot names the mirror.gcr.io image library/postgres — an
  # ignore on `postgres` does not match it.
  - package-ecosystem: docker # zizmor: ignore[dependabot-cooldown] -- Exact pins and weekly CI-tested updates; fixes need no extra delay.
    directory: /.github/actions/postgres-image
    schedule:
      interval: weekly
      day: wednesday
      time: "04:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
    ignore:
      - dependency-name: library/postgres
        update-types:
          - version-update:semver-major
