# Every dependency in this repo is pinned to an exact version, deliberately:
# a tool or library release must never turn CI red on an unchanged commit.
# The cost of that choice is that pins go stale silently, and a stale pin is
# how a fixed CVE stays exploitable. Dependabot pays that cost back — it is
# the counterpart to audit.yml, which detects the problem but cannot fix it.
#
# Note the interaction with the repo's CI policy: pull_request builds run
# unconditionally (there is no review gate — see tests.yml), so a Dependabot
# PR gets a CI run the moment it opens and the suite's verdict is on the PR
# before a human reads it.
#
# The npm entry below owns package.json + package-lock.json: the CI
# toolchain (eslint, eslint-plugin-react, c8, globals) and nothing else. The frontend
# still has no npm dependency and no build step (see CONTRIBUTING.md and
# eslint.yml) — that manifest is private, carries devDependencies only, and
# nothing in the served app reads it. It exists because the pins used to sit
# inside a workflow `run:` line, where no update mechanism can see them, and
# the gate drifted onto an npm-deprecated eslint 8 release line (issue #361).
# A `dependencies` block here would be the bundler creep CONTRIBUTING.md
# forbids; tests/test_js_toolchain.py fails if one appears.

version: 2
updates:
  # Root: requirements-dev.txt (lint/type toolchain) and
  # requirements-test.txt (coverage toolchain) — AND backend/requirements.txt
  # (the runtime and test dependencies the deployed service installs), which
  # the pip file fetcher reaches from here through its one-level walk of the
  # first-level subdirectories under the configured directory. A separate
  # /backend entry would double-own that file and open every backend bump
  # twice (#164 and #165, issue #176) — there must be exactly one owner per
  # requirements file.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: wednesday
      time: "04:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    labels:
      - dependencies

  # The CI toolchain only: eslint (the JS lint gate), eslint-plugin-react and
  # globals (what eslint.config.mjs reads), c8 (the JS coverage fold). One
  # grouped PR per run, for the same reason the actions entry is grouped — a
  # toolchain that half-moves is a lockfile that does not install, and the
  # grouping keeps eslint, its plugin and its config's `globals` dependency
  # reviewed as one change. Dependabot rewrites package.json and
  # package-lock.json in the same PR, so the pin and the tree it resolves to
  # can never disagree.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: wednesday
      time: "04:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    labels:
      - dependencies
    groups:
      js-toolchain:
        applies-to: version-updates
        patterns:
          - "*"

  # The workflows pin every action to a commit SHA with the version in a
  # trailing comment. A SHA pin does not move at all — which is the point,
  # since these jobs run with a repository token — and it is also why this
  # entry is not optional: without Dependabot a SHA pin is simply frozen
  # forever. It rewrites both the SHA and the comment.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: wednesday
      time: "04:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
    # github/codeql-action/init and .../analyze are separate dependencies to
    # Dependabot, so ungrouped it files ONE HALF-BUMP PR PER PIN — and a tree
    # whose init and analyze pins disagree fails every CodeQL run at SARIF
    # processing with "Error when processing the SARIF file" (issue #335:
    # every action-pin bump PR since 4.37.7 went red). The group is what
    # keeps both pins in one atomic PR; the in-tree tripwire is
    # tests/test_ci_workflows.py.
    groups:
      actions:
        applies-to: version-updates
        patterns:
          - "*"
